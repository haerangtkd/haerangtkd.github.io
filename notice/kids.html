<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>해랑경희 제자</title>
<meta name="theme-color" content="#A40F16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="해랑 제자">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 🥋 제자 모드 (2026-11-14). 학부모 앱과 같은 알림 서버(/k/…)를 씀.
     들어오기: 제자 폰 = 사범님이 업무 앱에서 만든 코드 / 학부모 앱(승인된 휴대폰) = 코드 없이 바로 (폰 없는 제자, 의견 정리 4번)
     홈(의견 정리 4·5번): 소식 줄(비교 대신 축하) · 내 띠 카드(띠 색, 목표 띠까지 몇 단계, 대표 뱃지 3개, 내 출석 QR) · 출석·기록 · 이번 달 심사 준비 · 미션(같이/혼자/선범단) · 받은 뱃지만
     ⭐ 선범단: 내 선범단 카드(본인만) · 선 모으기(모두 봄) · 선범단 명단. 제자끼리 글 주고받는 곳은 없음 (선범단방 닫음) -->
<style>
  :root{--brand:#A40F16;--ink:#1C1A19;--muted:#7A736E;--bg:#FFF8EF;--card:#fff;--line:#F0E6DA;--gold:#F2B705}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
  [hidden]{display:none!important}
  /* 로그인 */
  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .login .logo{font-size:64px}.login h1{font-size:26px;margin:8px 0 4px}.login p{color:var(--muted);margin:0 0 20px;line-height:1.6}
  .login input{width:100%;max-width:320px;font-size:28px;font-weight:900;letter-spacing:6px;text-align:center;text-transform:uppercase;border:3px solid var(--line);border-radius:18px;padding:16px;background:#fff}
  .login input:focus{outline:none;border-color:var(--brand)}
  .toP{display:block;margin:26px auto 0;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline}
  .big{border:0;background:var(--brand);color:#fff;font-size:20px;font-weight:900;border-radius:18px;padding:16px 28px;margin-top:14px;width:100%;max-width:320px}
  .err{color:#D92D20;font-weight:700;min-height:22px;margin-top:10px}
  /* 머리 */
  .hi{display:flex;align-items:center;gap:12px;margin:4px 2px 12px}
  .hi .av{width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;flex:none}
  .hi b{display:block;font-size:24px;font-weight:900}.hi small{color:var(--muted);font-size:14px}
  .sbtag{display:inline-block;background:linear-gradient(135deg,#F2B705,#E08E00);color:#fff;border-radius:999px;font-size:12px;font-weight:900;padding:3px 9px;margin-left:6px;vertical-align:middle}
  .card{background:var(--card);border-radius:24px;padding:16px;margin-top:12px;box-shadow:0 2px 0 rgba(164,15,22,.06)}
  .card h2{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:6px}.card h2 small{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row2 .card{margin-top:0}
  .row2-wrap{margin-top:12px}
  /* 띠 */
  .belt{height:34px;border-radius:8px;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 1px 0 rgba(0,0,0,.06);margin:6px 0 10px;overflow:hidden}
  .belt i{position:absolute;left:0;right:0;top:50%;height:10px;transform:translateY(-50%)}
  .belt .knot{position:absolute;left:50%;top:-4px;width:30px;height:42px;transform:translateX(-50%);border-radius:6px;background:inherit;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
  .bname{font-size:26px;font-weight:900;text-align:center}
  .bar{height:16px;border-radius:999px;background:#F3ECE3;overflow:hidden;margin-top:10px}.bar b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F2B705,var(--brand));transition:width 1s}
  .barl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;font-weight:700}
  /* 숫자 카드 */
  .num{font-size:46px;font-weight:900;line-height:1;letter-spacing:-1px}.num small{font-size:18px;margin-left:2px}
  .sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}
  .fire{font-size:30px;display:inline-block;animation:flick 1.2s infinite alternate}
  @keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.15) rotate(4deg)}}
  /* 미션 */
  .hw{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}.hw:first-of-type{border-top:0}
  .hw .t{flex:1;min-width:0}.hw .t b{display:block;font-size:16px}.hw .t small{color:var(--muted);font-size:12.5px}
  .hw button{border:0;border-radius:16px;padding:12px 16px;font-size:16px;font-weight:900;background:#F3ECE3;color:var(--ink);white-space:nowrap}
  .hw button.on{background:#1E9E5A;color:#fff}
  /* 오늘의 운동 */
  .today .tags{display:flex;flex-wrap:wrap;gap:8px}.today .tags span{background:#FFF0E0;color:#9A4A12;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px}
  .focus{margin-top:12px;background:linear-gradient(135deg,#E4F4ED,#D2EEE2);border-radius:16px;padding:12px 14px}.focus small{color:#2F6B55;font-weight:800;font-size:12.5px}.focus b{display:block;font-size:19px;margin-top:2px}
  /* 성장 */
  .grow{display:flex;align-items:center;gap:14px}.grow .num{font-size:40px}
  .up{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:15px}
  .best{display:inline-block;background:var(--gold);color:#5A3B00;border-radius:999px;padding:4px 12px;font-weight:900;font-size:13px;margin-left:6px;animation:shine 1.6s infinite}
  @keyframes shine{50%{filter:brightness(1.25)}}
  /* 배지 */
  .badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .bd{text-align:center;font-size:11.5px;font-weight:800;color:var(--ink);line-height:1.3}
  .bd .ic{width:58px;height:58px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 30% 30%,#FFF6D6,#F7D774);box-shadow:0 3px 0 #D9A80B}
  .bd.off{color:#B5ADA5}.bd.off .ic{background:#EFE9E2;box-shadow:none;filter:grayscale(1);opacity:.55}
  /* 명예의 전당 */
  .bestg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bestg div{background:#FFF7E6;border-radius:16px;padding:10px 12px}.bestg small{display:block;color:#9A6A12;font-size:12px;font-weight:800}.bestg b{font-size:17px}
  .bestg div.me{background:linear-gradient(135deg,#F2B705,#E08E00);color:#fff}.bestg div.me small{color:#fff}
  .comp{padding:10px 0;border-top:1px dashed var(--line)}.comp:first-of-type{border-top:0}.comp b{font-size:16px}.comp small{color:var(--muted);margin-left:6px}
  .medals{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.medals span{background:#F7F2EC;border-radius:999px;padding:5px 10px;font-size:13.5px;font-weight:700}.medals span.me{background:#FFE7A3}
  .mon{font-size:13px;font-weight:900;color:var(--brand);margin:12px 0 2px}
  .sbl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sbl div{display:flex;align-items:center;gap:8px;background:#FFF7E6;border-radius:14px;padding:8px 10px}.sbl div.me{outline:3px solid var(--gold)}
  .sbl i{width:26px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}.sbl b{font-size:15px}.sbl small{color:var(--muted);font-size:12px;margin-left:auto}
  .lock{text-align:center;padding:30px 10px}.lock div{font-size:54px}.lock b{display:block;font-size:20px;margin-top:8px}.lock p{color:var(--muted);line-height:1.6}
  .empty{color:var(--muted);text-align:center;padding:14px 0;font-size:14px}
  /* 아래 메뉴 */
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
  .nav button{flex:1;max-width:160px;border:0;background:none;border-radius:16px;padding:8px 4px;font-size:13px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
  .nav button span{font-size:26px}.nav button.on{background:#FFF0E0;color:var(--brand)}
  /* 생일 */
  .bday{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(40,10,10,.55)}
  .bday .box{position:relative;z-index:2;background:#fff;border-radius:28px;padding:26px 22px;text-align:center;width:min(86vw,360px);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .bday .box div{font-size:72px}.bday .box b{display:block;font-size:26px;margin-top:6px}.bday .box p{color:var(--muted);line-height:1.6;margin:8px 0 0}
  @keyframes pop{from{transform:scale(.4);opacity:0}}
  #fx{position:fixed;inset:0;z-index:51;pointer-events:none}
  .out{display:block;margin:22px auto 0;border:0;background:none;color:#B5ADA5;font-size:13px;text-decoration:underline}
  /* 소식 줄 */
  .news{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:9px 14px;margin:0 0 10px;font-size:14px;font-weight:700;overflow:hidden;box-shadow:0 2px 0 rgba(164,15,22,.06)}
  .news span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;animation:nin .5s}.news em{font-style:normal;color:var(--muted);font-size:12px;flex:none}
  @keyframes nin{from{opacity:0;transform:translateY(8px)}}
  /* 머리 · 프로필 */
  .hi .av{position:relative;font-size:32px}.hi .av.fr-fire{box-shadow:0 0 0 3px #F08A24,0 0 12px #F2B705}.hi .av.fr-gold{box-shadow:0 0 0 3px #F2B705,0 0 0 6px #FFF3C4}.hi .av.fr-trophy{box-shadow:0 0 0 3px #2F6FDE}
  .edit{margin-left:auto;flex:none;white-space:nowrap;border:0;background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;color:var(--muted)}
  .kpick{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}.kpick button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}.kpick button.on{border-color:var(--brand);color:var(--brand)}
  /* 내 띠 카드 */
  .bcard{border-radius:26px;padding:18px 18px 16px;margin-top:4px;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .bcard.light{color:var(--ink)}
  .bcard:after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
  .bcard .top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}.bcard .top small{font-weight:800;opacity:.85}
  .bcard .bn{font-size:30px;font-weight:900;margin:6px 0 2px;position:relative;z-index:1}
  .bcard .qb{margin-left:auto;border:0;background:rgba(255,255,255,.9);color:var(--ink);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:900}
  .steps{display:flex;gap:4px;margin-top:12px;position:relative;z-index:1}.steps i{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.35)}.steps i.on{background:#fff}.bcard.light .steps i{background:rgba(0,0,0,.1)}.bcard.light .steps i.on{background:var(--brand)}
  .bcard .sl{font-size:14px;font-weight:800;margin-top:8px;position:relative;z-index:1}
  .pins{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1}.pins button{flex:1;height:60px;border-radius:16px;border:2px dashed rgba(255,255,255,.7);background:rgba(255,255,255,.15);font-size:28px;color:inherit}
  .bcard.light .pins button{border-color:rgba(0,0,0,.15);background:rgba(0,0,0,.03)}.pins button.has{border-style:solid;background:rgba(255,255,255,.92)}.pins button small{display:block;font-size:10.5px;font-weight:800;color:var(--ink)}
  /* 심사 준비 */
  .prep .it{border-top:1px dashed var(--line);padding:10px 0}.prep .it:first-of-type{border-top:0}.prep .it b{display:block;font-size:13px;color:var(--brand)}.prep .it p{margin:4px 0 0;font-size:16px;line-height:1.6;white-space:pre-wrap}
  .prep .vid{display:block;text-align:center;background:#1C1A19;color:#fff;border-radius:16px;padding:12px;font-weight:900;text-decoration:none;margin-top:6px}
  .dd{background:var(--brand);color:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:900}
  .exr{background:#FFF7E6;border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px}
  .tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:900;margin-right:4px;vertical-align:1px}.tag.w{background:#E5F0FF;color:#1D63B0}.tag.s{background:#E4F4ED;color:#2F6B55}.tag.g{background:#FFF0C2;color:#8A5B00}
  /* 선범단 카드 */
  .sbc{perspective:1000px;margin-top:6px}.sbc .in{position:relative;height:220px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}.sbc.flip .in{transform:rotateY(180deg)}
  .sbc .f,.sbc .b{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#7A0B10,#A40F16 55%,#C8102E);box-shadow:0 8px 20px rgba(164,15,22,.25);overflow:hidden}
  .sbc.warn .f,.sbc.warn .b{background:linear-gradient(135deg,#C99A00,#F2B705 60%,#FFD54A);color:#3A2A00}
  .sbc .b{transform:rotateY(180deg)}
  .sbc .f:before{content:'⭐';position:absolute;right:14px;bottom:-14px;font-size:120px;opacity:.12}
  .sbc .t{font-size:12px;font-weight:900;letter-spacing:2px;opacity:.85}.sbc h3{margin:2px 0 0;font-size:20px}
  .sbc .ph{position:absolute;left:18px;top:62px;width:96px;height:120px;border-radius:12px;background:rgba(255,255,255,.18) center/cover;display:grid;place-items:center;font-size:44px;pointer-events:none;user-select:none;-webkit-user-select:none}
  .sbc .dt{position:absolute;left:130px;top:66px;right:14px;font-size:14px;line-height:1.75}.sbc .dt b{font-size:22px;display:block;line-height:1.2}
  .sbc .wn{position:absolute;right:14px;top:14px;background:#3A2A00;color:#FFD54A;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900}
  .sbc .b p{white-space:pre-wrap;line-height:1.7;font-size:15px;margin:8px 0 0}
  .flipn{text-align:center;color:var(--muted);font-size:12.5px;margin-top:6px}
  .sun{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}.sun:first-of-type{border-top:0}.sun b{flex:none;font-size:15px}.sun span{flex:1;font-size:14.5px}.sun small{color:var(--muted);font-size:12px;flex:none}
  .tally{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tally span{background:#FFF7E6;border-radius:999px;padding:5px 10px;font-size:13.5px;font-weight:800}.tally span.me{background:#FFE7A3}
  /* 아래에서 올라오는 창 */
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(30,10,10,.45);display:flex;align-items:flex-end;justify-content:center}
  .sheet .box{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .sheet h3{margin:4px 0 10px;font-size:19px}.sheet h4{margin:14px 0 8px;font-size:14px;color:var(--muted)}
  .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.opts button{position:relative;border:3px solid transparent;background:#F7F2EC;border-radius:16px;height:56px;font-size:28px}.opts button.on{border-color:var(--brand)}
  .opts button.lk{opacity:.4}.opts button.lk:after{content:'🔒';position:absolute;right:2px;bottom:0;font-size:14px}
  .opts.c button{font-size:0}
  .lockt{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:18px}
  .qrbox{text-align:center}.qrbox svg{width:min(70vw,260px);height:auto;border-radius:12px;border:8px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}
</style>
</head>
<body>
<section class="login" id="vLogin" hidden>
  <div class="logo">🥋</div>
  <h1>해랑경희 제자</h1>
  <p>도장에서 <b>사범님이 만들어 준 코드</b>를 넣어요</p>
  <input id="code" maxlength="10" autocomplete="off" autocapitalize="characters" placeholder="코드">
  <button class="big" id="go">들어가기</button>
  <div class="err" id="err"></div>
  <button class="toP" id="toP">👨‍👩‍👧 학부모 화면으로</button>
</section>
<div class="wrap" id="vApp" hidden><div id="body"></div><button class="out" id="toP2">👨‍👩‍👧 학부모 화면으로</button><button class="out" id="out">이 기기에서 나가기</button></div>
<nav class="nav" id="nav" hidden><button data-v="home" class="on"><span>🏠</span>나의 수련</button><button data-v="fame"><span>🏆</span>명예의 전당</button><button data-v="sb"><span>⭐</span>선범단</button></nav>
<canvas id="fx" hidden></canvas>
<script src="config.js"></script>
<script src="qr.js"></script>
<script>
  const API = window.HAERANG_PUSH_API || '', TK = 'haerang-kid-tok', $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } }, set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (_) {} } };
  // 학부모 앱(승인된 휴대폰)에서 오면 코드 없이 (2026-11-14): 학부모 앱 저장값 'haerang-parent'의 token
  const parentTok = () => { try { const p = JSON.parse(localStorage.getItem('haerang-parent') || 'null'); return p && p.token ? p.token : ''; } catch (_) { return ''; } };
  const viaParent = () => !store.get(TK) && !!parentTok();
  const post = async (path, body = {}) => { try { return await (await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign(store.get(TK) ? { tok: store.get(TK) } : { ptok: parentTok(), kid: store.get('haerang-kid-pick') }, body)) })).json(); } catch (_) { return { ok: false, error: '인터넷 연결을 확인해 주세요' }; } };
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const voc = n => { const g = firstName(n), c = g.charCodeAt(g.length - 1) - 0xAC00; return g + (c >= 0 && c <= 11171 && c % 28 > 0 ? '아' : '야'); }; // 해랑아 · 서아야
  const firstName = n => { n = String(n || '').trim(); return n.length >= 3 ? n.slice(1) : n; };
  const mask = n => { n = String(n || ''); return n.length >= 3 ? n[0] + '○'.repeat(n.length - 2) + n[n.length - 1] : n.length === 2 ? n[0] + '○' : n; }; // 소식 줄: 김○랑

    if (!p || p.closed || !(p.notes.speech || p.notes.eng || p.vid || p.date)) return res ? '<section class="card"><h2>🏅 심사</h2>' + res + '</section>' : '';
    const dd = p.date ? Math.round((new Date(p.date + 'T00:00:00Z') - new Date(D.today + 'T00:00:00Z')) / 864e5) : null;
    return '<section class="card prep"><h2>📝 이번 달 심사 준비' + (p.date && dd >= 0 ? '<small><span class="dd">' + (dd ? 'D-' + dd : '오늘!') + '</span> ' + md(p.date) + '</small>' : '') + '</h2>' +
      (p.notes.speech ? '<div class="it"><b>🎤 웅변 원고</b><p>' + esc(p.notes.speech) + '</p></div>' : '') + (p.notes.eng ? '<div class="it"><b>🔤 영어 문장</b><p>' + esc(p.notes.eng) + '</p></div>' : '') +
      (p.notes.kick ? '<div class="it"><b>🦵 발차기</b><p>' + esc(p.notes.kick) + '</p></div>' : '') + (p.notes.poom ? '<div class="it"><b>🥋 품새</b><p>' + esc(p.notes.poom) + '</p></div>' : '') +
      (p.vid ? '<a class="vid" href="' + esc(p.vid) + '" target="_blank" rel="noopener">▶ ' + esc(D.belt) + ' 품새 영상 보기</a>' : '') + (res ? '<div style="margin-top:10px">' + res + '</div>' : '') + '</section>';
  }
  function fame() {
    const me = D.name, q = (D.best || [])[(D.best || []).length - 1];
    let h = '<div class="hi"><span class="av" style="background:var(--gold)">🏆</span><div><b>명예의 전당</b><small>해랑경희의 멋진 제자들</small></div></div>';
    h += '<section class="card"><h2>🏆 최우수 수련생' + (q ? '<small>' + q.q.slice(0, 4) + '년 ' + q.q.slice(5) + '분기</small>' : '') + '</h2>' + (q ? '<div class="bestg">' + ['중고등부 남', '중고등부 여', '초등부 남', '초등부 여', '유치부 남', '유치부 여'].filter(k => (q.g || {})[k]).map(k => '<div class="' + (q.g[k] === me ? 'me' : '') + '"><small>' + k + '</small><b>' + esc(q.g[k]) + (q.g[k] === me ? ' 🎉' : '') + '</b></div>').join('') + '</div>' : '<div class="empty">곧 발표돼요! 누가 될까요? 👀</div>') + '</section>';
    const C = [...(D.comps || [])].sort((a, b) => b.date.localeCompare(a.date)), mdl = { 금: '🥇', 은: '🥈', 동: '🥉', 참가: '🎽' };
    let cm = ''; h += '<section class="card"><h2>🥇 대회 기록</h2>' + (C.length ? C.map(c => { const m = c.date.slice(0, 7), head = m !== cm ? '<div class="mon">' + (+m.slice(5)) + '월</div>' : ''; cm = m;
      return head + '<div class="comp"><b>' + esc(c.title) + '</b><small>' + md(c.date) + '</small><div class="medals">' + (c.rows || []).slice().sort((a, b) => '금은동참가'.indexOf(a.medal) - '금은동참가'.indexOf(b.medal)).map(r => '<span class="' + (r.name === me ? 'me' : '') + '">' + (mdl[r.medal] || '🎽') + ' ' + esc(r.name) + (r.ev ? ' · ' + esc(r.ev) : '') + '</span>').join('') + '</div></div>'; }).join('') : '<div class="empty">아직 올라온 대회 기록이 없어요</div>') + '</section>';
    return h;
  }
  // ── ⭐ 선범단: 내 카드(본인만) · 선 모으기(모두 봄) · 명단 ──
  function sbView() {
    const me = D.name, c = D.sbCard, sun = D.sun || [], mon = +D.today.slice(5, 7);
    let h = '<div class="hi"><span class="av" style="background:var(--gold)">⭐</span><div><b>선범단</b><small>다른 친구에게 모범이 되고 도와주는 제자</small></div></div>';
    if (D.sb && c) {
      h += '<div class="sbc' + (c.warn ? ' warn' : '') + '" id="sbc"><div class="in"><div class="f"><div class="t">HAERANG KYUNGHEE</div><h3>⭐ 해랑경희 선범단</h3>' + (c.warn ? '<span class="wn">⚠ 경고 ' + c.warn + '</span>' : '') +
        '<div class="ph"' + (c.photo ? ' style="background-image:url(' + c.photo + ')"' : '') + '>' + (c.photo ? '' : esc(profAv().e)) + '</div><div class="dt"><b>' + esc(me) + '</b>' + (c.no ? '선범단 No. ' + esc(c.no) + '<br>' : '') + (c.date ? '임명 ' + esc(c.date.replace(/-/g, '.')) + '<br>' : '') + esc(D.belt || '') + '</div></div>' +
        '<div class="b"><div class="t">MY PROMISE</div><h3>선범단 다짐</h3><p>' + esc(c.pledge || '나는 도장의 모범이 되고, 친구를 도와주며, 배운 것을 나누겠습니다.') + '</p></div></div></div><div class="flipn">카드를 누르면 뒤집혀요 · 나만 보는 카드예요</div>';
      const sbHw = (D.hw || []).filter(x => x.sb && (x.kids || []).includes(me));
      if (sbHw.length) h += '<section class="card"><h2>⭐ 선범단 미션</h2>' + sbHw.map(x => '<div class="hw"><div class="t"><b>' + esc(x.title) + '</b><small>' + esc(x.body || '') + '</small></div></div>').join('') + '<p class="sub">체크는 🏠 나의 수련 → 미션에서 해요</p></section>';
    } else h += '<section class="card"><h2>💪 선범단이 되려면</h2><p class="sub" style="font-size:15px;margin:0">실력보다 <b>다른 친구에게 모범이 되고, 가르쳐 주는 제자</b>가 뽑혀요. 동생을 도와주고, 인사를 잘하고, 수련을 성실하게 하면 사범님이 지켜보고 있어요 👀</p></section>';
    const cnt = {}; sun.forEach(x => { cnt[x.name] = (cnt[x.name] || 0) + 1; });
    h += '<section class="card"><h2>🌟 ' + mon + '월 선 모으기<small>' + sun.length + '개</small></h2>' + (sun.length ? '<div class="tally">' + Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([n, k]) => '<span class="' + (n === me ? 'me' : '') + '">' + esc(n) + ' ⭐' + k + '</span>').join('') + '</div>' +
      sun.slice().reverse().map(x => '<div class="sun"><b>' + esc(x.name) + '</b><span>' + esc(x.text) + '</span><small>' + md(new Date(x.at + 9 * 3600e3).toISOString().slice(0, 10)) + '</small></div>').join('') : '<div class="empty">이번 달 첫 선을 기다려요! 친구를 도와주면 사범님이 넣어 줘요</div>') + '</section>';
    h += '<section class="card"><h2>⭐ 선범단 명단<small>' + (D.sbList || []).length + '명</small></h2>' + ((D.sbList || []).length ? '<div class="sbl">' + D.sbList.map(x => '<div class="' + (x.name === me ? 'me' : '') + '">' + beltDot(x.belt) + '<b>' + esc(x.name) + '</b><small>' + esc(x.belt || '') + '</small></div>').join('') + '</div>' : '<div class="empty">곧 발표돼요</div>') + '</section>';
    return h;
  }
  // ── 아래에서 올라오는 창 ──
  function sheet(html, onClick) { const el = document.createElement('div'); el.className = 'sheet'; el.innerHTML = '<div class="box">' + html + '</div>'; el.onclick = e => { if (e.target === el || e.target.closest('[data-x]')) return el.remove(); onClick && onClick(e, el); }; document.body.appendChild(el); return el; }
  function qrSheet() { sheet('<h3>▦ ' + esc(D.name) + ' 출석 QR</h3><div class="qrbox">' + (window.qrSvg && D.qr ? qrSvg(D.qr, 260) : '<p class="sub">QR을 만들지 못했어요</p>') + '<p class="sub">나만의 출석 QR이에요. 곧 도장 태블릿 카메라에 대면 출석돼요.<br>지금은 태블릿에서 번호를 눌러 주세요.</p></div><button class="big" data-x style="width:100%;max-width:none">닫기</button>'); }
  function pinSheet(slot) {
    const B = myBadges(), pins = [...(D.prof.pins || [])];
    sheet('<h3>대표 뱃지 고르기 (' + (slot + 1) + '번째 칸)</h3>' + (B.length ? '<div class="opts">' + B.map(b => '<button data-b="' + b.k + '" class="' + (pins[slot] === b.k ? 'on' : '') + '" title="' + esc(b.t) + '">' + b.ic + '</button>').join('') + '</div><p class="lockt" id="pinT">뱃지를 누르면 이 칸에 들어가요</p>' : '<div class="empty">아직 받은 뱃지가 없어요</div>') +
      (pins[slot] ? '<button class="out" data-clr>이 칸 비우기</button>' : '') + '<button class="big" data-x style="width:100%;max-width:none">닫기</button>', async (e, el) => {
      const b = e.target.closest('[data-b]'), clr = e.target.closest('[data-clr]'); if (!b && !clr) return;
      const L = [...(D.prof.pins || [])]; while (L.length < 3) L.push(''); if (clr) L[slot] = ''; else { const i = L.indexOf(b.dataset.b); if (i >= 0) L[i] = ''; L[slot] = b.dataset.b; }
      D.prof.pins = L.slice(0, 3); el.remove(); draw(); const j = await post('/k/prof', { pins: D.prof.pins }); if (j.ok) D.prof = j.prof;
    });
  }
  function profSheet() {
    const p = Object.assign({}, D.prof), tile = (arr, key, cls) => '<div class="opts' + (cls || '') + '">' + arr.map(([v, a, b]) => { const lk = key === 'fr' ? b : a, on = (p[key] || '') === v; return '<button data-' + key + '="' + esc(v) + '" data-lk="' + (lk || '') + '" class="' + (on ? 'on' : '') + (unlocked(lk) ? '' : ' lk') + '"' + (key === 'bg' ? ' style="background:' + v + '"' : '') + '>' + (key === 'fr' ? (v ? a : '<span style="font-size:14px;font-weight:800">없음</span>') : key === 'av' ? v : '') + '</button>'; }).join('') + '</div>';
    const html = () => '<h3>✏ 나를 꾸미기</h3><div style="text-align:center"><span class="av' + (p.fr ? ' fr-' + p.fr : '') + '" style="display:inline-grid;width:76px;height:76px;border-radius:50%;place-items:center;font-size:40px;color:#fff;background:' + esc(p.bg || 'var(--brand)') + '">' + esc(p.av || firstName(D.name).slice(0, 1)) + '</span></div>' +
      '<h4>캐릭터</h4>' + tile(AV, 'av') + '<h4>배경색</h4>' + tile(BG, 'bg', ' c') + '<h4>테두리</h4>' + tile(FR, 'fr') + '<p class="lockt" id="lkT">🔒 잠긴 것은 선범단이거나 열심히 하면 열려요</p><button class="big" id="pSave" style="width:100%;max-width:none">저장</button>';
    const el = sheet(html(), async (e, el) => {
      if (e.target.id === 'pSave') { el.remove(); D.prof = Object.assign(D.prof, p); draw(); const j = await post('/k/prof', { av: p.av || '', bg: p.bg || '', fr: p.fr || '' }); if (j.ok) D.prof = j.prof; else alert(j.error || '저장하지 못했어요'); return; }
      const b = e.target.closest('[data-av],[data-bg],[data-fr]'); if (!b) return; const lk = b.dataset.lk;
      if (!unlocked(lk)) { el.querySelector('#lkT').textContent = '🔒 ' + (LOCK[lk] || '아직 잠겨 있어요'); return; }
      ['av', 'bg', 'fr'].forEach(k => { if (b.dataset[k] !== undefined) p[k] = b.dataset[k]; }); el.querySelector('.box').innerHTML = html();
    });
  }
  $('body').onclick = async e => {
    const kp = e.target.closest('[data-kp]'); if (kp) { store.set('haerang-kid-pick', kp.dataset.kp); D = null; return start(); }
    if (e.target.closest('#pEdit')) return profSheet();
    if (e.target.closest('#qrB')) return qrSheet();
    const pn = e.target.closest('[data-pin]'); if (pn) return pinSheet(+pn.dataset.pin);
    if (e.target.closest('#sbc')) return $('sbc').classList.toggle('flip');
    const hb = e.target.closest('[data-hw]'); if (hb) { const id = hb.dataset.hw, x = (D.hw || []).find(y => String(y.id) === id), daily = x && x.mode === 'daily', on = !hb.classList.contains('on');
      if (x) { x.chk = (x.chk || []).filter(c => !(c.kid === D.name && (daily ? c.day === D.today : true))); if (on) x.chk.push({ kid: D.name, day: daily ? D.today : '' }); } draw(); if (on) fx(1200);
      const j = await post('/k/hw-check', { hw: id, day: D.today, on }); if (!j.ok) { alert(j.error || '잠시 뒤에 다시 해 주세요'); start(); } return; }
  };
  document.addEventListener('contextmenu', e => { if (e.target.closest('.sbc')) e.preventDefault(); }); // 선범단 카드 사진 길게 눌러 저장·확대 막기
  // ── 🏅 새 뱃지 축하 (처음 받은 뱃지가 있으면 한 번) ──
  async function newBadgeCheck() {
    const seen = D.prof.seen, have = myBadges().map(b => b.k);
    if (!Array.isArray(seen)) { D.prof.seen = have; return post('/k/prof', { seen: have }); } // 처음 열 때는 축하 없이 기억만
    const nw = myBadges().filter(b => !seen.includes(b.k)); if (!nw.length) return;
    D.prof.seen = [...new Set([...seen, ...have])]; post('/k/prof', { seen: D.prof.seen });
    if (isBday() && store.get('haerang-kid-bday') !== D.today) return; // 생일 축하가 먼저
    const el = document.createElement('div'); el.className = 'bday';
    el.innerHTML = '<div class="box"><div>' + nw[0].ic + '</div><b>새 뱃지를 받았어요!</b><p>' + nw.map(b => b.ic + ' ' + esc(b.t)).join('<br>') + '</p><button class="big" style="margin-top:16px">좋아요!</button></div>';
    el.onclick = e => { if (e.target.closest('button') || e.target === el) el.remove(); }; document.body.appendChild(el); fx(2200);
  }
  // ── 🎂 생일 축하 (생일날 열면 폭죽, 하루 한 번 창) ──
  function bdayCheck() {
    if (!isBday() || store.get('haerang-kid-bday') === D.today + D.name) return;
    store.set('haerang-kid-bday', D.today + D.name);
    const el = document.createElement('div'); el.className = 'bday';
    el.innerHTML = '<div class="box"><div>🎂</div><b>' + esc(voc(D.name)) + ', 생일 축하해!</b><p>해랑경희 사범님들이 온 마음으로 축하해요 🎉<br>오늘 도장에서 크게 기합 넣자!</p><button class="big" style="margin-top:16px">고마워요!</button></div>';
    el.onclick = e => { if (e.target.closest('button') || e.target === el) el.remove(); }; document.body.appendChild(el); fx(4200);
  }
  function fx(ms) { // 폭죽 (색종이)
    const c = $('fx'), g = c.getContext('2d'), W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio; c.hidden = false;
    const cols = ['#A40F16', '#F2B705', '#2F6FDE', '#2E9E4F', '#F07AA8', '#F08A24'], P = [];
    for (let b = 0; b < 3; b++) { const x = W * (0.2 + 0.3 * b), y = H * 0.45; for (let i = 0; i < 70; i++) { const a = Math.random() * Math.PI * 2, s = (4 + Math.random() * 9) * devicePixelRatio; P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6 * devicePixelRatio, r: (3 + Math.random() * 4) * devicePixelRatio, c: cols[i % 6], t: Math.random() * 6, d: b * 250 }); } }
    const t0 = performance.now();
    (function step(now) { const el = now - t0; g.clearRect(0, 0, W, H);
      P.forEach(p => { if (el < p.d) return; p.vy += .35 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.t += .2; g.fillStyle = p.c; g.save(); g.translate(p.x, p.y); g.rotate(p.t); g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); });
      if (el < ms) requestAnimationFrame(step); else { g.clearRect(0, 0, W, H); c.hidden = true; } })(t0);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && (store.get(TK) || parentTok()) && D) start(); });
  start();
