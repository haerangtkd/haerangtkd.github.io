<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>출결 · 해랑경희</title>
<meta name="theme-color" content="#FBF8F4">
<link rel="manifest" href="kiosk.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="해랑경희 출결">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--brand:#A40F16;--brand-soft:#FBEDEE;--ink:#1C1A19;--muted:#6B6460;--paper:#FBF8F4;--line:#ECE5DE;--in:#1E7A46;--out:#1F3B63}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--paper);color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
  .screen{position:fixed;inset:0;display:flex;padding:calc(20px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom))}

  /* 번호 입력 */
  #s-pad{flex-direction:column;align-items:center;justify-content:center;gap:3vh}
  .head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .head img{width:clamp(64px,10vh,110px)}
  .head .clock{font-size:clamp(15px,2.2vh,20px);color:var(--muted);font-weight:500}
  .head h1{font-size:clamp(24px,4vh,40px);font-weight:900;letter-spacing:-.02em}
  .dots{display:flex;gap:clamp(14px,2.4vh,24px);margin:1vh 0}
  .dots i{width:clamp(22px,3.4vh,34px);height:clamp(22px,3.4vh,34px);border-radius:50%;border:3px solid #CFC5BC;transition:all .12s}
  .dots i.on{background:var(--brand);border-color:var(--brand);transform:scale(1.08)}
  .dots.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .msg{min-height:1.6em;font-size:clamp(16px,2.4vh,22px);font-weight:700;color:var(--brand)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vh,16px);width:min(92vw,58vh,460px)}
  .pad button{aspect-ratio:1.35;border:0;border-radius:20px;background:#fff;box-shadow:0 2px 0 #E4DCD4,0 1px 8px rgba(0,0,0,.04);font:inherit;font-size:clamp(30px,5vh,46px);font-weight:700;color:var(--ink);cursor:pointer}
  .pad button:active{background:var(--brand-soft);transform:translateY(2px);box-shadow:none}
  .pad button.fn{font-size:clamp(17px,2.6vh,22px);color:var(--muted);background:transparent;box-shadow:none}

  /* 이름 선택 */
  #s-pick{flex-direction:column;align-items:center;justify-content:center;gap:2.4vh}
  #s-pick h2{font-size:clamp(22px,3.6vh,34px);font-weight:900;text-align:center}
  .kids{display:grid;gap:14px;width:min(94vw,640px);max-height:66vh;overflow:auto}
  .kid{background:#fff;border-radius:22px;padding:clamp(16px,2.4vh,24px);display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .kid .nm b{display:block;font-size:clamp(26px,4.2vh,40px);font-weight:900;line-height:1.2}
  .kid .nm small{font-size:clamp(14px,2vh,18px);color:var(--muted);font-weight:500}
  .kid .nm small.ok{color:var(--in);font-weight:700}
  .kid button{border:0;border-radius:16px;font:inherit;font-weight:900;color:#fff;cursor:pointer;font-size:clamp(20px,3vh,28px);padding:clamp(14px,2.2vh,22px) clamp(18px,3vw,30px)}
  .kid .in{background:var(--in)}
  .kid .out{background:var(--out)}
  .kid button.dim{background:#E9E3DD;color:#8A837E}
  .kid button:disabled{opacity:.4}
  .kid button.wait{background:#E9E3DD;color:#A79F98;font-size:clamp(15px,2.2vh,20px);line-height:1.25}
  .kid button.wait small{display:block;font-size:.72em;font-weight:700}
  #pickTitle.err{color:var(--brand)}
  .back{border:0;background:#fff;border-radius:14px;padding:14px 30px;font:inherit;font-size:clamp(17px,2.4vh,21px);font-weight:700;color:var(--muted);cursor:pointer}

  /* 완료 */
  #s-done{flex-direction:column;align-items:center;justify-content:center;gap:2vh;color:#fff;text-align:center}
  #s-done.in{background:var(--in)} #s-done.out{background:var(--out)}
  #s-done .ic{width:clamp(90px,16vh,150px);height:clamp(90px,16vh,150px);border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;animation:pop .35s ease}
  #s-done .ic svg{width:60%;height:60%}
  @keyframes pop{from{transform:scale(.5);opacity:0}}
  #s-done h2{font-size:clamp(34px,6.4vh,64px);font-weight:900;letter-spacing:-.02em}
  #s-done p{font-size:clamp(20px,3.2vh,30px);font-weight:500;opacity:.92}

  /* 등록 */
  #s-setup{flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  #s-setup img{width:80px}
  #s-setup h1{font-size:24px;font-weight:900}
  #s-setup p{font-size:15px;color:var(--muted);max-width:340px}
  #s-setup input{width:min(340px,86vw);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:17px;-webkit-user-select:text;user-select:text}
  #s-setup button{width:min(340px,86vw);border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:17px;padding:15px;cursor:pointer}
  #setupMsg{color:var(--brand);font-weight:700;font-size:14px;min-height:1.4em}
  /* 모드 고르기 · 관리자 · 상담 */
  #s-mode{flex-direction:column;align-items:center;justify-content:center;gap:4vh}
  #s-mode h1{font-size:clamp(26px,4.4vh,40px);font-weight:900}
  .modes{display:flex;gap:4vw;flex-wrap:wrap;justify-content:center}
  .modes button{width:min(38vw,320px);aspect-ratio:1.1;border:0;border-radius:28px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.07);font:inherit;font-size:clamp(28px,4.6vh,44px);font-weight:900;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer}
  .modes button span{font-size:clamp(46px,8vh,80px)}.modes button small{font-size:clamp(14px,2vh,18px);color:var(--muted);font-weight:500}
  .admbtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:18px;border:0;background:transparent;border-radius:99px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;color:#C9C0B8;cursor:pointer}
  .ovl{position:fixed;inset:0;background:rgba(20,10,10,.45);display:flex;align-items:center;justify-content:center;z-index:50}
  .ovl .box{background:#fff;border-radius:22px;padding:24px;width:min(420px,90vw);display:flex;flex-direction:column;gap:12px;text-align:center}
  .ovl .box h3{font-size:20px;font-weight:900}.ovl .box p{color:var(--muted);font-size:14px}
  .ovl input{border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:18px;text-align:center;-webkit-user-select:text;user-select:text}
  .ovl button{border:0;border-radius:12px;padding:14px;font:inherit;font-size:17px;font-weight:700;background:#F1ECE7;color:var(--ink);cursor:pointer}.ovl button.pri{background:var(--brand);color:#fff}
  .ovl .err{color:var(--brand);font-weight:700;font-size:14px;min-height:1.2em}
  #s-consult{flex-direction:column;padding-right:96px}
  #s-consult h2{font-size:clamp(22px,3.4vh,32px);font-weight:900;margin:1vh 0 2vh}
  .docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;overflow:auto}
  .docs button{border:0;border-radius:20px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.05);padding:22px;text-align:left;font:inherit;font-size:clamp(18px,2.6vh,24px);font-weight:800;color:var(--ink);cursor:pointer}
  .docs button small{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:4px}
  .viewer{position:fixed;inset:0;background:#1C1A19;display:flex;align-items:center;justify-content:center;z-index:30;padding-right:96px}
  .viewer img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
  .viewer .nav{position:fixed;bottom:20px;left:calc(50% - 48px);transform:translateX(-50%);display:flex;gap:12px;align-items:center;color:#fff;font-weight:700}
  .viewer .nav button{border:0;border-radius:14px;padding:12px 22px;font:inherit;font-size:18px;font-weight:800;background:rgba(255,255,255,.18);color:#fff}
  .exit{position:fixed;top:0;right:0;bottom:0;width:88px;border:0;background:var(--brand);color:#fff;font:inherit;font-size:20px;font-weight:900;writing-mode:vertical-rl;letter-spacing:.2em;cursor:pointer;z-index:40}
  /* 가로 화면 (태블릿을 눕혀 둘 때) */
  @media (orientation: landscape) and (min-width: 700px) {
    #s-pad{flex-direction:row;gap:6vw}
    #s-pad .head{width:38vw}
    #s-pad .left{display:flex;flex-direction:column;align-items:center;gap:3vh}
    .pad{width:min(46vw,64vh,520px)}
    .kids{grid-template-columns:1fr 1fr;width:min(94vw,1100px)}
  }
  .sndtest{position:fixed;top:calc(14px + env(safe-area-inset-top));right:18px;border:0;background:#fff;border-radius:99px;padding:9px 14px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer}
  .net{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<section class="screen" id="s-setup" hidden>
  <img src="icon-192.png" alt="">
  <h1>출결 태블릿으로 등록</h1>
  <p>이 기기를 도장 입구 출결용으로 씁니다. 관리자 비밀번호를 한 번만 넣어 주세요.</p>
  <input type="password" id="pw" placeholder="관리자 비밀번호">
  <button id="setupBtn">등록하기</button>
  <div id="setupMsg"></div>
</section>

<section class="screen" id="s-mode" hidden>
  <img src="../img/brand/lion-red.png" alt="" style="width:clamp(64px,10vh,110px)">
  <h1>무엇으로 쓸까요?</h1>
  <div class="modes"><button data-mode="att"><span>🥋</span>출결<small>제자들이 번호를 눌러요</small></button><button data-mode="consult"><span>📋</span>상담<small>상담 자료·계약서 설명</small></button></div>
</section>

<section class="screen" id="s-consult" hidden>
  <h2>상담 자료</h2>
  <div class="docs" id="docs"></div>
  <button class="exit" id="cExit">나가기</button>
</section>

<section class="screen" id="s-pad" hidden>
  <div class="left">
  <div class="head">
    <img src="../img/brand/lion-red.png" alt="">
    <div class="clock" id="clock"></div>
    <h1>번호 4자리를 눌러 주세요</h1>
  </div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="msg" id="msg"></div>
  </div>
  <button class="admbtn" id="admBtn">관리자</button>
  <div class="pad" id="pad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button class="fn" data-k="clear">전부 지우기</button><button>0</button><button class="fn" data-k="back">← 지우기</button>
  </div>
</section>

<section class="screen" id="s-pick" hidden>
  <h2 id="pickTitle">이름을 눌러 주세요</h2>
  <div class="kids" id="kids"></div>
  <button class="back" id="back">처음으로</button>
</section>

<section class="screen" id="s-done" hidden>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h2 id="doneTitle"></h2>
  <p id="doneSub"></p>
</section>

<div class="net" id="net"></div>
<div class="ovl" id="adm" hidden><div class="box" id="admBox"></div></div>
<div class="viewer" id="viewer" hidden><img id="vImg" alt=""><div class="nav"><button id="vPrev">‹ 앞</button><span id="vNo"></span><button id="vNext">다음 ›</button></div><button class="exit" id="vExit">닫기</button></div>

<script src="config.js"></script>
<script>
(() => {
  const API = (window.HAERANG_PUSH_API || '').replace(/\/$/, '');
  const $ = id => document.getElementById(id);
  const TK = 'haerang-kiosk-token';
  let token = ''; try { token = localStorage.getItem(TK) || ''; } catch (_) {}
  let code = '', found = [], idle = null, busy = false, skew = 0, minStay = 30 * 60000;

  const screens = ['s-setup', 's-mode', 's-consult', 's-pad', 's-pick', 's-done'];
  const MK = 'haerang-kiosk-mode'; let mode = ''; try { mode = localStorage.getItem(MK) || ''; } catch (_) {}
  const show = id => screens.forEach(s => $(s).hidden = s !== id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const post = async (path, body) => (await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();

  // 화면 꺼짐 방지
  let lock = null;
  const keepAwake = async () => { try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch (_) {} };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  // 시계
  const tick = () => { const d = new Date(); $('clock').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + '일월화수목금토'[d.getDay()] + '요일  ' + d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }); };
  tick(); setInterval(tick, 10000);

  // ── 안내 음성 ("○○○ 학생이 등원하였습니다") ──
  const tts = 'speechSynthesis' in window ? window.speechSynthesis : null;
  let koVoice = null, ttsReady = false;
  function pickVoice() { if (!tts) return; const vs = tts.getVoices(); koVoice = vs.find(v => /^ko/i.test(v.lang) && /yuna|유나|google|female|heami|sunhi/i.test(v.name)) || vs.find(v => /^ko/i.test(v.lang)) || null; }
  if (tts) { pickVoice(); tts.addEventListener && tts.addEventListener('voiceschanged', pickVoice); }
  function unlockSpeech() { // 아이패드·아이폰은 첫 터치 때 한 번 깨워 둬야 소리가 납니다
    if (!tts || ttsReady) return; ttsReady = true;
    if (!/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)) return; // 깨우기는 애플 기기에서만 필요
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'ko-KR'; tts.speak(u); } catch (_) {}
  }
  function say(text, onFail) {
    if (!tts) { onFail && onFail(); return false; }
    try {
      if (tts.speaking || tts.pending) tts.cancel();   // 크롬은 cancel 바로 뒤의 말을 삼키는 경우가 있어 잠깐 쉬고 말함
      if (!koVoice) pickVoice();
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.rate = 0.95; u.pitch = 1.05; u.volume = 1;
        let started = false; u.onstart = () => { started = true; };
        tts.resume(); tts.speak(u);
        // 2.5초 안에 말을 시작하지 못하면 이 브라우저는 음성이 막혀 있는 것
        setTimeout(() => { if (!started) { tts.cancel(); onFail && onFail(); } }, 2500);
      }, 80);
      return true;
    } catch (_) { return false; }
  }

  // 짧은 효과음
  let ac = null;
  function beep(ok) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const notes = ok ? [880, 1320] : [300];
      notes.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; o.type = 'sine'; o.connect(g); g.connect(ac.destination);
        const t = ac.currentTime + i * 0.12;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.start(t); o.stop(t + 0.2);
      });
    } catch (_) {}
  }

  function resetIdle(ms = 20000) { clearTimeout(idle); idle = setTimeout(home, ms); }
  function home() { clearTimeout(idle); code = ''; found = []; drawDots(); $('msg').textContent = ''; show('s-pad'); }
  function drawDots() { [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < code.length)); }

  // ── 번호 입력 ──
  $('pad').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b || busy) return;
    keepAwake(); unlockSpeech(); $('msg').textContent = '';
    if (b.dataset.k === 'clear') code = '';
    else if (b.dataset.k === 'back') code = code.slice(0, -1);
    else if (code.length < 4) code += b.textContent;
    drawDots(); resetIdle();
    if (code.length === 4) lookup();
  });

  async function lookup() {
    busy = true;
    try {
      const j = await post('/kiosk/lookup', { token, code });
      if (j.relogin) return toSetup(j.error);
      if (!j.ok) throw new Error(j.error);
      if (!j.kids.length) { beep(false); $('msg').textContent = '없는 번호입니다. 다시 눌러 주세요'; $('dots').classList.add('shake'); setTimeout(() => $('dots').classList.remove('shake'), 400); code = ''; setTimeout(drawDots, 350); return; }
      skew = (j.now || Date.now()) - Date.now(); if (j.minStay) minStay = j.minStay;
      found = j.kids; drawKids(); show('s-pick'); resetIdle();
    } catch (_) { $('msg').textContent = '인터넷 연결을 확인해 주세요'; code = ''; drawDots(); }
    finally { busy = false; }
  }

  // ── 이름 + 등원/하원 ──
  // 등원하고 30분이 안 지났으면 하원 버튼을 잠금
  const hm = ts => { const d = new Date(ts + 9 * 3600e3), h = d.getUTCHours(), m = d.getUTCMinutes(); return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + '시' + (m ? ' ' + m + '분' : ''); };
  const tooEarly = k => k.in && !k.out && k.inAt && (Date.now() + skew) - k.inAt < minStay;
  function drawKids(msg) {
    $('pickTitle').textContent = msg || (found.length > 1 ? '내 이름을 찾아서 눌러 주세요' : '등원인지 하원인지 눌러 주세요');
    $('pickTitle').classList.toggle('err', !!msg);
    $('kids').innerHTML = found.map((k, i) => {
      const early = tooEarly(k);
      const next = k.in && !k.out && !early ? 'out' : 'in';   // 등원하고 30분 지났으면 하원을 크게
      const st = k.out ? '오늘 ' + k.out + ' 하원' : k.in ? '오늘 ' + k.in + ' 등원' : '';
      return '<div class="kid"><div class="nm"><b>' + esc(k.name) + '</b>' + (st ? '<small class="ok">' + esc(st) + '</small>' : '') + '</div>' +
        '<button class="in' + (next === 'in' && !early ? '' : ' dim') + '" data-i="' + i + '" data-a="in">등원</button>' +
        (early ? '<button class="out wait" data-i="' + i + '" data-a="out" data-wait="1">하원<small>' + esc(k.outFrom || '') + '부터</small></button>'
               : '<button class="out' + (next === 'out' ? '' : ' dim') + '" data-i="' + i + '" data-a="out">하원</button>') + '</div>';
    }).join('');
  }
  $('kids').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b || busy) return;
    const k = found[b.dataset.i], act = b.dataset.a;
    if (b.dataset.wait) { beep(false); drawKids('등원하고 30분이 지나야 하원할 수 있습니다 (' + (k.outFrom || '') + '부터)'); say('등원하고 30분이 지나야 하원할 수 있습니다'); resetIdle(); return; }
    busy = true; $('kids').querySelectorAll('button').forEach(x => x.disabled = true);
    try {
      const j = await post('/kiosk/check', { token, name: k.name, act });
      if (j.relogin) return toSetup(j.error);
      if (j.early || j.already) { beep(false); drawKids(j.error); say(j.already ? '오늘은 이미 ' + (act === 'in' ? '등원' : '하원') + '했어요' : '등원하고 30분이 지나야 하원할 수 있습니다'); resetIdle(); return; }
      if (!j.ok) throw new Error(j.error);
      k[act] = j.time; if (act === 'in') { k.out = null; k.inAt = j.at; k.outFrom = hm(j.at + minStay); }
      beep(true);
      setTimeout(() => say(k.name + ' 학생이 ' + (act === 'in' ? '등원' : '하원') + '하였습니다.'), 350);
      $('s-done').className = 'screen ' + act;
      $('doneTitle').textContent = k.name + (act === 'in' ? ' 등원!' : ' 하원!');
      $('doneSub').textContent = act === 'in' ? '오늘도 힘차게 수련합시다' : '오늘도 수고했습니다. 조심히 가세요';
      show('s-done');
      clearTimeout(idle);
      setTimeout(() => {
        // 형제·자매가 남아 있으면 이름 화면으로, 아니면 처음으로
        if (found.length > 1 && found.some(x => act === 'in' ? !x.in || x.out : !x.out)) { drawKids(); show('s-pick'); resetIdle(); }
        else home();
      }, 3400);
    } catch (err) { alert('처리하지 못했습니다. ' + (err.message || '')); drawKids(); }
    finally { busy = false; }
  });
  $('back').onclick = home;
  const soundTest = () => { const out = $('sndMsg') || $('msg');
    unlockSpeech(); beep(true); pickVoice();
    if (!tts) { out.textContent = '이 기기(브라우저)는 음성 안내를 지원하지 않습니다'; return; }
    setTimeout(() => say('해랑경희 태권도장입니다. 소리가 잘 들립니다.', () => { out.textContent = '이 브라우저에서는 음성이 나오지 않습니다. 태블릿의 Safari·크롬이나 엣지에서 열어 주세요'; }), 350);
    out.textContent = koVoice ? '음성: ' + koVoice.name : '한국어 음성이 없어 기본 음성으로 읽습니다';
    setTimeout(() => { if (out.textContent.startsWith('음성') || out.textContent.startsWith('한국어')) out.textContent = ''; }, 6000);
  };

  // ── 태블릿 등록 ──
  function toSetup(m) { try { localStorage.removeItem(TK); } catch (_) {} token = ''; $('setupMsg').textContent = m || ''; show('s-setup'); }
  $('setupBtn').onclick = async () => {
    $('setupMsg').textContent = '';
    try {
      const j = await post('/admin/kiosk-token', { password: $('pw').value });
      if (!j.ok) { $('setupMsg').textContent = j.error; return; }
      token = j.token; try { localStorage.setItem(TK, token); } catch (_) {}
      $('pw').value = ''; toMode(); keepAwake();
    } catch (_) { $('setupMsg').textContent = '서버에 연결하지 못했습니다'; }
  };
  $('pw').onkeydown = e => { if (e.key === 'Enter') $('setupBtn').click(); };

  addEventListener('offline', () => $('net').textContent = '인터넷 연결이 끊겼습니다');
  addEventListener('online', () => $('net').textContent = '');

  if (!API) { show('s-setup'); $('setupMsg').textContent = '알림 서버 주소(config.js)가 아직 비어 있습니다'; $('setupBtn').disabled = true; }
  else if (!token) show('s-setup');
  else if (mode === 'att') home(); else if (mode === 'consult') toConsult(); else toMode();

  // ── 모드 고르기 (출결 / 상담) ──
  function toMode() { clearTimeout(idle); show('s-mode'); }
  $('s-mode').onclick = e => { const b = e.target.closest('[data-mode]'); if (!b) return; mode = b.dataset.mode; try { localStorage.setItem(MK, mode); } catch (_) {} if (mode === 'att') { home(); keepAwake(); } else toConsult(); };
  // ── 관리자 (출결 화면 오른쪽 위, 비밀번호) — 제자들이 장난치지 않게 소리 확인·모드 바꾸기는 여기 안에 ──
  function admin() {
    clearTimeout(idle);
    $('admBox').innerHTML = '<h3>관리자</h3><p>관리자 비밀번호를 넣어 주세요</p><input type="password" id="admPw" inputmode="numeric" autocomplete="off"><div class="err" id="admErr"></div><button class="pri" id="admOk">확인</button><button id="admX">닫기</button>';
    $('adm').hidden = false; setTimeout(() => $('admPw').focus(), 50);
    $('admX').onclick = () => { $('adm').hidden = true; home(); };
    const go = async () => { const j = await post('/kiosk/admin', { token, password: $('admPw').value }).catch(() => ({ error: '인터넷 연결을 확인해 주세요' })); if (!j.ok) { $('admErr').textContent = j.error || '확인하지 못했어요'; $('admPw').value = ''; return; } menu(); };
    $('admOk').onclick = go; $('admPw').onkeydown = e => { if (e.key === 'Enter') go(); };
  }
  function menu() {
    $('admBox').innerHTML = '<h3>관리자 메뉴</h3><button class="pri" id="mMode">출결 / 상담 바꾸기</button><button id="mSnd">🔊 소리 확인</button><div class="err" id="sndMsg" style="color:var(--muted)"></div><button id="mX">닫기</button>';
    $('mMode').onclick = () => { $('adm').hidden = true; toMode(); };
    $('mSnd').onclick = () => { soundTest(); };
    $('mX').onclick = () => { $('adm').hidden = true; home(); };
  }
  $('admBtn').onclick = admin;
  // ── 상담 (자료 넘겨 보기, 오른쪽 끝 '나가기') ──
  let docs = [], cur = null, page = 0;
  async function toConsult() {
    clearTimeout(idle); show('s-consult');
    try { docs = await fetch('consult/list.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []); } catch (_) { docs = []; }
    $('docs').innerHTML = docs.length ? docs.map((d, i) => '<button data-d="' + i + '">' + esc(d.title) + '<small>' + (d.pages || []).length + '쪽' + (d.desc ? ' · ' + esc(d.desc) : '') + '</small></button>').join('') : '<p style="color:var(--muted);font-size:18px">상담 자료를 준비 중이에요. 자료를 넣으면 여기에 보여요.</p>';
  }
  $('docs').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; cur = docs[+b.dataset.d]; page = 0; drawPage(); $('viewer').hidden = false; };
  function drawPage() { const ps = cur.pages || []; $('vImg').src = 'consult/' + ps[page]; $('vNo').textContent = (page + 1) + ' / ' + ps.length; $('vPrev').disabled = page === 0; $('vNext').disabled = page >= ps.length - 1; }
  $('vPrev').onclick = () => { if (page > 0) { page--; drawPage(); } };
  $('vNext').onclick = () => { if (page < (cur.pages || []).length - 1) { page++; drawPage(); } };
  $('vExit').onclick = () => { $('viewer').hidden = true; };
  $('cExit').onclick = () => { $('viewer').hidden = true; toMode(); };
})();
</script>
</body>
</html>
