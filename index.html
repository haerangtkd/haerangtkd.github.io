<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해랑경희 태권도장</title>
<meta name="description" content="해랑경희 태권도장의 교육 철학, 지도진, 수련 프로그램과 시간표, 일정과 오늘의 운동을 한눈에 보실 수 있습니다.">
<meta property="og:title" content="해랑경희 태권도장">
<meta property="og:description" content="교육 철학 · 지도진 · 시간표 · 일정 · 오늘의 운동 · 상담 문의">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#A40F16; --brand-deep:#7A0B10; --brand-soft:#FBEDEE;
    --ink:#1C1A19; --muted:#6B6460; --paper:#FBF8F4; --card:#FFFFFF; --line:#ECE5DE;
    --orange:#D9822B; --teal:#2E9C9A; --navy:#1F3B63; --gray:#8A837E;
    --hh:58px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  body.lock{overflow:hidden}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 56px}
  section,.anchor{scroll-margin-top:calc(var(--hh) + 14px)}
  a{color:inherit}

  /* ---------- 상단 메뉴 바 ---------- */
  .gnb{position:sticky;top:0;z-index:40;height:var(--hh);background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .gnb .in{max-width:1080px;height:100%;margin:0 auto;padding:0 8px 0 16px;display:flex;align-items:center;gap:8px}
  .logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);margin-right:auto}
  .logo .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:19px}
  .logo b{font-family:'Noto Serif KR',serif;font-weight:900;font-size:18px;letter-spacing:-.01em}
  .logo small{font-size:12px;color:var(--muted);font-weight:700;margin-left:2px}
  .iconbtn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);cursor:pointer;text-decoration:none}
  .iconbtn:hover{background:#F3EEE9}
  .iconbtn svg{width:24px;height:24px}
  .iconbtn.call{color:var(--brand)}
  /* 넓은 화면: 메뉴를 바로 펼쳐 보여줌 */
  .menu-inline{display:none;gap:4px;height:100%}
  .menu-inline .grp{position:relative;height:100%;display:flex;align-items:center}
  .menu-inline .grp > a{font-weight:700;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:10px}
  .menu-inline .grp:hover > a,.menu-inline .grp:focus-within > a{color:var(--brand);background:var(--brand-soft)}
  .menu-inline .drop{position:absolute;top:calc(100% - 6px);left:50%;transform:translateX(-50%) translateY(6px);min-width:170px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(40,20,20,.12);padding:8px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
  .menu-inline .grp:hover .drop,.menu-inline .grp:focus-within .drop{opacity:1;pointer-events:auto;transform:translateX(-50%)}
  .menu-inline .drop a{display:block;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:14.5px;white-space:nowrap}
  .menu-inline .drop a:hover{background:var(--brand-soft);color:var(--brand)}
  @media (min-width:900px){ .menu-inline{display:flex} .menu-btn{display:none} }

  /* 전체 메뉴 (휴대폰) */
  .drawer{position:fixed;inset:0;z-index:50;visibility:hidden}
  .drawer.on{visibility:visible}
  .drawer .dim{position:absolute;inset:0;background:rgba(20,10,10,.45);opacity:0;transition:opacity .25s}
  .drawer.on .dim{opacity:1}
  .drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(88vw,380px);background:#fff;transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column}
  .drawer.on .panel{transform:none}
  .drawer .phead{height:var(--hh);display:flex;align-items:center;padding:0 8px 0 18px;border-bottom:1px solid var(--line)}
  .drawer .phead b{font-family:'Noto Serif KR',serif;font-weight:900;font-size:17px;margin-right:auto}
  .drawer .pbody{flex:1;overflow-y:auto;padding:10px 18px 20px}
  .drawer .g{padding:14px 0;border-bottom:1px solid var(--line)}
  .drawer .g:last-child{border-bottom:0}
  .drawer .g h3{font-size:13px;color:var(--brand);font-weight:900;letter-spacing:.08em;margin-bottom:6px}
  .drawer .g a{display:flex;align-items:center;gap:12px;padding:10px 4px;text-decoration:none;font-size:16.5px;font-weight:700;border-radius:10px}
  .drawer .g a:active{background:#F5EFEA}
  .drawer .g a .ic{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
  .drawer .g a .ic svg{width:19px;height:19px}
  .drawer .pfoot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

  /* ---------- 히어로 ---------- */
  .hero{background:var(--brand);color:#fff;padding:44px 24px 76px;text-align:center;position:relative;overflow:hidden}
  .hero::before{content:"跆";position:absolute;right:-18px;bottom:-60px;font-family:'Noto Serif KR',serif;font-weight:900;font-size:220px;line-height:1;color:rgba(255,255,255,.07);pointer-events:none}
  .greet{font-size:13px;letter-spacing:.18em;opacity:.85;margin-bottom:12px}
  h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:34px;line-height:1.25}
  h1 small{display:block;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;letter-spacing:.3em;margin-top:8px;opacity:.9}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
  .intro{margin-top:-44px;position:relative;box-shadow:0 6px 24px rgba(60,20,20,.08)}
  .intro p{font-size:15.5px;word-break:keep-all}
  .intro p + p{margin-top:12px}
  .intro strong{color:var(--brand)}

  /* ---------- 홈 카드: 오늘의 운동 / 다가오는 일정 ---------- */
  .home{display:grid;gap:12px;margin-top:14px}
  .hc{padding:0;overflow:hidden}
  .hc-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
  .hc-head .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
  .hc-head .ic svg{width:20px;height:20px}
  .hc-head h2{font-size:16.5px;font-weight:900;line-height:1.3}
  .hc-head h2 small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
  .hc-head .more{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;white-space:nowrap}
  .wo{background:linear-gradient(135deg,#1F3B63,#2B5185);color:#fff;border:0}
  .wo .hc-head .ic{background:rgba(255,255,255,.15);color:#fff}
  .wo .hc-head h2 small{color:rgba(255,255,255,.75)}
  .wo .hc-head .more{color:rgba(255,255,255,.8)}
  .wo .theme{padding:0 18px 4px;font-family:'Noto Serif KR',serif;font-weight:900;font-size:21px}
  .wo ol{list-style:none;padding:8px 18px 4px;counter-reset:w}
  .wo li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.14);counter-increment:w}
  .wo li::before{content:counter(w);flex:none;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--navy);font-size:12.5px;font-weight:900;display:grid;place-items:center}
  .wo li b{flex:1;font-size:15px;word-break:keep-all}
  .wo li span{font-size:13.5px;font-weight:700;color:#FFD9A8;white-space:nowrap}
  .wo .tip{margin:6px 18px 0;font-size:13.5px;background:rgba(255,255,255,.1);border-radius:10px;padding:9px 12px;word-break:keep-all}
  .wo .note{padding:10px 18px 16px;font-size:12.5px;color:rgba(255,255,255,.7);word-break:keep-all}
  .wo .sub{padding:4px 18px 0;font-size:14px;color:rgba(255,255,255,.8)}
  .wo .focusbox{padding:2px 18px 6px;display:flex;flex-direction:column;gap:8px}
  .wo .focus{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;line-height:1.45}
  .wo .focus b{font-size:16px;word-break:keep-all}
  .wo .focus > span:last-child:not(.tag){display:block;font-size:12.5px;color:rgba(255,255,255,.75);margin-top:2px}
  .wo .focus .tag{border:1px solid rgba(255,255,255,.4)}
  .wo .note{padding:0 0 12px}
  .nt .hc-head .ic{background:#FFF3DC;color:#B7791F}
  .nt ul{list-style:none;padding:0 18px 16px}
  .nt li{position:relative;padding:10px 0 10px 16px;border-top:1px solid var(--line);font-size:14.5px;word-break:keep-all}
  .nt li::before{content:"";position:absolute;left:2px;top:19px;width:6px;height:6px;border-radius:50%;background:#D9822B}
  .grid7 .cell.off .n{color:#C23A3A}
  .up .hc-head .ic{background:var(--brand-soft);color:var(--brand)}
  .up ul{list-style:none;padding:0 18px 16px}
  .up li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .dday{flex:none;min-width:54px;text-align:center;font-size:13px;font-weight:900;border-radius:999px;padding:3px 8px;background:var(--brand-soft);color:var(--brand)}
  .dday.now{background:var(--brand);color:#fff}
  .up li .t{flex:1;min-width:0}
  .up li .t b{display:block;font-size:15px;word-break:keep-all}
  .up li .t span{font-size:12.5px;color:var(--muted)}
  .empty{padding:4px 18px 18px;font-size:14px;color:var(--muted)}

  /* ---------- 바로가기 ---------- */
  .label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin:32px 4px 12px}
  .shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sc{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 4px 11px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;text-align:center;word-break:keep-all;line-height:1.3;transition:transform .15s,border-color .15s}
  .sc:active{transform:scale(.95)}
  .sc:hover{border-color:var(--brand)}
  .sc .ic{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
  .sc .ic svg{width:20px;height:20px}
  .sc-call{grid-column:1/-1;flex-direction:row;justify-content:center;background:var(--brand);border-color:var(--brand);color:#fff;font-size:15px;padding:14px}
  .sc-call .ic{width:auto;height:auto;background:none;color:#fff}

  /* ---------- 섹션 공통 ---------- */
  .sec{margin-top:56px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .sec-head .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
  .sec-head h2{font-family:'Noto Serif KR',serif;font-weight:900;font-size:21px;line-height:1.35;word-break:keep-all}
  .lead{font-size:15px;color:var(--muted);margin:-4px 2px 16px;word-break:keep-all}

  /* 교육 철학 */
  .q{border-radius:16px;padding:20px;font-size:16px;font-weight:700;line-height:1.6;word-break:keep-all;text-align:center}
  .q1{background:#FCE9E2;color:#7A2E1C}
  .q2{background:#E6EEFB;color:#1F3B63}
  .plus{text-align:center;font-size:30px;font-weight:900;color:var(--navy);line-height:1;margin:10px 0}
  .letter{margin-top:16px;font-family:'Noto Serif KR',serif;font-size:15.5px;line-height:1.9;word-break:keep-all}
  .letter p + p{margin-top:14px}
  .letter .sign{text-align:right;font-weight:700;color:var(--brand);margin-top:18px}

  /* 지도진 */
  .staff{display:flex;flex-direction:column;gap:12px}
  .member{overflow:hidden;padding:0}
  .member .photo{width:100%;aspect-ratio:4/3.2;object-fit:cover;object-position:center 18%;display:block;background:#E9E2DB}
  .member .body{padding:18px 20px 20px}
  .member .who{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .member .role{font-size:13px;font-weight:700;color:#fff;background:var(--brand);padding:2px 10px;border-radius:999px}
  .member .name{font-size:19px;font-weight:900}
  .member ul{list-style:none;font-size:14.5px;color:#3A3533}
  .member li{position:relative;padding-left:14px;word-break:keep-all}
  .member li + li{margin-top:4px}
  .member li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .member.lead-member{border-color:var(--brand)}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}

  /* 교육 내용 */
  .areas{display:flex;flex-direction:column;gap:10px}
  .area{border-radius:16px;padding:16px 18px;color:#fff}
  .area h3{font-size:16px;font-weight:900;margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:500}
  .goals{margin-top:14px}
  .goal{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .goal:last-child{border-bottom:0}
  .goal b{font-size:15.5px;flex:1;word-break:keep-all}
  .goal span{font-size:13.5px;color:var(--brand);font-weight:700;text-align:right;word-break:keep-all;max-width:55%}
  .closing{margin-top:14px;font-size:15px;line-height:1.75;word-break:keep-all;background:var(--brand-soft);border-radius:14px;padding:16px 18px;color:#5A1A1D}

  /* 프로그램 */
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;font:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .common{font-size:13.5px;color:var(--muted);margin:0 2px 10px}
  .common b{color:var(--ink)}
  .days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px 12px;text-align:center;min-width:0}
  .day .d{font-family:'Noto Serif KR',serif;font-weight:900;font-size:17px;color:var(--brand);margin-bottom:6px}
  .day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
  .day p{font-size:12px;line-height:1.45;word-break:keep-all;color:#3A3533}
  .day p + p{margin-top:4px}
  .day p.sub{color:var(--muted);font-size:11px}
  .tt{margin-top:16px;padding:0;overflow:hidden}
  .tt h3{font-size:15px;font-weight:900;padding:14px 18px;background:#F6EFD9;color:#5B4612}
  .tt table{width:100%;border-collapse:collapse;font-size:14.5px}
  .tt td{padding:11px 18px;border-top:1px solid var(--line);vertical-align:top;word-break:keep-all}
  .tt td:first-child{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;width:1%}
  .tt td:last-child{color:#3A3533}

  /* 일정 (달력) */
  .cal{padding:16px 14px 14px}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-top b{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:900}
  .cal-top button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  .cal-top button svg{width:18px;height:18px}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .dow{font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
  .dow:first-child,.cell.sun .n{color:#C23A3A}
  .dow:last-child,.cell.sat .n{color:#2F5FA8}
  .cell{position:relative;border:0;background:none;font:inherit;border-radius:10px;padding:5px 0 9px;min-height:46px;cursor:pointer;color:var(--ink)}
  .cell.out{visibility:hidden}
  .cell .n{font-size:14px;font-weight:500;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%}
  .cell.today .n{background:var(--ink);color:#fff!important;font-weight:900}
  .cell.sel{background:var(--brand-soft)}
  .cell .dots{position:absolute;left:0;right:0;bottom:5px;display:flex;justify-content:center;gap:3px}
  .cell .dots i{width:6px;height:6px;border-radius:50%}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:10px 4px 0;font-size:12px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:8px;height:8px;border-radius:50%}
  .evlist{margin-top:12px}
  .evlist h3{font-size:14px;font-weight:700;color:var(--muted);margin:0 4px 8px}
  .ev{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .ev + .ev{margin-top:8px}
  .ev .when{flex:none;width:46px;text-align:center;line-height:1.15}
  .ev .when b{display:block;font-size:20px;font-weight:900}
  .ev .when span{font-size:11.5px;color:var(--muted)}
  .ev .what{flex:1;min-width:0;border-left:3px solid var(--brand);padding-left:12px}
  .ev .what b{display:block;font-size:15px;word-break:keep-all}
  .ev .what span{font-size:13px;color:var(--muted);word-break:keep-all}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}

  /* FAQ */
  .faq details{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .faq details + details{margin-top:10px}
  .faq summary{list-style:none;cursor:pointer;padding:18px 20px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::before{content:"Q";flex:none;width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
  .faq summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none}
  .faq details[open] summary::after{transform:rotate(-135deg)}
  .faq .ans{padding:0 20px 20px}
  .pt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .pt .ck{flex:none;width:22px;height:22px;border-radius:6px;background:#E8F5EC;color:#1E7A46;display:grid;place-items:center;margin-top:2px}
  .pt .ck svg{width:15px;height:15px}
  .pt b{display:block;font-size:15px;word-break:keep-all}
  .pt span{display:block;font-size:13.5px;color:var(--muted);word-break:keep-all}
  .faq .closing{margin-top:8px}

  /* 사진 띠 */
  .marquee{margin:0 -16px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .track{display:flex;gap:10px;width:max-content;animation:flow var(--dur,40s) linear infinite}
  .marquee:hover .track,.marquee.paused .track{animation-play-state:paused}
  .track img{width:200px;height:150px;object-fit:cover;border-radius:14px;flex:none;cursor:pointer;background:#EEE6DF;display:block}
  @keyframes flow{to{transform:translateX(calc(-50% - 5px))}}
  .lightbox{position:fixed;inset:0;background:rgba(20,10,10,.92);display:grid;place-items:center;padding:16px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
  .lightbox.on{opacity:1;pointer-events:auto}
  .lightbox img{max-width:100%;max-height:85vh;border-radius:12px}

  /* 상담 */
  .callbig{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--brand);color:#fff;text-decoration:none;border-radius:16px;padding:18px;font-size:18px;font-weight:900;letter-spacing:.02em}
  .callbig svg{width:22px;height:22px}
  .callbig small{display:block;font-size:12.5px;font-weight:500;opacity:.85;letter-spacing:0}
  .links{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .link{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
  .link:active{transform:scale(.98)}
  .link:hover{border-color:var(--brand)}
  .link .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
  .link .ic svg{width:22px;height:22px}
  .link.main{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
  .text{flex:1;min-width:0}
  .name{display:block;font-weight:700;font-size:16px;word-break:keep-all}
  .desc{display:block;font-size:13px;color:var(--muted);margin-top:1px;word-break:keep-all}
  .arrow{flex:none;opacity:.4}

  footer.foot{margin-top:56px;background:#2A2524;color:#CFC6C0;font-size:13px;line-height:1.8}
  footer.foot .in{max-width:560px;margin:0 auto;padding:28px 20px calc(30px + env(safe-area-inset-bottom))}
  footer.foot b{color:#fff;font-family:'Noto Serif KR',serif;font-size:16px}
  footer.foot a{color:#fff}

  .totop{position:fixed;right:16px;bottom:20px;z-index:30;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s;cursor:pointer}
  .totop svg{width:22px;height:22px}
  .totop.on{opacity:.9;pointer-events:auto}

  .reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .reveal{opacity:1;transform:none;transition:none}
    .track{animation-duration:calc(var(--dur,40s) * 3)}
    .drawer .panel,.drawer .dim{transition:none}
  }
  #app{opacity:0;transition:opacity .25s}
  #app.ready{opacity:1}
</style>
</head>
<body>
<div id="app"></div>

<script>
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  news:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h6M7 12h10M7 16h10"/>',
  blog:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  insta:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/>',
  youtube:'<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9 5 3-5 3Z" fill="currentColor"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  map:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9Z"/>',
  chat:'<path d="M4 5h16v11H9l-5 4Z"/><path d="M8 9.5h8M8 12.5h5"/>',
  kakao:'<path d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 6L6.5 20l3.6-2.3c.6.1 1.2.1 1.9.1 5 0 9-3.1 9-7s-4-6.8-9-6.8Z"/>',
  photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 8"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.3 1 2.2h5.2c0-.9.4-1.7 1-2.2A6 6 0 0 0 12 3Z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2Z"/><path d="M4 21V5"/><path d="M8 7h8"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .8c0 1.7-2.5 2.2-2.5 4"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/>',
  run:'<circle cx="14" cy="4.5" r="2"/><path d="m6 20 3.5-5 3 2 1.5-6"/><path d="M9 9.5 12 8l3 3 3.5 1"/><path d="m14 11-2 5"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  up:'<path d="m6 15 6-6 6 6"/>', left:'<path d="m15 6-6 6 6 6"/>', right:'<path d="m9 6 6 6-6 6"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>', close:'<path d="M6 6l12 12M18 6 6 18"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const AREA_COLORS = ['var(--orange)','var(--teal)','var(--navy)','var(--brand)'];
const EV_COLORS = { '수련':'#3C8D5A', '심사':'#A40F16', '대회':'#1F3B63', '행사':'#D9822B', '휴관':'#8A837E', '기타':'#2E9C9A' };
const DAYS = ['월','화','수','목','금'];
const WEEK = ['일','월','화','수','목','금','토'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (name, sw=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.link}</svg>`;
const arrow = '<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const list = a => (a || []).filter(Boolean);

// 날짜 도우미 (한국 시간 기준으로 오늘을 계산)
const pad = n => String(n).padStart(2, '0');
const ymd = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const TODAY = (() => { const n = new Date(); const k = new Date(n.getTime() + (n.getTimezoneOffset() + 540) * 60000); return new Date(k.getFullYear(), k.getMonth(), k.getDate()); })();
const dayDiff = (a, b) => Math.round((a - b) / 86400000);
const krDate = dt => `${dt.getMonth()+1}월 ${dt.getDate()}일 ${WEEK[dt.getDay()]}요일`;

let D, EVENTS = [];
let sectionNo = 0;
const head = title => `<div class="sec-head"><span class="no">${++sectionNo}</span><h2>${esc(title)}</h2></div>`;
const sec = (id, title, inner) => `<section class="sec reveal" id="${id}">${head(title)}${inner}</section>`;

function render(d){
  D = d; sectionNo = 0;
  EVENTS = list(d.schedule).filter(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date)).map(e => {
    const s = parseD(e.date); let en = e.end && /^\d{4}-\d{2}-\d{2}$/.test(e.end) ? parseD(e.end) : s;
    if(en < s) en = s;
    return {...e, s, en};
  }).sort((a, b) => a.s - b.s);

  const brand = esc(d.footerSub || '해랑경희 태권도장');
  const intro = list(d.intro).map(p => `<p>${esc(p).split(brand).join(`<strong>${brand}</strong>`)}</p>`).join('');

  const S = {};   // id → {label, icon, html}
  const ph = d.philosophy || {};
  if(list(ph.questions).length || list(ph.message).length) S.philosophy = {label:'교육 철학', icon:'bulb', html: sec('philosophy', ph.title || '교육 철학', `
      ${list(ph.questions).map((q,i) => (i ? '<div class="plus">+</div>' : '') + `<div class="q ${i % 2 ? 'q2' : 'q1'}">${esc(q)}</div>`).join('')}
      ${list(ph.message).length ? `<div class="card letter">${list(ph.message).map(p => `<p>${esc(p)}</p>`).join('')}<p class="sign">감사합니다.</p></div>` : ''}`)};

  const st = d.staff || {};
  if(list(st.members).length) S.staff = {label:'지도진 소개', short:'지도진', icon:'user', html: sec('staff', st.title || '지도진 소개', `
      ${st.lead ? `<p class="lead">${esc(st.lead)}</p>` : ''}
      <div class="staff">${list(st.members).map((m,i) => `
        <div class="card member${i === 0 ? ' lead-member' : ''}">
          ${m.photo ? `<img class="photo" src="${esc(m.photo)}" alt="${esc(m.name)} ${esc(m.role)}" loading="lazy">` : ''}
          <div class="body">
            <div class="who"><span class="role">${esc(m.role)}</span><span class="name">${esc(m.name)}</span></div>
            <ul>${list(m.career).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
          </div>
        </div>`).join('')}
      </div>
      ${st.note ? `<p class="note">${esc(st.note)}</p>` : ''}`)};

  const cu = d.curriculum || {};
  if(list(cu.areas).length || list(cu.goals).length) S.curriculum = {label:'교육 내용', icon:'book', html: sec('curriculum', cu.title || '교육 내용', `
      <div class="areas">${list(cu.areas).map((a,i) => `
        <div class="area" style="background:${AREA_COLORS[i % AREA_COLORS.length]}">
          <h3>${esc(a.name)}</h3><div class="chips">${list(a.items).map(x => `<span>${esc(x)}</span>`).join('')}</div>
        </div>`).join('')}</div>
      ${list(cu.goals).length ? `<div class="card goals">${list(cu.goals).map(g => `<div class="goal"><b>${esc(g.title)}</b><span>${esc(g.desc)}</span></div>`).join('')}</div>` : ''}
      ${cu.closing ? `<p class="closing">${esc(cu.closing)}</p>` : ''}`)};

  const pr = d.program || {};
  if(list(pr.divisions).length || list(pr.timetable).length) S.program = {label:'프로그램·시간표', short:'시간표', icon:'clock', html: sec('program', pr.title || '수련 프로그램 및 시간표', `
      ${list(pr.divisions).length ? `
        <div class="tabs" role="tablist">${list(pr.divisions).map((v,i) => `<button type="button" role="tab" data-div="${i}" class="${i ? '' : 'on'}">${esc(v.name)}</button>`).join('')}</div>
        <div id="divBox"></div>` : ''}
      ${list(pr.timetable).length ? `
        <div class="card tt"><h3>수련 시간표</h3><table>${list(pr.timetable).map(r => `<tr><td>${esc(r.time)}</td><td>${esc(r.who)}</td></tr>`).join('')}</table></div>` : ''}`)};

  S.schedule = {label:'도장 일정', short:'일정', icon:'calendar', html: sec('schedule', '해랑경희 일정', `
      <div class="card cal" id="cal"></div>
      <div class="legend">${Object.entries(EV_COLORS).map(([k,c]) => `<span><i style="background:${c}"></i>${k}</span>`).join('')}</div>
      <div class="evlist" id="evlist"></div>`)};

  if(list(d.faq).length) S.faq = {label:'자주 묻는 질문', icon:'help', html: sec('faq', '자주 묻는 질문', `
      <div class="faq">${list(d.faq).map((f,i) => `
        <details${i === 0 ? ' open' : ''}><summary>${esc(f.q)}</summary><div class="ans">
          ${list(f.points).map(p => `<div class="pt"><span class="ck">${svg('check',3)}</span><div><b>${esc(p.t)}</b>${p.d ? `<span>${esc(p.d)}</span>` : ''}</div></div>`).join('')}
          ${f.closing ? `<p class="closing">${esc(f.closing)}</p>` : ''}
        </div></details>`).join('')}</div>`)};

  if(list(d.gallery).length) S.gallery = {label:'사진', icon:'photo', html: sec('gallery', d.galleryTitle || '사진으로 보는 해랑경희', gallery(d))};

  const ct = d.contact || {};
  const tel = (ct.phone || '').replace(/[^0-9+]/g, '');
  S.contact = {label:'상담 문의', icon:'phone', html: sec('contact', ct.title || '상담 및 문의하기', `
      ${tel ? `<a class="callbig" href="tel:${esc(tel)}">${svg('phone')}<span>${esc(ct.phone)}<small>눌러서 바로 전화 상담</small></span></a>` : ''}
      <nav class="links">${list(d.links).map(l => `
        <a class="link${l.main ? ' main' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener">
          <span class="ic">${svg(l.icon)}</span>
          <span class="text"><span class="name">${esc(l.name)}</span>${l.desc ? `<span class="desc">${esc(l.desc)}</span>` : ''}</span>
          ${arrow}
        </a>`).join('')}</nav>`)};

  S.today = {label:'오늘의 운동', icon:'run'};

  // 메뉴 묶음 (학교 홈페이지처럼 큰 메뉴 → 작은 메뉴)
  const GROUPS = [
    {name:'도장 소개', items:['philosophy','staff']},
    {name:'수련 안내', items:['curriculum','program','faq']},
    {name:'도장 소식', items:['today','schedule','gallery']},
    {name:'상담 문의', items:['contact']}
  ].map(g => ({...g, items: g.items.filter(id => S[id])})).filter(g => g.items.length);

  const inline = GROUPS.map(g => `<div class="grp"><a href="#${g.items[0]}">${esc(g.name)}</a>
      ${g.items.length > 1 ? `<div class="drop">${g.items.map(id => `<a href="#${id}">${esc(S[id].label)}</a>`).join('')}</div>` : ''}</div>`).join('');
  const drawer = GROUPS.map(g => `<div class="g"><h3>${esc(g.name)}</h3>
      ${g.items.map(id => `<a href="#${id}" data-close><span class="ic">${svg(S[id].icon)}</span>${esc(S[id].label)}</a>`).join('')}</div>`).join('');

  const tileIds = ['philosophy','staff','curriculum','program','schedule','today','faq','gallery'].filter(id => S[id]);
  const shortcuts = `
    <div class="label">바로가기</div>
    <div class="shortcuts">
      ${tileIds.map(id => `<a class="sc" href="#${id}"><span class="ic">${svg(S[id].icon)}</span>${esc(S[id].short || S[id].label)}</a>`).join('')}
      <a class="sc sc-call" href="#contact"><span class="ic">${svg('phone')}</span>상담 문의하기</a>
    </div>`;

  const order = ['philosophy','staff','curriculum','program','schedule','faq','gallery','contact'];

  document.getElementById('app').innerHTML = `
    <div class="gnb"><div class="in">
      <a class="logo" href="#top"><span class="mark">跆</span><b>${esc(d.title)}</b><small>태권도장</small></a>
      <nav class="menu-inline">${inline}</nav>
      ${tel ? `<a class="iconbtn call" href="tel:${esc(tel)}" aria-label="전화 상담">${svg('phone')}</a>` : ''}
      <button class="iconbtn menu-btn" id="menuBtn" type="button" aria-label="전체 메뉴" aria-expanded="false">${svg('menu')}</button>
    </div></div>

    <div class="drawer" id="drawer" aria-hidden="true">
      <div class="dim" data-close></div>
      <div class="panel" role="dialog" aria-label="전체 메뉴">
        <div class="phead"><b>전체 메뉴</b><button class="iconbtn" type="button" data-close aria-label="닫기">${svg('close')}</button></div>
        <div class="pbody">${drawer}</div>
        ${tel ? `<div class="pfoot"><a class="callbig" href="tel:${esc(tel)}">${svg('phone')}<span>${esc(ct.phone)}<small>전화 상담</small></span></a></div>` : ''}
      </div>
    </div>

    <div class="hero" id="top"><div class="greet">${esc(d.greet)}</div><h1>${esc(d.title)}<small>${esc(d.subtitle)}</small></h1></div>
    <main class="wrap">
      <section class="card intro">${intro}</section>
      <div class="home">
        ${workoutCard(d)}
        ${upcomingCard()}
        ${noticeCard(d)}
      </div>
      ${shortcuts}
      ${order.filter(id => S[id] && S[id].html).map(id => S[id].html).join('')}
    </main>
    <footer class="foot"><div class="in">
      <b>${esc(d.footerSub)}</b><br>
      ${ct.phone ? `상담 전화 <a href="tel:${esc(tel)}">${esc(ct.phone)}</a><br>` : ''}
      ${esc(d.footer)} · © ${TODAY.getFullYear()} ${esc(d.footerSub)}
    </div></footer>
    <button class="totop" id="totop" type="button" aria-label="맨 위로">${svg('up',2.6)}</button>`;

  document.getElementById('app').classList.add('ready');
  setupMenu(); setupTabs(); setupCalendar(); setupWorkout(); setupGallery(); setupTop(); setupReveal();
}

// ---------- 오늘의 운동 (월간 수련 계획표 + 일정에서 자동으로) ----------
// 이번 달 계획이 있으면 그걸, 없으면 가장 최근 달 계획의 요일별 테마를 사용
function monthPlan(d){
  const ms = list((d.monthly || {}).months).filter(m => m.month).sort((a, b) => a.month.localeCompare(b.month));
  const cur = ymd(TODAY).slice(0, 7);
  return { exact: ms.find(m => m.month === cur), plan: ms.find(m => m.month === cur) || ms.filter(m => m.month < cur).pop() || ms[ms.length - 1] };
}
function workoutCard(d){
  const mo = d.monthly || {};
  const { plan } = monthPlan(d);
  const dow = TODAY.getDay(), weekend = dow === 0 || dow === 6;
  const evs = eventsOn(TODAY);
  const off = evs.filter(e => e.type === '휴관');
  const items = plan ? list((plan.weekday || {})[WEEK[dow]]) : [];
  const evRows = evs.filter(e => e.type !== '휴관').map(e => {
    const c = EV_COLORS[e.type] || EV_COLORS['기타'];
    return `<div class="focus"><span class="tag" style="background:${c}">${esc(e.type === '수련' ? '이번 주 집중' : e.type || '일정')}</span><b>${esc(e.title)}</b>${e.note ? `<span>${esc(e.note)}</span>` : ''}</div>`;
  }).join('');

  let body;
  if(off.length){
    body = `<div class="theme">오늘은 쉬는 날이에요</div><p class="sub">${off.map(e => esc(e.title)).join(', ')}</p>`;
  }else if(weekend && !evRows && !items.length){
    body = `<div class="theme">${esc(mo.weekendText || '즐거운 주말! 월요일에 만나요 ☺')}</div>`;
  }else{
    body = `${evRows ? `<div class="focusbox">${evRows}</div>` : ''}
      ${items.length ? `<ol>${items.map(i => `<li><b>${esc(i)}</b></li>`).join('')}</ol>` : ''}
      ${!evRows && !items.length ? `<div class="theme">오늘은 정해진 운동이 없어요</div>` : ''}`;
  }
  return `<div class="card hc wo anchor" id="today">
    <div class="hc-head"><span class="ic">${svg('run')}</span><h2>${esc(mo.title || '오늘의 운동')}<small>${krDate(TODAY)}</small></h2><a class="more" href="#schedule">이달 일정 ›</a></div>
    ${body}
    <div class="note"></div>
  </div>`;
}
function noticeCard(d){
  const { exact } = monthPlan(d);
  const ns = exact ? list(exact.notices) : [];
  if(!ns.length) return '';
  return `<div class="card hc nt">
    <div class="hc-head"><span class="ic">${svg('star')}</span><h2>${+exact.month.slice(5)}월 공지사항<small>해랑경희 태권도장</small></h2></div>
    <ul>${ns.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
  </div>`;
}
function setupWorkout(){}

// ---------- 일정 ----------
function upcomingCard(){
  const next = EVENTS.filter(e => e.en >= TODAY).slice(0, 3);
  return `<div class="card hc up">
    <div class="hc-head"><span class="ic">${svg('calendar')}</span><h2>다가오는 일정<small>해랑경희 소식</small></h2><a class="more" href="#schedule">전체 보기 ›</a></div>
    ${next.length ? `<ul>${next.map(e => {
      const n = dayDiff(e.s, TODAY);
      const label = n > 0 ? 'D-' + n : (n === 0 ? '오늘' : '진행 중');
      return `<li><span class="dday${n <= 0 ? ' now' : ''}">${label}</span><div class="t"><b>${esc(e.title)}</b><span>${rangeText(e)}${e.note ? ' · ' + esc(e.note) : ''}</span></div></li>`;
    }).join('')}</ul>` : `<p class="empty">예정된 일정이 없어요.</p>`}
  </div>`;
}
function rangeText(e){
  const a = `${e.s.getMonth()+1}.${e.s.getDate()}(${WEEK[e.s.getDay()]})`;
  if(+e.en === +e.s) return a;
  return `${a} ~ ${e.en.getMonth()+1}.${e.en.getDate()}(${WEEK[e.en.getDay()]})`;
}
const eventsOn = dt => EVENTS.filter(e => e.s <= dt && dt <= e.en);

function setupCalendar(){
  const cal = document.getElementById('cal'), box = document.getElementById('evlist');
  if(!cal) return;
  let y = TODAY.getFullYear(), m = TODAY.getMonth(), sel = null;
  const draw = () => {
    const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate(), lead = first.getDay();
    let cells = '';
    for(let i = 0; i < lead; i++) cells += '<span class="cell out"></span>';
    for(let dd = 1; dd <= days; dd++){
      const dt = new Date(y, m, dd), evs = eventsOn(dt);
      const cls = ['cell', dt.getDay() === 0 ? 'sun' : '', dt.getDay() === 6 ? 'sat' : '', evs.some(e => e.type === '휴관') ? 'off' : '', +dt === +TODAY ? 'today' : '', sel && +dt === +sel ? 'sel' : ''].join(' ');
      cells += `<button type="button" class="${cls}" data-d="${dd}" aria-label="${m+1}월 ${dd}일${evs.length ? ', 일정 ' + evs.length + '개' : ''}"><span class="n">${dd}</span>
        ${evs.length ? `<span class="dots">${evs.slice(0,3).map(e => `<i style="background:${EV_COLORS[e.type] || EV_COLORS['기타']}"></i>`).join('')}</span>` : ''}</button>`;
    }
    cal.innerHTML = `<div class="cal-top"><button type="button" data-mv="-1" aria-label="이전 달">${svg('left')}</button><b>${y}년 ${m+1}월</b><button type="button" data-mv="1" aria-label="다음 달">${svg('right')}</button></div>
      <div class="grid7">${WEEK.map(w => `<span class="dow">${w}</span>`).join('')}${cells}</div>`;
    cal.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { m += +b.dataset.mv; if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; } sel = null; draw(); });
    cal.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const dt = new Date(y, m, +b.dataset.d); sel = sel && +sel === +dt ? null : dt; draw(); });
    // 아래 목록: 고른 날 → 그날 일정, 아니면 이번 달 전체
    let evs, title;
    if(sel){ evs = eventsOn(sel); title = krDate(sel); }
    else{ const s = new Date(y, m, 1), e = new Date(y, m+1, 0); evs = EVENTS.filter(x => x.s <= e && x.en >= s); title = `${m+1}월 일정`; }
    box.innerHTML = `<h3>${title}</h3>` + (evs.length ? evs.map(e => `
      <div class="ev"><div class="when"><b>${e.s.getDate()}</b><span>${e.s.getMonth()+1}월 ${WEEK[e.s.getDay()]}</span></div>
        <div class="what" style="border-color:${EV_COLORS[e.type] || EV_COLORS['기타']}"><b><span class="tag" style="background:${EV_COLORS[e.type] || EV_COLORS['기타']}">${esc(e.type || '기타')}</span>${esc(e.title)}</b>
        <span>${rangeText(e)}${e.note ? ' · ' + esc(e.note) : ''}</span></div></div>`).join('') : `<div class="ev"><div class="what" style="border-color:var(--line)"><span>등록된 일정이 없어요.</span></div></div>`);
  };
  draw();
}

// ---------- 프로그램 탭 ----------
function setupTabs(){
  const box = document.getElementById('divBox');
  if(!box) return;
  const today = DAYS[TODAY.getDay() - 1];
  const show = i => {
    const v = list(D.program.divisions)[i];
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', +b.dataset.div === i));
    box.innerHTML = `
      ${v.common ? `<p class="common">매일 <b>${esc(v.common)}</b></p>` : ''}
      <div class="days">${DAYS.map(dd => `
        <div class="day${dd === today ? ' today' : ''}"><div class="d">${dd}</div>
          ${list((v.days || {})[dd]).map(x => `<p class="${/^\(.*\)$/.test(x) ? 'sub' : ''}">${esc(x)}</p>`).join('')}
        </div>`).join('')}</div>`;
  };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(+b.dataset.div));
  show(0);
}

// ---------- 사진 ----------
function gallery(d){
  const pics = list(d.gallery);
  let row = pics.slice();
  while(row.length < 8) row = row.concat(pics);
  const imgs = row.map(p => `<img src="${esc(p)}" alt="수업 사진" decoding="async">`).join('');
  return `<div class="marquee"><div class="track" style="--dur:${row.length * 4}s">${imgs}${imgs}</div></div>`;
}
function setupGallery(){
  const m = document.querySelector('.marquee');
  if(!m) return;
  const lb = document.createElement('div');
  lb.className = 'lightbox'; lb.innerHTML = '<img alt="">';
  document.body.append(lb);
  m.addEventListener('click', e => {
    if(e.target.tagName !== 'IMG') return;
    lb.querySelector('img').src = e.target.src;
    lb.classList.add('on'); m.classList.add('paused');
  });
  lb.addEventListener('click', () => { lb.classList.remove('on'); m.classList.remove('paused'); });
}

// ---------- 메뉴 ----------
function setupMenu(){
  const dr = document.getElementById('drawer'), btn = document.getElementById('menuBtn');
  const open = on => {
    dr.classList.toggle('on', on); document.body.classList.toggle('lock', on);
    dr.setAttribute('aria-hidden', on ? 'false' : 'true'); btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  };
  btn.onclick = () => open(true);
  dr.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => open(false)));
  document.addEventListener('keydown', e => { if(e.key === 'Escape') open(false); });
}
function setupTop(){
  const top = document.getElementById('totop');
  top.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
  const f = () => top.classList.toggle('on', window.scrollY > 700);
  window.addEventListener('scroll', f, {passive:true}); f();
}
function setupReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -8% 0px'});
  els.forEach(e => io.observe(e));
  const showHash = () => { const t = location.hash && document.querySelector(location.hash); if(t) t.classList.add('in'); };
  window.addEventListener('hashchange', showHash); showHash();
}

fetch('data.json?t=' + Date.now())
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById('app').innerHTML = '<p style="padding:40px 20px;text-align:center;color:#6B6460">내용을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>';
    document.getElementById('app').classList.add('ready');
  });
</script>
