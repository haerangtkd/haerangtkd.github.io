<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해랑경희 태권도장</title>
<meta name="description" content="해랑경희 태권도장의 교육 철학, 지도진, 수련 프로그램과 시간표, 일정과 오늘의 운동을 한눈에 보실 수 있습니다.">
<meta property="og:title" content="해랑경희 태권도장">
<meta property="og:description" content="교육 철학 · 지도진 · 시간표 · 일정 · 오늘의 운동 · 상담 문의">
<meta property="og:type" content="website">
<meta property="og:image" content="https://haerangtkd.github.io/img/og.jpg">
<meta name="naver-site-verification" content="45f7b7b64b60a4980ac6398f9fad8636f1121985" />
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#A40F16; --brand-deep:#7A0B10; --brand-soft:#FBEDEE;
    --ink:#1C1A19; --muted:#6B6460; --paper:#FBF8F4; --card:#FFFFFF; --line:#ECE5DE;
    --orange:#D9822B; --teal:#2E9C9A; --navy:#1F3B63; --gray:#8A837E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  body.lock{overflow:hidden}
  a{color:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}
  [hidden]{display:none!important}

  /* ---------- 상단: 로고 줄 ---------- */
  .top{background:var(--brand);position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .top .in{max-width:1080px;margin:0 auto;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px}
  .logo{margin-right:auto;display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:900;font-size:14px}
  .logo img{height:36px;width:auto;display:block}
  .logo .lion-h{display:none}
  body.is-home .logo .logo-full{display:none}
  body.is-home .logo .lion-h{display:block;height:40px}
  body:not(.is-home) .top{background:#fff;border-bottom:1px solid var(--line);box-shadow:none}
  body:not(.is-home) .tel{color:var(--brand)}
  body:not(.is-home) .allmenu{background:var(--brand);color:#fff}
  .tel{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;text-decoration:none}
  .tel svg{width:23px;height:23px}
  .allmenu{display:flex;align-items:center;gap:6px;border:0;background:#fff;color:var(--brand);font:inherit;font-weight:900;font-size:14px;padding:9px 14px 9px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .allmenu svg{width:18px;height:18px}
  .allmenu:active{transform:scale(.96)}

  /* ---------- 상단: 메뉴 바 (스크롤해도 따라옴) ---------- */
  .gnb{display:none;position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .gnb .in{max-width:1080px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
  .gnb .in::-webkit-scrollbar{display:none}
  .gnb a{flex:1 0 auto;text-align:center;text-decoration:none;font-weight:700;font-size:15px;color:#3A3533;padding:13px 12px 11px;border-bottom:3px solid transparent;white-space:nowrap}
  .gnb a.on{color:var(--brand);border-bottom-color:var(--brand)}
  @media (min-width:900px){
    .top .in{height:64px}
    .logo img{height:42px}
    .gnb .in{justify-content:center;gap:28px}
    .gnb a{flex:0 0 auto;font-size:17px;padding:16px 18px 14px}
  }

  /* 전체메뉴 */
  .drawer{position:fixed;inset:0;z-index:50;visibility:hidden}
  .drawer.on{visibility:visible}
  .drawer .dim{position:absolute;inset:0;background:rgba(20,10,10,.45);opacity:0;transition:opacity .25s}
  .drawer.on .dim{opacity:1}
  .drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(88vw,400px);background:#fff;transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column}
  .drawer.on .panel{transform:none}
  .drawer .phead{height:64px;display:flex;align-items:center;padding:0 8px 0 18px;background:var(--brand);color:#fff}
  .drawer .phead b{font-size:18px;font-weight:900;margin-right:auto;display:flex;align-items:center;gap:8px}
  .drawer .phead b svg{width:20px;height:20px}
  .drawer .x{width:44px;height:44px;border:0;background:none;color:#fff;border-radius:12px;display:grid;place-items:center;cursor:pointer}
  .drawer .x svg{width:24px;height:24px}
  .drawer .pbody{flex:1;overflow-y:auto;padding:6px 18px 20px}
  .drawer .g{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
  .drawer .g:last-child{border-bottom:0}
  .drawer .g h3{font-size:15.5px;font-weight:900;color:var(--brand);padding-top:7px}
  .drawer .g div{display:flex;flex-direction:column}
  .drawer .g a{text-decoration:none;font-size:15.5px;font-weight:500;padding:7px 10px;border-radius:9px}
  .drawer .g a:active,.drawer .g a:hover{background:var(--brand-soft);color:var(--brand)}
  .drawer .pfoot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

  /* ---------- 홈 ---------- */
  .hero{background:var(--brand);color:#fff;padding:46px 16px 84px;text-align:center;position:relative;overflow:hidden}
  .ht{width:min(100%,480px);margin:0 auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
  .ht img{display:block;width:100%;height:auto}
  .ht .ht-slogan{width:99%}
  .hero:has(.hphoto){padding-bottom:40px}
  .hero:has(.hphoto) + .wrap .intro{margin-top:16px}
  .hphoto{position:relative;z-index:2;margin:22px auto 0;width:min(100%,480px);aspect-ratio:4/3;border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.9);background:#7A0B10}
  .hphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .9s}
  .hphoto img.on{opacity:1}
  .hphoto .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
  .hphoto .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);transition:width .3s}
  .hphoto .dots i.on{background:#fff;width:18px;border-radius:3px}
  .hero .wm{position:absolute;right:-50px;bottom:-60px;width:250px;opacity:.09;pointer-events:none}
  .greet{font-size:13px;letter-spacing:.18em;opacity:.85;margin-bottom:12px}
  .hero h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:30px;line-height:1.3}
  .slogan{margin:12px auto 0;max-width:330px;font-size:13.5px;line-height:1.6;opacity:.9;word-break:keep-all}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 20px}
  .intro{margin-top:-46px;position:relative;box-shadow:0 6px 24px rgba(60,20,20,.08)}
  .intro p{font-size:15.5px;word-break:keep-all}
  .intro p + p{margin-top:12px}
  .intro strong{color:var(--brand)}
  .home{display:grid;gap:12px;margin-top:14px}
  .hc{padding:0;overflow:hidden}
  .hc-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
  .hc-head .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
  .hc-head .ic svg{width:20px;height:20px}
  .hc-head h2{font-size:16.5px;font-weight:900;line-height:1.3}
  .hc-head h2 small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
  .hc-head .more{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;white-space:nowrap}
  .wo{background:#2A2524;color:#fff;border:0}
  .wo .hc-head .ic{background:rgba(255,255,255,.15);color:#fff}
  .wo .hc-head h2 small{color:rgba(255,255,255,.75)}
  .wo .hc-head .more{color:rgba(255,255,255,.8)}
  .wo .theme{padding:0 18px 4px;font-family:'Noto Serif KR',serif;font-weight:900;font-size:21px;word-break:keep-all}
  .wo .sub{padding:4px 18px 0;font-size:14px;color:rgba(255,255,255,.8)}
  .wo ol{list-style:none;padding:8px 18px 4px;counter-reset:w}
  .wo li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.14);counter-increment:w}
  .wo li::before{content:counter(w);flex:none;width:24px;height:24px;border-radius:50%;background:#fff;color:#2A2524;font-size:12.5px;font-weight:900;display:grid;place-items:center}
  .wo li b{flex:1;font-size:15px;word-break:keep-all}
  .wo .focusbox{padding:2px 18px 6px;display:flex;flex-direction:column;gap:8px}
  .wo .focus{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;line-height:1.45}
  .wo .focus b{font-size:16px;word-break:keep-all}
  .wo .focus > span:last-child:not(.tag){display:block;font-size:12.5px;color:rgba(255,255,255,.75);margin-top:2px}
  .wo .focus .tag{border:1px solid rgba(255,255,255,.4)}
  .wo .pad{height:12px}
  .up .hc-head .ic{background:var(--brand-soft);color:var(--brand)}
  .up ul{list-style:none;padding:0 18px 16px}
  .up li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .dday{flex:none;min-width:54px;text-align:center;font-size:13px;font-weight:900;border-radius:999px;padding:3px 8px;background:var(--brand-soft);color:var(--brand)}
  .dday.now{background:var(--brand);color:#fff}
  .up li .t{flex:1;min-width:0}
  .up li .t b{display:block;font-size:15px;word-break:keep-all}
  .up li .t span{font-size:12.5px;color:var(--muted)}
  .empty{padding:4px 18px 18px;font-size:14px;color:var(--muted)}
  .nt .hc-head .ic{background:#FFF3DC;color:#B7791F}
  .nt ul{list-style:none;padding:0 18px 16px}
  .nt li{position:relative;padding:10px 0 10px 16px;border-top:1px solid var(--line);font-size:14.5px;word-break:keep-all}
  .nt li::before{content:"";position:absolute;left:2px;top:19px;width:6px;height:6px;border-radius:50%;background:#D9822B}
  .seg{margin:30px 4px 12px}
  .seg h2{font-size:18px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:8px}
  .seg h2::before{content:'';width:4px;height:18px;border-radius:2px;background:var(--brand)}
  .seg p{font-size:13px;color:var(--muted);margin-top:2px;padding-left:12px}
  .seg2{margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
  .label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin:32px 4px 12px}
  .shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sc{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 4px 11px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;text-align:center;word-break:keep-all;line-height:1.3;transition:transform .15s,border-color .15s}
  .sc:active{transform:scale(.95)}
  .sc:hover{border-color:var(--brand)}
  .sc .ic{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
  .sc .ic svg{width:20px;height:20px}
  .shortcuts.three{grid-template-columns:repeat(3,1fr)}
  .sc-call{grid-column:1/-1;flex-direction:row;justify-content:center;background:var(--brand);border-color:var(--brand);color:#fff;font-size:15px;padding:14px}
  .sc-call .ic{width:auto;height:auto;background:none;color:#fff}

  /* 홈: 사진 | 알림판 두 칸 */
  /* 폰: 사진 | 행사 반반 + 알림판 아래 / 넓은 화면: 세 칸 */
  .twin{display:grid;gap:10px;margin-top:12px;grid-template-columns:1fr 1fr}
  .twin .wide{grid-column:1/-1}
  @media (min-width:900px){ .twin{grid-template-columns:1fr 1fr 1fr;gap:12px} .twin .wide{grid-column:auto} }
  .mini{padding:12px 12px 12px}
  .mini .ph{margin-bottom:10px}
  .mini .ph h3{white-space:normal;word-break:keep-all;font-size:14.5px;line-height:1.35}
  .mini .slides{aspect-ratio:1}
  .ctrl{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:8px}
  .ctrl button{flex:none;width:28px;height:30px;border:0;background:none;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .ctrl button:hover{background:#F3EEE9}
  .ctrl svg{width:17px;height:17px}
  .ctrl .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 2px;white-space:nowrap}
  .ctrl .cnt b{color:var(--ink)}
  .capline{margin-top:8px;font-size:13.5px;font-weight:700;line-height:1.4;min-height:2.8em;word-break:keep-all}
  .capline small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  @media (max-width:440px){ .ph [data-prev],.ph [data-next]{display:none} }
  .sl .cap small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
  .sl .cap,.sl .dd{pointer-events:none}
  .sl .dd{position:absolute;top:8px;left:8px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:900;border-radius:999px;padding:2px 8px}
  .sl .dd.past{background:rgba(40,30,30,.6)}
  .ev .thumb{flex:none;width:52px;height:52px;border-radius:10px;object-fit:cover;cursor:zoom-in;background:#F3EEE9}
  .panel{padding:16px 16px 14px;display:flex;flex-direction:column;min-width:0}
  .ph{display:flex;align-items:center;gap:2px;margin-bottom:12px}
  .ph h3{font-size:16px;font-weight:900;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph .cnt{font-size:13px;color:var(--muted);margin-right:2px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
  .ph button,.ph a.plus{flex:none}
  @media (min-width:900px){ #homePage .wrap{max-width:860px} }
  .ph .cnt b{color:var(--ink)}
  .ph button,.ph a.plus{width:29px;height:30px;border:0;background:none;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink);text-decoration:none}
  .ph button:hover,.ph a.plus:hover{background:#F3EEE9}
  .ph svg{width:17px;height:17px}
  .ph a.plus svg{width:20px;height:20px}
  .slides{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#F3EEE9}
  .sl{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none;display:block;text-decoration:none;color:inherit}
  .sl.on{opacity:1;pointer-events:auto}
  .sl img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .sl.poster img{object-fit:contain}
  .sl .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:14px;font-weight:700;word-break:keep-all}
  .sl.text{padding:14px 14px 10px;overflow:auto;background:#FFF8EC}
  .sl.text ul{list-style:none}
  .sl.text li{position:relative;padding:8px 0 8px 14px;border-top:1px solid #F1E3C8;font-size:14px;word-break:keep-all}
  .sl.text li:first-child{border-top:0}
  .sl.text li::before{content:"";position:absolute;left:1px;top:16px;width:6px;height:6px;border-radius:50%;background:#D9822B}
  .sl.text h4{font-size:13px;color:#B7791F;margin-bottom:4px}
  .wo .flabel{padding:0 18px;font-size:12.5px;font-weight:700;color:#FFD9A8;letter-spacing:.04em}
  .wo .flabel + ol{padding-top:4px}
  .wo .theme + .sub{margin-bottom:8px}
  .fo td:first-child{color:var(--ink)}
  .fo td small.wd{display:block;font-size:12.5px;font-weight:500;color:#A9A19B;margin-top:1px}
  .fo tr.now td{background:var(--brand-soft);font-weight:700}
  .fo tr.past td{color:#A9A19B}

  /* 알림판 페이지 · 보도자료 */
  .posters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .pst{padding:0;overflow:hidden;text-decoration:none;color:inherit;display:block}
  .pst img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#F3EEE9;cursor:zoom-in}
  .pst div{padding:10px 12px 12px;font-size:14px;font-weight:700;word-break:keep-all}
  .pst div span{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  .press{display:flex;flex-direction:column;gap:12px}
  .pr{display:flex;flex-direction:column;padding:0;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .15s}
  .pr:hover{border-color:var(--brand)}
  .pr img{width:100%;height:auto;max-height:560px;object-fit:contain;display:block;background:#F3EEE9}
  .pr .b{padding:16px 18px 18px}
  .pr .src{font-size:12.5px;font-weight:700;color:var(--brand)}
  .pr .src span{color:var(--muted);font-weight:500}
  .pr h4{font-size:16.5px;font-weight:900;line-height:1.45;margin:4px 0 6px;word-break:keep-all}
  .pr p{font-size:14px;color:var(--muted);word-break:keep-all}
  .pr .go{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--brand)}
  .emptybox{text-align:center;color:var(--muted);font-size:14.5px;padding:30px 16px}

  /* 위쪽 바로가기 (한 줄, 옆으로 밀기) */
  .quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:2px 16px 4px;scroll-snap-type:x proximity}
  .quick::-webkit-scrollbar{display:none}
  .quick a{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:700;text-align:center;line-height:1.25;word-break:keep-all;scroll-snap-align:start}
  .quick a .ic{width:50px;height:50px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--brand);display:grid;place-items:center;transition:transform .15s,border-color .15s}
  .quick a:active .ic{transform:scale(.93)}
  .quick a:hover .ic{border-color:var(--brand)}
  .quick a .ic svg{width:23px;height:23px}
  @media (min-width:700px){ .quick{justify-content:center;flex-wrap:wrap;overflow:visible} }
  .addr{display:flex;align-items:center;gap:10px;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;text-decoration:none;color:var(--ink)}
  .addr .ic{flex:none;width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
  .addr .ic svg{width:20px;height:20px}
  .addr span{flex:1;min-width:0;font-size:14px;font-weight:700;word-break:keep-all}
  .addr span small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}

  /* 찾아오시는 길 */
  .mapbox{padding:0;overflow:hidden}
  .mapbox iframe{display:block;width:100%;height:320px;border:0;background:#EEE9E3}
  .mapbox .info{padding:16px 18px 18px}
  .mapbox .info b{display:block;font-size:17px;font-weight:900}
  .mapbox .info p{font-size:15px;margin-top:2px;word-break:keep-all}
  .mapbox .info .lm{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:var(--brand);margin-top:4px}
  .mapbox .info .pk{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--muted);margin-top:4px;word-break:keep-all}
  .mapbox .info .pk svg{width:15px;height:15px;flex:none}
  .mapbox .info .lm svg{width:15px;height:15px;flex:none}
  .hours h4{display:flex;align-items:center;justify-content:space-between}
  .hours .open{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#E9E2DB;color:#6B6460}
  .hours .open.on{background:#1E7A46;color:#fff}
  .hours td:first-child{color:var(--brand);font-family:'Noto Serif KR',serif;font-weight:900}
  .hours tr.today td{background:var(--brand-soft);font-weight:700}
  .hours tr.off td:last-child{color:#C23A3A}
  .park{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:16px 18px}
  .park svg{width:26px;height:26px;color:var(--brand);flex:none;margin-top:2px}
  .park b{font-size:15px}
  .park.gift>div{flex:1;min-width:0}
  .rf{margin-top:6px}
  .rr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed #EBC4C7;white-space:nowrap;font-size:14px}
  .rr span{color:#3A3533}
  .rr em{font-style:normal;font-weight:900;color:var(--brand)}
  .park.gift{background:var(--brand-soft);border-color:#F3D3D5}
  .faq .fa{font-size:14.5px;color:#3A3533;word-break:keep-all;margin:0 0 8px}
  .faq .fa:last-child{margin-bottom:0}
  .fee h4{font-size:15px;font-weight:900;color:var(--brand);margin-bottom:6px}
  .fee .plan{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
  .fee .plan b{display:block;font-size:16px}
  .fee .plan span{display:block;font-size:13px;color:var(--muted)}
  .fee .plan strong{font-size:18px;font-weight:900;white-space:nowrap}
  .fnotes{list-style:none;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
  .fnotes li{font-size:13.5px;line-height:1.75;color:var(--muted);word-break:keep-all}
  .fnotes li::before{content:'· ';color:var(--muted)}
  .shuttle{margin:22px 4px 0;font-size:15px;line-height:1.7;word-break:keep-all}
  .shuttle b{display:block;font-size:16px}
  .shuttle p{color:var(--muted);font-size:14px}
  .wo.rest{background:#EFEAE5;color:var(--ink)}
  .wo.rest .hc-head .ic{background:#fff;color:var(--muted)}
  .wo.rest .hc-head h2 small,.wo.rest .hc-head .more{color:var(--muted)}
  .wo.rest .theme{white-space:pre-line;font-size:19px;line-height:1.5;color:#5A524D}
  .btn-call{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:14px;border-radius:10px;background:var(--brand);color:#fff;font-weight:900;font-size:15px;text-decoration:none}
  .btn-call svg{width:20px;height:20px}
  .park p{font-size:14.5px;color:#3A3533;word-break:keep-all}
  .mapbox .info .note{font-size:13.5px;color:var(--muted);text-align:left;margin-top:6px}
  .mapbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .mapbtns a,.mapbtns button{display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:14px;font-weight:700;border-radius:12px;padding:12px 8px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .mapbtns .nv{background:#03C75A;border-color:#03C75A;color:#fff}
  .mapbtns .kk{background:#FEE500;border-color:#FEE500;color:#191919}
  .mapbtns .wide{grid-column:1/-1}
  .mapbtns svg{width:17px;height:17px}

  /* ---------- 영상 첫 화면 ---------- */
  .vhero{position:relative;height:min(86svh,760px);min-height:520px;background:#1C1A19;overflow:hidden;color:#fff}
  .vhero video,.vhero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .vhero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,10,.15) 0%,rgba(20,10,10,0) 30%,rgba(20,10,10,.55) 62%,rgba(20,10,10,.88) 100%)}
  .vhero .in{position:absolute;left:0;right:0;bottom:0;z-index:2;max-width:640px;margin:0 auto;padding:0 22px 34px}
  .vhero .kick{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.06em;color:#F3C9CB}
  .vhero .kick::before{content:'';width:28px;height:1px;background:currentColor}
  .vhero h1{margin-top:10px;width:min(82%,380px)}
  .vhero h1 img{display:block;width:100%;height:auto}
  .vhero .vt{margin-top:12px;font-size:15px;line-height:1.6;color:rgba(255,255,255,.88);word-break:keep-all;max-width:320px}
  .vhero .btns{display:flex;gap:8px;margin-top:20px}
  .vhero .btns a{flex:1;max-width:180px;display:flex;align-items:center;justify-content:center;height:50px;border-radius:6px;font-weight:900;font-size:15px;text-decoration:none}
  .vhero .b1{background:var(--brand);color:#fff}
  .vhero .b2{border:1px solid rgba(255,255,255,.55);color:#fff}
  .vhero + .wrap .intro{margin-top:16px}
  @media (min-width:900px){ .vhero{height:min(88vh,820px)} .vhero .in{max-width:1080px;padding:0 40px 56px} .vhero h1{width:420px} }

  /* 부서별 수업 */
  .classes{display:flex;flex-direction:column;gap:28px}
  .cls{display:block;text-decoration:none;color:inherit}
  .cls .media{position:relative;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:#2A2524}
  .cls .media video,.cls .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .cls .no{position:absolute;left:16px;top:12px;font-family:'Noto Serif KR',serif;font-weight:900;font-size:44px;line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .cls .body{padding:16px 4px 0}
  .cls .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:10px}
  .cls h3{font-size:21px;font-weight:900}
  .cls .tm{font-size:13.5px;font-weight:700;color:var(--brand);white-space:nowrap}
  .cls ul{list-style:none;margin-top:8px}
  .cls li{font-size:15px;padding:7px 0;border-bottom:1px solid var(--line);word-break:keep-all;color:#3A3533}
  .cls .go{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;color:var(--ink)}
  @media (min-width:700px){ .classes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} }

  /* 스크롤하면 나타남 */
  .rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
  .rv.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){ .rv{opacity:1;transform:none;transition:none} }

  /* ---------- 하위 페이지 ---------- */
  .pagehero{background:var(--brand);color:#fff;position:relative;overflow:hidden;padding:22px 20px 24px}
  .pagehero .in{max-width:640px;margin:0 auto;position:relative}
  .pagehero .wm{position:absolute;right:-40px;top:-30px;width:150px;opacity:.1;pointer-events:none}
  .crumb{font-size:12.5px;opacity:.8}
  .crumb a{text-decoration:none}
  .pagehero h2{font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;margin-top:2px}
  .subtabs{background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
  .subtabs .in{max-width:640px;margin:10px auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px;background:#F0ECE8;border-radius:12px;width:calc(100% - 32px)}
  .subtabs .in::-webkit-scrollbar{display:none}
  .subtabs a{flex:1 0 auto;text-align:center;text-decoration:none;font-size:14px;font-weight:600;padding:9px 10px;border-radius:9px;color:var(--muted);white-space:nowrap}
  .subtabs a.on{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .sec{padding-top:26px;animation:fadeUp .35s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .sec > h3.st{font-family:'Noto Serif KR',serif;font-weight:900;font-size:20px;line-height:1.4;word-break:keep-all;margin-bottom:16px}
  .lead{font-size:15px;color:var(--muted);margin:-6px 2px 16px;word-break:keep-all}

  /* 교육 철학 */
  .q{border-radius:12px;padding:18px 12px;font-size:15px;letter-spacing:-.02em;font-weight:700;line-height:1.6;word-break:keep-all;text-align:center;text-wrap:balance}
  @media (min-width:600px){ .q{font-size:16px;padding:20px} }
  .q1,.q2{background:var(--brand-soft);color:var(--brand-deep)}
  .plus{text-align:center;font-size:30px;font-weight:900;color:var(--brand);line-height:1;margin:10px 0}
  .letter{margin-top:16px;font-family:'Noto Serif KR',serif;font-size:15.5px;line-height:1.9;word-break:keep-all}
  .letter p + p{margin-top:14px}
  .letter .sign{text-align:center;font-weight:700;color:var(--brand);margin-top:18px}

  /* 지도진 */
  .staff{display:flex;flex-direction:column;gap:12px}
  .member{overflow:hidden;padding:0}
  .member .photo{width:100%;aspect-ratio:6/5;object-fit:cover;object-position:center 20%;display:block;background:#E9E2DB}
  .member .body{padding:18px 20px 20px}
  .member .who{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .member .role{font-size:13px;font-weight:700;color:#fff;background:var(--brand);padding:2px 10px;border-radius:999px}
  .member .name{font-size:19px;font-weight:900}
  .member ul{list-style:none;font-size:14.5px;color:#3A3533}
  .member li{position:relative;padding-left:14px;word-break:keep-all}
  .member li + li{margin-top:4px}
  .member li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .member.lead-member{border-color:var(--brand)}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}

  /* 교육 내용 */
  .areas{display:flex;flex-direction:column;gap:10px}
  .area{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .area h4{font-size:16px;font-weight:900;margin-bottom:10px;color:var(--brand)}
  .chips{font-size:15px;color:#3A3533;line-height:1.7;word-break:keep-all}
  .goals{margin-top:14px}
  .goal{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
  .goal:last-child{border-bottom:0}
  .goal b{display:block;font-size:15.5px;word-break:keep-all}
  .goal span{display:block;font-size:14px;color:var(--muted);margin-top:2px;word-break:keep-all}
  .cu-sec{margin-bottom:28px}
  .cu-sec h4{font-size:17px;font-weight:900;padding-bottom:8px;border-bottom:2px solid var(--ink)}
  .cu-purp{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
  .cu-purp span{padding:14px 4px;text-align:center;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);word-break:keep-all}
  .cu-purp span:nth-child(odd){border-right:1px solid var(--line)}
  .cu-purp span:nth-last-child(-n+2){border-bottom:0}
  .cu-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;word-break:keep-all}
  .cu-row b{flex:none;width:112px;color:var(--brand)}
  .cu-row span{color:#3A3533}
  .ld{margin-top:36px}
  .ld h4{font-size:18px;font-weight:900;padding-bottom:8px;border-bottom:2px solid var(--ink)}
  .ld .ld-lead{font-size:15px;line-height:1.75;padding:14px 0;border-bottom:1px solid var(--line);word-break:keep-all}
  .ld .cu-row b{width:60px}
  .ld .cu-row ul{list-style:none}
  .ld .cu-row li{line-height:1.7}
  .ld .cu-row li + li{margin-top:6px}
  .cu-close strong{color:var(--brand);font-weight:900;font-size:17.5px}
  .cu-close{margin:28px 4px 8px;font-size:16px;line-height:1.85;font-weight:500;text-align:center;white-space:pre-line;word-break:keep-all;color:var(--ink)}
  .closing{margin-top:14px;font-size:15px;line-height:1.75;word-break:keep-all;background:var(--brand-soft);border-radius:10px;padding:16px 18px;color:#5A1A1D}

  /* 프로그램 */
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;font:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
  .common{font-size:13.5px;color:var(--muted);margin:0 2px 10px}
  .common b{color:var(--ink)}
  .days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px 12px;text-align:center;min-width:0}
  .day .d{font-family:'Noto Serif KR',serif;font-weight:900;font-size:17px;color:var(--brand);margin-bottom:6px}
  .day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
  .day p{font-size:12px;line-height:1.45;word-break:keep-all;color:#3A3533}
  .day p + p{margin-top:4px}
  .day p.sub{color:var(--muted);font-size:11px}
  .extra{padding:14px 18px 16px;border-top:1px solid var(--line)}
  .extra b{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .extra p{font-size:15px;line-height:1.7;word-break:keep-all}
  .divwrap{display:block}
  .vtabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}
  .vtabs button{flex:1;font:inherit;font-size:15px;font-weight:700;padding:12px 4px 11px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;color:var(--muted);cursor:pointer;word-break:keep-all}
  .vtabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
  #divBox{min-width:0;overflow:hidden;padding:0 2px}
  .dv h4{font-size:19px;font-weight:900;padding-bottom:8px;border-bottom:2px solid var(--ink)}
  .dv .every{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:#3A3533;word-break:keep-all}
  .dv .every b{flex:none;width:28px;color:var(--muted);font-weight:700}
  .wcols{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
  .wc{padding:12px 3px 14px;text-align:center;min-width:0}
  .wc + .wc{border-left:1px solid var(--line)}
  .wc b{display:block;font-family:'Noto Serif KR',serif;font-weight:900;font-size:17px;color:var(--brand);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .wc p{font-size:13.5px;line-height:1.45;word-break:keep-all;color:#3A3533}
  .wc p + p{margin-top:6px}
  .wc small{display:block;margin-top:6px;font-size:11.5px;line-height:1.35;color:var(--muted);word-break:keep-all}
  .wc.today{background:var(--brand-soft)}
  .dv table{width:100%;border-collapse:collapse}
  .dv td{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top;word-break:keep-all}
  .dv td:first-child{width:40px;color:var(--brand);font-family:'Noto Serif KR',serif;font-weight:900}
  .dv td small{display:block;font-size:13px;color:var(--muted)}
  .dv tr.today td{font-weight:700}
  .dv tr.today td:first-child{text-decoration:underline;text-underline-offset:4px}
  .dv .extra3{margin-top:18px;border-top:1px solid var(--line)}
  .dv .extra3 span{font-size:14.5px;padding:12px 4px}
  .dv .every2{padding:12px 0;border-bottom:1px solid var(--line);text-align:center;font-size:14.5px;color:#3A3533;word-break:keep-all}
  .dv .extra2{margin-top:18px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;row-gap:4px;font-size:14.5px;font-weight:700;line-height:1.6;word-break:keep-all;text-align:center}
  .dv .extra2 span{white-space:nowrap}
  .dv .extra2 i{font-style:normal;color:var(--brand);margin:0 6px}
  .slide-up{animation:slUp .38s ease}
  .slide-down{animation:slDown .38s ease}
  @keyframes slUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
  @keyframes slDown{from{opacity:0;transform:translateY(-36px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .slide-up,.slide-down{animation:none} }
  .extra p span{white-space:nowrap}
  .divtime{font-size:14.5px;font-weight:700;padding:12px 14px 0}
  .divtime span{color:var(--brand)}
  .tt td small{display:block;font-size:13px;color:var(--muted)}
  .mapimg{display:block;width:100%;height:auto;background:#EEE9E3}
  .tt{padding:0;overflow:hidden}
  .tt h4{font-size:15px;font-weight:900;padding:14px 18px;background:#F6EFD9;color:#5B4612}
  .tt table{width:100%;border-collapse:collapse;font-size:14.5px}
  .tt td{padding:11px 18px;border-top:1px solid var(--line);vertical-align:top;word-break:keep-all}
  .tt td:first-child{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;width:1%}
  .tt td:last-child{color:#3A3533}
  .tt + .tt{margin-top:14px}
  .wk td:first-child{color:var(--brand);font-family:'Noto Serif KR',serif;font-weight:900}
  .wk tr.today td{background:var(--brand-soft)}

  /* 일정 (달력) */
  .cal{padding:16px 14px 14px}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-top b{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:900}
  .cal-top button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  .cal-top button svg{width:18px;height:18px}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .dow{font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
  .dow:first-child,.cell.sun .n{color:#C23A3A}
  .dow:last-child,.cell.sat .n{color:#2F5FA8}
  .grid7 .cell.off .n{color:#C23A3A}
  .cell{position:relative;border:0;background:none;font:inherit;border-radius:10px;padding:5px 0 9px;min-height:46px;cursor:pointer;color:var(--ink)}
  .cell.out{visibility:hidden}
  .cell .n{font-size:14px;font-weight:500;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%}
  .cell.today .n{background:var(--ink);color:#fff!important;font-weight:900}
  .cell.sel{background:var(--brand-soft)}
  .cell .dots{position:absolute;left:0;right:0;bottom:5px;display:flex;justify-content:center;gap:3px}
  .cell .dots i{width:6px;height:6px;border-radius:50%}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:10px 4px 0;font-size:12px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:8px;height:8px;border-radius:50%}
  .evlist{margin-top:12px}
  .evlist h4{font-size:14px;font-weight:700;color:var(--muted);margin:0 4px 8px}
  .ev{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .ev + .ev{margin-top:8px}
  .ev .when{flex:none;width:46px;text-align:center;line-height:1.15}
  .ev .when b{display:block;font-size:20px;font-weight:900}
  .ev .when span{font-size:11.5px;color:var(--muted)}
  .ev .what{flex:1;min-width:0;border-left:3px solid var(--brand);padding-left:12px}
  .ev .what b{display:block;font-size:15px;word-break:keep-all}
  .ev .what span{font-size:13px;color:var(--muted);word-break:keep-all}
  .tag,.ev .what .tag,.up li .t .tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px;line-height:1.5}

  /* FAQ */
  .faq details[hidden]{display:none}
  .faqtool{margin-bottom:14px}
  .fsearch{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:0 16px;height:50px}
  .fsearch:focus-within{border-color:var(--brand)}
  .fsearch svg{width:20px;height:20px;flex:none;color:var(--muted)}
  .fsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:inherit}
  .fcats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .fcats::-webkit-scrollbar{display:none}
  .fcats button{flex:none;border:1.5px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .fcats button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .fempty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14.5px;word-break:keep-all}
  .faq details{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .faq details + details{margin-top:10px}
  .faq summary{list-style:none;cursor:pointer;padding:18px 20px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
  .faq summary::-webkit-details-marker{display:none}

const EV_COLORS = { '수련':'#3C8D5A', '기네스':'#B8860B', '심사':'#A40F16', '대회':'#1F3B63', '행사':'#D9822B', '휴관':'#8A837E', '기타':'#2E9C9A' };
const DAYS = ['월','화','수','목','금'];
const WEEK = ['일','월','화','수','목','금','토'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (name, sw=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.link}</svg>`;
// 카카오톡·인스타·블로그·유튜브는 실제 로고 그림으로
const LOGOS = { kakao:'img/sns/kakao.png', insta:'img/sns/insta.png', blog:'img/sns/blog.png?v=3', youtube:'img/sns/youtube.png', calendar:'img/sns/naver-booking.png?v=1' };
const ico = name => LOGOS[name] ? `<img class="logo-ic lg-${name}" src="${LOGOS[name]}" alt="">` : svg(name);
const arrow = '<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const list = a => (a || []).filter(Boolean);

// 날짜 (한국 시간 기준 오늘)
const pad = n => String(n).padStart(2, '0');
const ymd = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const TODAY = (() => { const n = new Date(); const k = new Date(n.getTime() + (n.getTimezoneOffset() + 540) * 60000); return new Date(k.getFullYear(), k.getMonth(), k.getDate()); })();
const dayDiff = (a, b) => Math.round((a - b) / 86400000);
const krDate = dt => `${dt.getMonth()+1}월 ${dt.getDate()}일 ${WEEK[dt.getDay()]}요일`;

let D, EVENTS = [], S = {}, GROUPS = [];
const sec = (id, title, inner) => `<section class="sec" id="sec-${id}" data-id="${id}" hidden>${title ? `<h3 class="st">${esc(title)}</h3>` : ''}${inner}</section>`;

function render(d){
  D = d; S = {};
  EVENTS = list(d.schedule).filter(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date)).map(e => {
    const s = parseD(e.date); let en = e.end && /^\d{4}-\d{2}-\d{2}$/.test(e.end) ? parseD(e.end) : s;
    if(en < s) en = s;
    return {...e, s, en};
  });
  EVENTS = EVENTS.concat(guinnessEvents(d, EVENTS)).sort((a, b) => a.s - b.s);

  const brand = esc(d.footerSub || '해랑경희 태권도장');
  const tel0 = ((d.contact || {}).phone || '').replace(/[^0-9+]/g, '');
  const intro = list(d.intro).map(p => `<p>${esc(p).split(brand).join(`<strong>${brand}</strong>`)}</p>`).join('');

  const ph = d.philosophy || {};
  if(list(ph.questions).length || list(ph.message).length) S.philosophy = {label:'교육 철학', icon:'bulb', html: sec('philosophy', ph.title || '교육 철학', `
      ${list(ph.questions).map((q,i) => (i ? '<div class="plus">+</div>' : '') + `<div class="q ${i % 2 ? 'q2' : 'q1'}">${esc(q)}</div>`).join('')}
      ${list(ph.message).length ? `<div class="card letter">${list(ph.message).map(p => `<p>${esc(p)}</p>`).join('')}<p class="sign">감사합니다.</p></div>` : ''}`)};


  const st = d.staff || {};
  if(list(st.members).length) S.staff = {label:'지도진 소개', short:'지도진', icon:'user', html: sec('staff', st.title || '지도진 소개', `
      ${st.lead ? `<p class="lead">${esc(st.lead)}</p>` : ''}
      <div class="staff">${list(st.members).map((m,i) => `
        <div class="card member${i === 0 ? ' lead-member' : ''}">
          ${m.photo ? `<img class="photo" src="${esc(m.photo)}" alt="${esc(m.name)} ${esc(m.role)}" loading="lazy">` : ''}
          <div class="body">
            <div class="who"><span class="role">${esc(m.role)}</span><span class="name">${esc(m.name)}</span></div>
            <ul>${list(m.career).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
          </div>
        </div>`).join('')}
      </div>
      ${st.note ? `<p class="note">${esc(st.note)}</p>` : ''}`)};

  const cu = d.curriculum || {};
  if(list(cu.areas).length || list(cu.goals).length) S.curriculum = {label:'교육 내용', icon:'book', html: sec('curriculum', cu.title || '교육 내용', `
      ${list(cu.purposes).length ? `<div class="cu-purp2">${list(cu.purposes).map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
      ${(() => {
        const norm = t => String(t || '').replace(/\s/g, '');
        const areas = list(cu.areas).map(a => ({...a, gs: []}));
        const rest = [];
        list(cu.goals).forEach(g => {
          const words = (norm(g.title) + ',' + norm(g.desc)).split(/[,·와과]/).filter(w => w.length > 1);
          const a = areas.find(a => list(a.items).some(it => words.some(w => norm(it).includes(w) || w.includes(norm(it)))));
          (a ? a.gs : rest).push(g);
        });
        return `<div class="cu-areas">${areas.map((a, i) => `<div class="cu-area"><span class="n">${pad2(i + 1)}</span><h4>${esc(a.name)}</h4>
          <p class="learn">${list(a.items).map(esc).join(' · ')}</p>
          ${a.gs.length ? `<ul class="grow">${a.gs.map(g => `<li><b>${esc(g.title)}</b>${g.desc ? `<span>${esc(g.desc)}</span>` : ''}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div>
          ${rest.length ? `<ul class="grow">${rest.map(g => `<li><b>${esc(g.title)}</b><span>${esc(g.desc || '')}</span></li>`).join('')}</ul>` : ''}`;
      })()}
      ${cu.closing ? `<p class="cu-close">${esc(cu.closing).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}</p>` : ''}`)};

  // ---------- 인성 · 성장 ----------
  const L = d.leaders || {};
  if(list(L.groups).length) S.leaders = {label: '선범단', icon:'star', html: sec('leaders', '', `
      <div class="ld"><h4>${esc(L.title || '선범단')}</h4>${L.lead ? `<p class="ld-lead">${esc(L.lead)}</p>` : ''}${list(L.groups).map(g => `<div class="cu-row"><b>${esc(g.t)}</b><ul>${list(g.items).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}${L.closing ? `<p class="cu-close">${esc(L.closing)}</p>` : ''}</div>`)};
  const ch = d.character || {};
  if(ch.title || list(ch.blocks).length) S.character = {label:'인성 교육', icon:'heart', html: sec('character', ch.title || '인성 교육', `
      ${ch.lead ? `<p class="lead">${esc(ch.lead)}</p>` : ''}
      ${list(ch.blocks).map(b => `<div class="cu-row"><b>${esc(b.t)}</b><span>${esc(b.d)}</span></div>`).join('')}`)};
  const bt = d.belts || {};
  if(list(bt.kup && bt.kup.belts).length || list(bt.dan).length) S.belts = {label:'띠 제도', icon:'award', html: sec('belts', bt.title || '띠 제도', beltsPage(bt))};
  const gr = d.growth || {}, gu = d.guinness || {};
  if(gr.title || list(gr.factors).length) S.growth = {label:'분기별 성장 측정', short:'성장 측정', icon:'chart', html: sec('growth', gr.title || '분기별 성장 측정지', `
      ${gr.lead ? `<p class="lead">${esc(gr.lead)}</p>` : ''}
      ${gu.items ? `<div class="cu-sec"><h4>해랑 기네스 · 분기별 종목</h4>${[['1~3월','1'],['4~6월','2'],['7~9월','3'],['10~12월','4']].filter(([, k]) => gu.items[k]).map(([m, k]) => `<div class="cu-row"><b>${m}</b><span>${esc(gu.items[k])}</span></div>`).join('')}</div>` : ''}
      ${list(gr.factors).length ? `<div class="cu-sec"><h4>${esc(gr.factorsTitle || '함께 살펴보는 성장 요소')}</h4><div class="cu-purp2 five">${list(gr.factors).map(x => `<span>${esc(x)}</span>`).join('')}</div></div>` : ''}
      ${gr.closing ? `<p class="cu-close">${esc(gr.closing)}</p>` : ''}`)};

  const pr = d.program || {};
  if(list(pr.divisions).length || list(pr.timetable).length) S.program = {label:'수업 · 시간표', short:'수업·시간표', icon:'clock', html: sec('program', '', `
      ${list(pr.timetable).length ? `<div class="card tt"><h4>전체 시간표 · 월 ~ 금</h4><table>${list(pr.timetable).map(r => `<tr><td>${esc(r.time)}</td><td>${esc(r.who)}</td></tr>`).join('')}</table></div>` : ''}
      ${list(pr.divisions).length ? `<h3 class="st" style="margin:30px 2px 12px">부서별 요일 수업</h3><div class="divwrap"><div class="vtabs" role="tablist">${list(pr.divisions).map((v,i) => `<button type="button" role="tab" data-div="${i}" class="${i ? '' : 'on'}">${esc(v.name)}</button>`).join('')}</div>
      <div id="divBox"></div></div>` : ''}`)};

  const fe = d.fee || {};
  if(list(fe.plans).length || fe.shuttle) S.fee = {label:'회비 · 차량 안내', short:'회비·차량', icon:'won', html: sec('fee', fe.title || '회비 · 차량 안내', `
      ${list(fe.plans).length ? `<div class="card fee"><h4>월 회비</h4>${list(fe.plans).map(p => `
        <div class="plan"><div><b>${esc(p.name)}</b>${p.who ? `<span>${esc(p.who)}</span>` : ''}</div><strong>${esc(p.price)}</strong></div>`).join('')}
        ${list(fe.notes).length ? `<ul class="fnotes">${list(fe.notes).map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</div>` : ''}
      ${list(fe.referral).length ? `<div class="card park gift">${svg('gift')}<div><b>${esc(fe.referralTitle || '지인 소개 혜택')}</b><div class="rf">${list(fe.referral).map(t => { const [a, ...b] = String(t).split('|'); return `<div class="rr"><span>${esc(a.trim())}</span><em>${esc(b.join('|').trim())}</em></div>`; }).join('')}</div></div></div>` : ''}
      ${fe.shuttle ? `<div class="shuttle"><b>${esc(fe.shuttle)}</b>${fe.shuttleNote ? `<p>${esc(fe.shuttleNote)}</p>` : ''}</div>` : ''}
      ${tel0 ? `<a class="btn-call" href="tel:${esc(tel0)}">${svg('phone')}회비·차량 전화로 문의하기</a>` : ''}`)};

  if(list(d.faq).length){
    const fq = list(d.faq);
    const cats = [...new Set(fq.map(f => f.cat || '기타'))];
    S.faq = {label:'자주 묻는 질문', short:'FAQ', icon:'help', html: sec('faq', '자주 묻는 질문', `
      <div class="faqtool">
        <label class="fsearch">${svg('search',2.4)}<input id="faqQ" type="search" placeholder="궁금한 내용 검색 (예: 회비, 주차)" autocomplete="off"></label>
        ${cats.length > 1 ? `<div class="fcats" id="faqCats"><button type="button" class="on" data-c="">전체</button>${cats.map(c => `<button type="button" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="faq" id="faqList">${fq.map((f,i) => `
        <details data-c="${esc(f.cat || '기타')}" data-t="${esc([f.q, ...list(f.a), ...list(f.points).map(p => p.t + ' ' + (p.d || '')), f.closing || '', f.cat || ''].join(' ').toLowerCase())}"${i === 0 ? ' open' : ''}><summary>${esc(f.q)}</summary><div class="ans">
          ${list(f.a).map(t => `<p class="fa">${esc(t)}</p>`).join('')}
          ${list(f.points).map(p => `<div class="pt"><span class="ck">${svg('check',3)}</span><div><b>${esc(p.t)}</b>${p.d ? `<span>${esc(p.d)}</span>` : ''}</div></div>`).join('')}
          ${f.closing ? `<p class="closing">${esc(f.closing)}</p>` : ''}
        </div></details>`).join('')}</div>
      <p class="fempty" id="faqEmpty" hidden>찾는 질문이 없어요. 아래 상담 문의로 편하게 물어봐 주세요.</p>`)};
  }

  S.today = {label:'오늘의 운동', icon:'run', html: sec('today', '', `${workoutCard(d, false)}${focusTable(d)}`)};
  S.schedule = {label:'도장 일정', short:'일정', icon:'calendar', html: sec('schedule', '해랑경희 일정', `
      <div class="card cal" id="cal"></div>
      <div class="legend">${Object.entries(EV_COLORS).filter(([k]) => EVENTS.some(e => (EV_COLORS[e.type] ? e.type : '기타') === k)).map(([k,c]) => `<span><i style="background:${c}"></i>${k}</span>`).join('')}</div>
      <div class="evlist" id="evlist"></div>`)};
  S.notice = {label:'알림판·공지', short:'알림판', icon:'megaphone', html: sec('notice', '', noticePage(d))};
  S.press = {label:'보도자료', icon:'news', html: sec('press', '보도자료', pressPage(d))};
  if(list(d.gallery).length) S.gallery = {label:'사진', icon:'photo', html: sec('gallery', d.galleryTitle || '사진으로 보는 해랑경희', gallery(d))};

  const ct = d.contact || {};
  const tel = (ct.phone || '').replace(/[^0-9+]/g, '');
  S.contact = {label:'상담 문의', icon:'phone', html: sec('contact', ct.title || '상담 및 문의하기', `
      ${tel ? `<a class="callbig" href="tel:${esc(tel)}">${svg('phone')}<span>${esc(ct.phone)}<small>눌러서 바로 전화 상담</small></span></a>` : ''}
      <nav class="links">${list(d.links).map(l => `
        <a class="link${l.main ? ' main' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener">
          <span class="ic${LOGOS[l.icon] ? ' has-logo' : ''}">${ico(l.icon)}</span>
          <span class="text"><span class="name">${esc(l.name)}</span>${l.desc ? `<span class="desc">${esc(l.desc)}</span>` : ''}</span>
          ${arrow}
        </a>`).join('')}</nav>`)};

  const lo = d.location || {};
  if(lo.address){
    const q = encodeURIComponent((lo.address || '').replace(/\s*\d+층.*$/, '') + ' ' + (lo.name || ''));
    const hrs = lo.hours || {};
    const order = ['월','화','수','목','금','토','일'];
    const todayW = WEEK[TODAY.getDay()];
    // 지금 운영 중인지 (한국 시간 기준)
    const nowK = (() => { const n = new Date(); return new Date(n.getTime() + (n.getTimezoneOffset() + 540) * 60000); })();
    const tm = /(\d{1,2}):(\d{2})\s*[-~]\s*(\d{1,2}):(\d{2})/.exec(hrs[todayW] || '');
    const mins = nowK.getHours() * 60 + nowK.getMinutes();
    const offToday = eventsOn(TODAY).some(e => e.type === '휴관');
    const openNow = !offToday && tm && mins >= (+tm[1]) * 60 + (+tm[2]) && mins < (+tm[3]) * 60 + (+tm[4]);
    S.location = {label: lo.title || '오시는 길', short:'오시는 길', icon:'map', html: sec('location', lo.title || '오시는 길', `

// 화면에 보일 때만 영상 재생 (데이터 절약), 스크롤하면 나타남
function setupVideos(){
  const vids = [...document.querySelectorAll('video[data-src]')];
  const rvs = [...document.querySelectorAll('.rv')];
  if(!('IntersectionObserver' in window)){ vids.forEach(v => { v.src = v.dataset.src; v.play().catch(()=>{}); }); rvs.forEach(x => x.classList.add('in')); return; }
  const vo = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if(e.isIntersecting){ if(!v.src) v.src = v.dataset.src; v.play().catch(()=>{}); } else v.pause();
  }), {threshold:.25});
  vids.forEach(v => vo.observe(v));
  const ro = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); ro.unobserve(e.target); } }), {threshold:.12});
  rvs.forEach(x => ro.observe(x));
}

// ---------- 첫 화면 사진 ----------
function setupHero(){
  const box = document.getElementById('hphoto'); if(!box) return;
  const imgs = box.querySelectorAll('img'), dots = box.querySelectorAll('.dots i');
  if(imgs.length < 2) return;
  let i = 0;
  const show = n => { i = (n + imgs.length) % imgs.length; imgs.forEach((im, k) => im.classList.toggle('on', k === i)); dots.forEach((d, k) => d.classList.toggle('on', k === i)); };
  let tm = setInterval(() => show(i + 1), 4000);
  let x0 = null;
  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  box.addEventListener('touchend', e => { if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 40){ show(i + (dx < 0 ? 1 : -1)); clearInterval(tm); tm = setInterval(() => show(i + 1), 4000); } });
}

function setupFaq(){
  const q = document.getElementById('faqQ'); if(!q) return;
  const cats = document.getElementById('faqCats');
  const items = [...document.querySelectorAll('#faqList details')];
  let cat = '';
  const run = () => {
    const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let n = 0;
    items.forEach(el => {
      const ok = (!cat || el.dataset.c === cat) && words.every(w => el.dataset.t.includes(w));
      el.hidden = !ok; if(ok) n++;
      if(words.length) el.open = ok;
    });
    document.getElementById('faqEmpty').hidden = n > 0;
  };
  q.addEventListener('input', run);
  if(cats) cats.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    cat = b.dataset.c;
    cats.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    run();
  });
}

// ---------- 오늘의 운동 ----------
function monthPlan(d){
  const ms = list((d.monthly || {}).months).filter(m => m.month).sort((a, b) => a.month.localeCompare(b.month));
  const cur = ymd(TODAY).slice(0, 7);
  return { exact: ms.find(m => m.month === cur), plan: ms.find(m => m.month === cur) || ms.filter(m => m.month < cur).pop() || ms[ms.length - 1] };
}
// 요일별 운동테마는 매달 같음 (예전 형식처럼 달마다 들어 있으면 그것도 읽음)
function weekdayThemes(d){
  const w = (d.monthly || {}).weekday;
  if(w && Object.values(w).some(v => list(v).length)) return w;
  const { plan } = monthPlan(d);
  return (plan && plan.weekday) || {};
}
const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
function focusList(d){
  return list((d.monthly || {}).focus).filter(f => isDate(f.date) && f.title).map(f => {
    const s = parseD(f.date); let en = isDate(f.end) ? parseD(f.end) : s; if(en < s) en = s;
    return {...f, s, en};
  }).sort((a, b) => a.s - b.s);
}
function workoutCard(d, onHome){
  const mo = d.monthly || {};
  const dow = TODAY.getDay(), weekend = dow === 0 || dow === 6;
  const evs = eventsOn(TODAY);
  const off = evs.filter(e => e.type === '휴관');
  let fs = focusList(d).filter(f => f.s <= TODAY && TODAY <= f.en);
  // 같은 이름의 일정(예: 해랑경희 기네스 · 스피드 발차기)이 있으면 그 이름으로 한 번만 보여줌
  const dup = e => fs.some(f => (e.title || '').includes(f.title) || f.title.includes(e.title || '-'));
  fs = fs.map(f => { const e = evs.find(x => x.type !== '휴관' && ((x.title || '').includes(f.title) || f.title.includes(x.title || '-'))); return e ? {...f, title: e.title.length > f.title.length ? e.title : f.title} : f; });
  const items = list(weekdayThemes(d)[WEEK[dow]]);
  const evRows = evs.filter(e => e.type !== '휴관' && !dup(e)).map(e => {
    const c = EV_COLORS[e.type] || EV_COLORS['기타'];
    return `<div class="focus"><span class="tag" style="background:${c}">${esc(e.type || '일정')}</span><b>${esc(e.title)}</b>${e.note ? `<span>${esc(e.note)}</span>` : ''}</div>`;
  }).join('');
  let body, rest = false;

  else body = `

      ${evRows ? `<div class="focusbox">${evRows}</div>` : ''}
      ${items.length ? `<div class="flabel" style="margin-top:6px">${WEEK[dow]}요일 수업</div><ol>${items.map(i => `<li><b>${esc(i)}</b></li>`).join('')}</ol>` : ''}
      ${!fs.length && !evRows && !items.length ? `<div class="theme">오늘은 정해진 운동이 없어요</div>` : ''}`;
  if(off.length) rest = true;
  return `<div class="card hc wo${rest ? ' rest' : ''}">
    <div class="hc-head"><span class="ic">${svg('run')}</span><h2>${esc(mo.title || '오늘의 운동')}<small>${krDate(TODAY)}</small></h2>${onHome ? `<a class="more" href="#/today">이달 수련 계획 ›</a>` : ''}</div>

// 몇째 주 (그 주 월요일 기준)
function weekLabel(dt){
  const mon = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - ((dt.getDay() + 6) % 7));
  const base = mon.getMonth() === dt.getMonth() ? mon : dt;
  const n = Math.ceil(base.getDate() / 7);
  return `${dt.getMonth() + 1}월 ${['첫째','둘째','셋째','넷째','다섯째'][n - 1] || n + '번째'} 주`;
}
function focusTable(d){
  const y = TODAY.getFullYear(), m = TODAY.getMonth();
  const ms = new Date(y, m, 1), me = new Date(y, m + 1, 0);
  const rows = focusList(d).filter(f => f.s <= me && f.en >= ms);
  if(!rows.length) return '';
  return `<div class="card tt fo" style="margin-top:14px"><h4>${m + 1}월 수련 계획</h4><table>
    ${rows.map(f => `<tr class="${f.s <= TODAY && TODAY <= f.en ? 'now' : (f.en < TODAY ? 'past' : '')}"><td>${+f.s === +f.en ? rangeText(f) : `${weekLabel(f.s)}<small class="wd">${rangeText(f)}</small>`}</td><td>${esc(f.title)}</td></tr>`).join('')}</table></div>`;
}
function weekTable(d){
  const wd = weekdayThemes(d);
  const rows = ['월','화','수','목','금','토'].map(w => [w, list(wd[w])]).filter(([, v]) => v.length);
  if(!rows.length) return '';

// 분기별 종목: 1~3월(1) · 4~6월(2) · 7~9월(3) · 10~12월(4)
function guinnessEvents(d, manual){
  const g = d.guinness || {};
  if(!g.on) return [];
  const [sy, sm] = /^\d{4}-\d{2}$/.test(g.start || '') ? g.start.split('-').map(Number) : [TODAY.getFullYear(), TODAY.getMonth() + 1];
  const out = [];
  for(let k = -12; k <= 12; k++){
    const first = new Date(TODAY.getFullYear(), TODAY.getMonth() + k, 1);
    const y = first.getFullYear(), m = first.getMonth() + 1;
    if(y * 12 + m < sy * 12 + sm) continue;
    const fri = new Date(y, m - 1, 1 + ((5 - first.getDay() + 7) % 7));
    if(manual.some(e => e.s <= fri && fri <= e.en && (e.type === '기네스' || (e.title || '').includes('기네스')))) continue;   // 직접 넣은 기네스 일정이 있으면 그걸 사용
    if(manual.some(e => e.type === '휴관' && e.s <= fri && fri <= e.en)) continue;                     // 휴관일이면 건너뜀
    const item = (g.items || {})[String(Math.floor((m - 1) / 3) + 1)];
    out.push({ title: item || g.title || '해랑경희 기네스', type: '기네스', note: g.note || '', image: '', s: fri, en: fri, auto: true });
  }
  return out;
}

function setupCalendar(){

  const draw = () => {

    let cells = '';
    for(let i = 0; i < lead; i++) cells += '<span class="cell out"></span>';

      const dt = new Date(y, m, dd), evs = eventsOn(dt);
      const cls = ['cell', dt.getDay() === 0 ? 'sun' : '', dt.getDay() === 6 ? 'sat' : '', evs.some(e => e.type === '휴관') ? 'off' : '', +dt === +TODAY ? 'today' : '', sel && +dt === +sel ? 'sel' : ''].join(' ');

    }

      <div class="grid7">${WEEK.map(w => `<span class="dow">${w}</span>`).join('')}${cells}</div>`;
    cal.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { m += +b.dataset.mv; if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; } sel = null; draw(); });
    cal.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const dt = new Date(y, m, +b.dataset.d); sel = sel && +sel === +dt ? null : dt; draw(); });
    let evs, title;
    if(sel){ evs = eventsOn(sel); title = krDate(sel); }
    else{ const s = new Date(y, m, 1), e = new Date(y, m+1, 0); evs = EVENTS.filter(x => x.s <= e && x.en >= s); title = `${m+1}월 일정`; }
    box.innerHTML = `<h4>${title}</h4>` + (evs.length ? evs.map(e => `

      <div class="dv ${dir}"><h4>${esc(v.name)}</h4>
      <div class="wcols whead">${DAYS.map(dd => `<div class="wc${dd === today ? ' today' : ''}"><b>${dd}</b></div>`).join('')}</div>
      ${v.common ? `<p class="every2"><span>매일</span>${esc(v.common)}</p>` : ''}
      <div class="wcols wbody">${DAYS.map(dd => `<div class="wc${dd === today ? ' today' : ''}">${list(days[dd]).map(x => /^\(.*\)$/.test(x) ? `<small>${esc(x.slice(1, -1))}</small>` : `<p>${esc(x)}</p>`).join('')}</div>`).join('')}</div>
      ${list(v.extra).length ? `<div class="cu-purp extra3">${list(v.extra).map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}</div>`;
  };
  document.querySelectorAll('.vtabs button').forEach(b => b.onclick = () => show(+b.dataset.div));
  show(0);
}

// ---------- 사진 ----------
function gallery(d){
  const pics = list(d.gallery);
  if(!pics.length) return '';
  return `<div class="pstack" aria-label="사진 넘겨보기">
      ${pics.map((p, i) => `<figure class="pc${i === 0 ? ' p0' : i === 1 ? ' p1' : i === 2 ? ' p2' : ''}"><img src="${esc(p)}" alt="수업 사진" ${i > 3 ? 'loading="lazy"' : ''} decoding="async"><figcaption>HAERANG <b>${pad2(i + 1)}</b> / ${pad2(pics.length)}</figcaption></figure>`).join('')}
    </div>
    <p class="ps-hint">옆으로 넘기거나 눌러서 크게 보세요</p>
    <div class="photogrid">${pics.map(p => `<img src="${esc(p)}" alt="수업 사진" loading="lazy">`).join('')}</div>`;
}
function setupStack(){
  const st = document.querySelector('.pstack');
  if(!st) return;
  const cs = [...st.querySelectorAll('.pc')];
  if(cs.length < 2) return;
  let i = 0, t, hold = false;
  const paint = () => cs.forEach((c, k) => {
    const r = (k - i + cs.length) % cs.length;
    c.classList.toggle('p0', r === 0); c.classList.toggle('p1', r === 1); c.classList.toggle('p2', r === 2);
    if(r === 3) c.querySelector('img').loading = 'eager';
  });
  const go = dir => {
    const f = cs[i]; f.classList.add(dir < 0 ? 'outr' : 'out');
    i = (i + (dir < 0 ? -1 : 1) + cs.length) % cs.length;
    paint(); setTimeout(() => f.classList.remove('out', 'outr'), 650);
  };
  const loop = () => { clearInterval(t); t = setInterval(() => { if(!hold && st.isConnected && st.offsetParent) go(1); }, 3800); };
  let x0 = null;
  st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; hold = true; }, {passive:true});
  st.addEventListener('touchend', e => { hold = false; if(x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 40){ go(dx < 0 ? 1 : -1); loop(); e.preventDefault(); } }, {passive:false});
  st.addEventListener('mouseenter', () => hold = true); st.addEventListener('mouseleave', () => hold = false);
  st.pause = v => hold = v;
  loop();
}
function setupGallery(){
  const lb = document.createElement('div');
  lb.className = 'lightbox'; lb.innerHTML = '<img alt="">';
  document.body.append(lb);
  const m = document.querySelector('.marquee');
  document.getElementById('app').addEventListener('click', e => {
    const img = e.target.closest('.pstack .p0 img, .photogrid img, img[data-zoom]');
    if(!img) return;
    lb.querySelector('img').src = img.src;
    lb.classList.add('on'); const ps = document.querySelector('.pstack'); if(ps && ps.pause) ps.pause(true);
  });
  lb.addEventListener('click', () => { lb.classList.remove('on'); const ps = document.querySelector('.pstack'); if(ps && ps.pause) ps.pause(false); });
}
// 홈의 사진·알림판 슬라이드 (4초마다 넘어감, ‖ 로 멈춤)
function setupSliders(){
  document.querySelectorAll('.slider').forEach(box => {
    const sl = [...box.querySelectorAll('.sl')], cur = box.querySelector('[data-cur]'), pp = box.querySelector('[data-pp]'), capl = box.querySelector('.capline');
    const cap = () => { if(capl && sl[i]){ capl.innerHTML = ''; capl.append(sl[i].dataset.cap || ''); const sm = document.createElement('small'); sm.textContent = sl[i].dataset.sub || ''; capl.append(sm); } };
    let i = 0; cap();
    if(sl.length < 2) return;
    let playing = true, t;
    const show = n => { sl[i].classList.remove('on'); i = (n + sl.length) % sl.length; sl[i].classList.add('on'); if(cur) cur.textContent = String(i + 1).padStart(2, '0'); cap(); };
    const loop = () => { clearInterval(t); if(playing) t = setInterval(() => show(i + 1), 4000); };
    const setPP = () => { pp.innerHTML = svg(playing ? 'pause' : 'play', 2.6); pp.setAttribute('aria-label', playing ? '멈춤' : '재생'); };
    const pv = box.querySelector('[data-prev]'), nx = box.querySelector('[data-next]');
    if(pv) pv.onclick = () => { show(i - 1); loop(); };
    if(nx) nx.onclick = () => { show(i + 1); loop(); };
    pp.onclick = () => { playing = !playing; setPP(); loop(); };
    let x0 = null;
    box.querySelector('.slides').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
    box.querySelector('.slides').addEventListener('touchend', e => { if(x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if(Math.abs(dx) > 40){ show(i + (dx < 0 ? 1 : -1)); loop(); } x0 = null; });
    setPP(); loop();
  });
}

// ---------- 메뉴 ----------
function setupMenu(){
  const dr = document.getElementById('drawer'), btn = document.getElementById('menuBtn');
  const open = on => {
    dr.classList.toggle('on', on); document.body.classList.toggle('lock', on);
    dr.setAttribute('aria-hidden', on ? 'false' : 'true'); btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  };
  btn.onclick = () => open(true);
  dr.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => open(false)));
  document.addEventListener('keydown', e => { if(e.key === 'Escape') open(false); });
}
function setupTop(){
  const top = document.getElementById('totop');
  top.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
  const f = () => top.classList.toggle('on', window.scrollY > 700);
  window.addEventListener('scroll', f, {passive:true}); f();
}

    document.getElementById('app').classList.add('ready');
  });
