<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해랑경희 태권도장</title>
<meta name="description" content="해랑경희 태권도장의 교육 철학, 지도진, 수련 프로그램과 시간표, 일정과 오늘의 운동을 한눈에 보실 수 있습니다.">
<meta property="og:title" content="해랑경희 태권도장">
<meta property="og:description" content="교육 철학 · 지도진 · 시간표 · 일정 · 오늘의 운동 · 상담 문의">
<meta property="og:type" content="website">
<meta property="og:image" content="https://haerangtkd.github.io/introduce/img/og.jpg">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#A40F16; --brand-deep:#7A0B10; --brand-soft:#FBEDEE;
    --ink:#1C1A19; --muted:#6B6460; --paper:#FBF8F4; --card:#FFFFFF; --line:#ECE5DE;
    --orange:#D9822B; --teal:#2E9C9A; --navy:#1F3B63; --gray:#8A837E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  body.lock{overflow:hidden}
  a{color:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}
  [hidden]{display:none!important}

  /* ---------- 상단: 로고 줄 ---------- */
  .top{background:#fff}
  .top .in{max-width:1080px;margin:0 auto;height:64px;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px}
  .logo{margin-right:auto;display:flex;align-items:center}
  .logo img{height:38px;width:auto;display:block}
  .tel{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--brand);text-decoration:none}
  .tel svg{width:23px;height:23px}
  .allmenu{display:flex;align-items:center;gap:6px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:900;font-size:14px;padding:9px 14px 9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .allmenu svg{width:18px;height:18px}
  .allmenu:active{transform:scale(.96)}

  /* ---------- 상단: 메뉴 바 (스크롤해도 따라옴) ---------- */
  .gnb{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .gnb .in{max-width:1080px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
  .gnb .in::-webkit-scrollbar{display:none}
  .gnb a{flex:1 0 auto;text-align:center;text-decoration:none;font-weight:700;font-size:15px;color:#3A3533;padding:13px 12px 11px;border-bottom:3px solid transparent;white-space:nowrap}
  .gnb a.on{color:var(--brand);border-bottom-color:var(--brand)}
  @media (min-width:900px){
    .top .in{height:78px}
    .logo img{height:46px}
    .gnb .in{justify-content:center;gap:28px}
    .gnb a{flex:0 0 auto;font-size:17px;padding:16px 18px 14px}
  }

  /* 전체메뉴 */
  .drawer{position:fixed;inset:0;z-index:50;visibility:hidden}
  .drawer.on{visibility:visible}
  .drawer .dim{position:absolute;inset:0;background:rgba(20,10,10,.45);opacity:0;transition:opacity .25s}
  .drawer.on .dim{opacity:1}
  .drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(88vw,400px);background:#fff;transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column}
  .drawer.on .panel{transform:none}
  .drawer .phead{height:64px;display:flex;align-items:center;padding:0 8px 0 18px;background:var(--brand);color:#fff}
  .drawer .phead b{font-size:18px;font-weight:900;margin-right:auto;display:flex;align-items:center;gap:8px}
  .drawer .phead b svg{width:20px;height:20px}
  .drawer .x{width:44px;height:44px;border:0;background:none;color:#fff;border-radius:12px;display:grid;place-items:center;cursor:pointer}
  .drawer .x svg{width:24px;height:24px}
  .drawer .pbody{flex:1;overflow-y:auto;padding:6px 18px 20px}
  .drawer .g{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
  .drawer .g:last-child{border-bottom:0}
  .drawer .g h3{font-size:15.5px;font-weight:900;color:var(--brand);padding-top:7px}
  .drawer .g div{display:flex;flex-direction:column}
  .drawer .g a{text-decoration:none;font-size:15.5px;font-weight:500;padding:7px 10px;border-radius:9px}
  .drawer .g a:active,.drawer .g a:hover{background:var(--brand-soft);color:var(--brand)}
  .drawer .pfoot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

  /* ---------- 홈 ---------- */
  .hero{background:var(--brand);color:#fff;padding:46px 16px 84px;text-align:center;position:relative;overflow:hidden}
  .ht{width:min(100%,480px);margin:0 auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
  .ht img{display:block;width:100%;height:auto}
  .ht .ht-slogan{width:99%}
  .hero .wm{position:absolute;right:-50px;bottom:-60px;width:250px;opacity:.09;pointer-events:none}
  .greet{font-size:13px;letter-spacing:.18em;opacity:.85;margin-bottom:12px}
  .hero h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:30px;line-height:1.3}
  .slogan{margin:12px auto 0;max-width:330px;font-size:13.5px;line-height:1.6;opacity:.9;word-break:keep-all}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
  .intro{margin-top:-46px;position:relative;box-shadow:0 6px 24px rgba(60,20,20,.08)}
  .intro p{font-size:15.5px;word-break:keep-all}
  .intro p + p{margin-top:12px}
  .intro strong{color:var(--brand)}
  .home{display:grid;gap:12px;margin-top:14px}
  .hc{padding:0;overflow:hidden}
  .hc-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
  .hc-head .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
  .hc-head .ic svg{width:20px;height:20px}
  .hc-head h2{font-size:16.5px;font-weight:900;line-height:1.3}
  .hc-head h2 small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
  .hc-head .more{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;white-space:nowrap}
  .wo{background:linear-gradient(135deg,#1F3B63,#2B5185);color:#fff;border:0}
  .wo .hc-head .ic{background:rgba(255,255,255,.15);color:#fff}
  .wo .hc-head h2 small{color:rgba(255,255,255,.75)}
  .wo .hc-head .more{color:rgba(255,255,255,.8)}
  .wo .theme{padding:0 18px 4px;font-family:'Noto Serif KR',serif;font-weight:900;font-size:21px;word-break:keep-all}
  .wo .sub{padding:4px 18px 0;font-size:14px;color:rgba(255,255,255,.8)}
  .wo ol{list-style:none;padding:8px 18px 4px;counter-reset:w}
  .wo li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.14);counter-increment:w}
  .wo li::before{content:counter(w);flex:none;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--navy);font-size:12.5px;font-weight:900;display:grid;place-items:center}
  .wo li b{flex:1;font-size:15px;word-break:keep-all}
  .wo .focusbox{padding:2px 18px 6px;display:flex;flex-direction:column;gap:8px}
  .wo .focus{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;line-height:1.45}
  .wo .focus b{font-size:16px;word-break:keep-all}
  .wo .focus > span:last-child:not(.tag){display:block;font-size:12.5px;color:rgba(255,255,255,.75);margin-top:2px}
  .wo .focus .tag{border:1px solid rgba(255,255,255,.4)}
  .wo .pad{height:12px}
  .up .hc-head .ic{background:var(--brand-soft);color:var(--brand)}
  .up ul{list-style:none;padding:0 18px 16px}
  .up li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .dday{flex:none;min-width:54px;text-align:center;font-size:13px;font-weight:900;border-radius:999px;padding:3px 8px;background:var(--brand-soft);color:var(--brand)}
  .dday.now{background:var(--brand);color:#fff}
  .up li .t{flex:1;min-width:0}
  .up li .t b{display:block;font-size:15px;word-break:keep-all}
  .up li .t span{font-size:12.5px;color:var(--muted)}
  .empty{padding:4px 18px 18px;font-size:14px;color:var(--muted)}
  .nt .hc-head .ic{background:#FFF3DC;color:#B7791F}
  .nt ul{list-style:none;padding:0 18px 16px}
  .nt li{position:relative;padding:10px 0 10px 16px;border-top:1px solid var(--line);font-size:14.5px;word-break:keep-all}
  .nt li::before{content:"";position:absolute;left:2px;top:19px;width:6px;height:6px;border-radius:50%;background:#D9822B}
  .label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin:32px 4px 12px}
  .shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sc{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 4px 11px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;text-align:center;word-break:keep-all;line-height:1.3;transition:transform .15s,border-color .15s}
  .sc:active{transform:scale(.95)}
  .sc:hover{border-color:var(--brand)}
  .sc .ic{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
  .sc .ic svg{width:20px;height:20px}
  .shortcuts.three{grid-template-columns:repeat(3,1fr)}
  .sc-call{grid-column:1/-1;flex-direction:row;justify-content:center;background:var(--brand);border-color:var(--brand);color:#fff;font-size:15px;padding:14px}
  .sc-call .ic{width:auto;height:auto;background:none;color:#fff}

  /* 홈: 사진 | 알림판 두 칸 */
  /* 폰: 사진 | 행사 반반 + 알림판 아래 / 넓은 화면: 세 칸 */
  .twin{display:grid;gap:10px;margin-top:12px;grid-template-columns:1fr 1fr}
  .twin .wide{grid-column:1/-1}
  @media (min-width:900px){ .twin{grid-template-columns:1fr 1fr 1fr;gap:12px} .twin .wide{grid-column:auto} }
  .mini{padding:12px 12px 12px}
  .mini .ph{margin-bottom:10px}
  .mini .ph h3{white-space:normal;word-break:keep-all;font-size:14.5px;line-height:1.35}
  .mini .slides{aspect-ratio:1}
  .ctrl{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:8px}
  .ctrl button{flex:none;width:28px;height:30px;border:0;background:none;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .ctrl button:hover{background:#F3EEE9}
  .ctrl svg{width:17px;height:17px}
  .ctrl .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 2px;white-space:nowrap}
  .ctrl .cnt b{color:var(--ink)}
  .capline{margin-top:8px;font-size:13.5px;font-weight:700;line-height:1.4;min-height:2.8em;word-break:keep-all}
  .capline small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  @media (max-width:440px){ .ph [data-prev],.ph [data-next]{display:none} }
  .sl .cap small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
  .sl .cap,.sl .dd{pointer-events:none}
  .sl .dd{position:absolute;top:8px;left:8px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:900;border-radius:999px;padding:2px 8px}
  .sl .dd.past{background:rgba(40,30,30,.6)}
  .ev .thumb{flex:none;width:52px;height:52px;border-radius:10px;object-fit:cover;cursor:zoom-in;background:#F3EEE9}
  .panel{padding:16px 16px 14px;display:flex;flex-direction:column;min-width:0}
  .ph{display:flex;align-items:center;gap:2px;margin-bottom:12px}
  .ph h3{font-size:16px;font-weight:900;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph .cnt{font-size:13px;color:var(--muted);margin-right:2px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
  .ph button,.ph a.plus{flex:none}
  @media (min-width:900px){ #homePage .wrap{max-width:860px} }
  .ph .cnt b{color:var(--ink)}
  .ph button,.ph a.plus{width:29px;height:30px;border:0;background:none;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink);text-decoration:none}
  .ph button:hover,.ph a.plus:hover{background:#F3EEE9}
  .ph svg{width:17px;height:17px}
  .ph a.plus svg{width:20px;height:20px}
  .slides{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#F3EEE9}
  .sl{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none;display:block;text-decoration:none;color:inherit}
  .sl.on{opacity:1;pointer-events:auto}
  .sl img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .sl.poster img{object-fit:contain}
  .sl .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:14px;font-weight:700;word-break:keep-all}
  .sl.text{padding:14px 14px 10px;overflow:auto;background:#FFF8EC}
  .sl.text ul{list-style:none}
  .sl.text li{position:relative;padding:8px 0 8px 14px;border-top:1px solid #F1E3C8;font-size:14px;word-break:keep-all}
  .sl.text li:first-child{border-top:0}
  .sl.text li::before{content:"";position:absolute;left:1px;top:16px;width:6px;height:6px;border-radius:50%;background:#D9822B}
  .sl.text h4{font-size:13px;color:#B7791F;margin-bottom:4px}
  .wo .flabel{padding:0 18px;font-size:12.5px;font-weight:700;color:#FFD9A8;letter-spacing:.04em}
  .wo .flabel + ol{padding-top:4px}
  .wo .theme + .sub{margin-bottom:8px}
  .fo td:first-child{color:var(--ink)}
  .fo tr.now td{background:var(--brand-soft);font-weight:700}
  .fo tr.past td{color:#A9A19B}

  /* 알림판 페이지 · 보도자료 */
  .posters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .pst{padding:0;overflow:hidden;text-decoration:none;color:inherit;display:block}
  .pst img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#F3EEE9;cursor:zoom-in}
  .pst div{padding:10px 12px 12px;font-size:14px;font-weight:700;word-break:keep-all}
  .pst div span{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  .press{display:flex;flex-direction:column;gap:12px}
  .pr{display:flex;flex-direction:column;padding:0;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .15s}
  .pr:hover{border-color:var(--brand)}
  .pr img{width:100%;height:auto;max-height:560px;object-fit:contain;display:block;background:#F3EEE9}
  .pr .b{padding:16px 18px 18px}
  .pr .src{font-size:12.5px;font-weight:700;color:var(--brand)}
  .pr .src span{color:var(--muted);font-weight:500}
  .pr h4{font-size:16.5px;font-weight:900;line-height:1.45;margin:4px 0 6px;word-break:keep-all}
  .pr p{font-size:14px;color:var(--muted);word-break:keep-all}
  .pr .go{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--brand)}
  .emptybox{text-align:center;color:var(--muted);font-size:14.5px;padding:30px 16px}

  /* 위쪽 바로가기 (한 줄, 옆으로 밀기) */
  .quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:2px 16px 4px;scroll-snap-type:x proximity}
  .quick::-webkit-scrollbar{display:none}
  .quick a{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:700;text-align:center;line-height:1.25;word-break:keep-all;scroll-snap-align:start}
  .quick a .ic{width:50px;height:50px;border-radius:16px;background:#fff;border:1px solid var(--line);color:var(--brand);display:grid;place-items:center;transition:transform .15s,border-color .15s}
  .quick a:active .ic{transform:scale(.93)}
  .quick a:hover .ic{border-color:var(--brand)}
  .quick a .ic svg{width:23px;height:23px}
  @media (min-width:700px){ .quick{justify-content:center;flex-wrap:wrap;overflow:visible} }
  .addr{display:flex;align-items:center;gap:10px;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-decoration:none;color:var(--ink)}
  .addr .ic{flex:none;width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
  .addr .ic svg{width:20px;height:20px}
  .addr span{flex:1;min-width:0;font-size:14px;font-weight:700;word-break:keep-all}
  .addr span small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}

  /* 찾아오시는 길 */
  .mapbox{padding:0;overflow:hidden}
  .mapbox iframe{display:block;width:100%;height:320px;border:0;background:#EEE9E3}
  .mapbox .info{padding:16px 18px 18px}
  .mapbox .info b{display:block;font-size:17px;font-weight:900}
  .mapbox .info p{font-size:15px;margin-top:2px;word-break:keep-all}
  .mapbox .info .lm{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:var(--brand);margin-top:4px}
  .mapbox .info .lm svg{width:15px;height:15px;flex:none}
  .hours h4{display:flex;align-items:center;justify-content:space-between}
  .hours .open{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#E9E2DB;color:#6B6460}
  .hours .open.on{background:#1E7A46;color:#fff}
  .hours td:first-child{color:var(--brand);font-family:'Noto Serif KR',serif;font-weight:900}
  .hours tr.today td{background:var(--brand-soft);font-weight:700}
  .hours tr.off td:last-child{color:#C23A3A}
  .park{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:16px 18px}
  .park svg{width:26px;height:26px;color:var(--brand);flex:none;margin-top:2px}
  .park b{font-size:15px}
  .park p{font-size:14.5px;color:#3A3533;word-break:keep-all}
  .mapbox .info .note{font-size:13.5px;color:var(--muted);text-align:left;margin-top:6px}
  .mapbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .mapbtns a,.mapbtns button{display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:14px;font-weight:700;border-radius:12px;padding:12px 8px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .mapbtns .nv{background:#03C75A;border-color:#03C75A;color:#fff}
  .mapbtns .kk{background:#FEE500;border-color:#FEE500;color:#191919}
  .mapbtns .wide{grid-column:1/-1}
  .mapbtns svg{width:17px;height:17px}

  /* ---------- 하위 페이지 ---------- */
  .pagehero{background:var(--brand);color:#fff;position:relative;overflow:hidden;padding:22px 20px 24px}
  .pagehero .in{max-width:640px;margin:0 auto;position:relative}
  .pagehero .wm{position:absolute;right:-40px;top:-30px;width:150px;opacity:.1;pointer-events:none}
  .crumb{font-size:12.5px;opacity:.8}
  .crumb a{text-decoration:none}
  .pagehero h2{font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;margin-top:2px}
  .subtabs{background:#fff;border-bottom:1px solid var(--line)}
  .subtabs .in{max-width:640px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 16px}
  .subtabs .in::-webkit-scrollbar{display:none}
  .subtabs a{flex:none;text-decoration:none;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fff}
  .subtabs a.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .sec{padding-top:26px;animation:fadeUp .35s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .sec > h3.st{font-family:'Noto Serif KR',serif;font-weight:900;font-size:20px;line-height:1.4;word-break:keep-all;margin-bottom:16px}
  .lead{font-size:15px;color:var(--muted);margin:-6px 2px 16px;word-break:keep-all}

  /* 교육 철학 */
  .q{border-radius:16px;padding:18px 12px;font-size:15px;letter-spacing:-.02em;font-weight:700;line-height:1.6;word-break:keep-all;text-align:center;text-wrap:balance}

  .q2{background:#E6EEFB;color:#1F3B63}
  .plus{text-align:center;font-size:30px;font-weight:900;color:var(--navy);line-height:1;margin:10px 0}
  .letter{margin-top:16px;font-family:'Noto Serif KR',serif;font-size:15.5px;line-height:1.9;word-break:keep-all}

  .letter .sign{text-align:center;font-weight:700;color:var(--brand);margin-top:18px}

  /* 지도진 */
  .staff{display:flex;flex-direction:column;gap:12px}

  .member .photo{width:100%;aspect-ratio:6/5;object-fit:cover;object-position:center 20%;display:block;background:#E9E2DB}
  .member .body{padding:18px 20px 20px}
  .member .who{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .member .role{font-size:13px;font-weight:700;color:#fff;background:var(--brand);padding:2px 10px;border-radius:999px}

  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}

  /* 교육 내용 */
  .areas{display:flex;flex-direction:column;gap:10px}
  .area{border-radius:16px;padding:16px 18px;color:#fff}
  .area h4{font-size:16px;font-weight:900;margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:500}
  .goals{margin-top:14px}
  .goal{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .goal:last-child{border-bottom:0}
  .goal b{font-size:15.5px;flex:1;word-break:keep-all}
  .goal span{font-size:13.5px;color:var(--brand);font-weight:700;text-align:right;word-break:keep-all;max-width:55%}
  .closing{margin-top:14px;font-size:15px;line-height:1.75;word-break:keep-all;background:var(--brand-soft);border-radius:14px;padding:16px 18px;color:#5A1A1D}

  /* 프로그램 */
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;font:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
  .common{font-size:13.5px;color:var(--muted);margin:0 2px 10px}
  .common b{color:var(--ink)}
  .days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px 12px;text-align:center;min-width:0}
  .day .d{font-family:'Noto Serif KR',serif;font-weight:900;font-size:17px;color:var(--brand);margin-bottom:6px}
  .day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
  .day p{font-size:12px;line-height:1.45;word-break:keep-all;color:#3A3533}
  .day p + p{margin-top:4px}
  .day p.sub{color:var(--muted);font-size:11px}
  .tt{padding:0;overflow:hidden}
  .tt h4{font-size:15px;font-weight:900;padding:14px 18px;background:#F6EFD9;color:#5B4612}

  .tt td{padding:11px 18px;border-top:1px solid var(--line);vertical-align:top;word-break:keep-all}
  .tt td:first-child{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;width:1%}
  .tt td:last-child{color:#3A3533}
  .tt + .tt{margin-top:14px}
  .wk td:first-child{color:var(--brand);font-family:'Noto Serif KR',serif;font-weight:900}

  /* 일정 (달력) */
  .cal{padding:16px 14px 14px}

  .dow{font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}

  .cell{position:relative;border:0;background:none;font:inherit;border-radius:10px;padding:5px 0 9px;min-height:46px;cursor:pointer;color:var(--ink)}

  .cell.today .n{background:var(--ink);color:#fff!important;font-weight:900}
  .cell.sel{background:var(--brand-soft)}
  .cell .dots{position:absolute;left:0;right:0;bottom:5px;display:flex;justify-content:center;gap:3px}

  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:10px 4px 0;font-size:12px;color:var(--muted)}

  .ev .what span{font-size:13px;color:var(--muted);word-break:keep-all}

  /* FAQ */
  .faq details{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}

  .faq summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none}

  /* 사진 */
  .marquee{margin:0 -16px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .track{display:flex;gap:10px;width:max-content;animation:flow var(--dur,40s) linear infinite}
  .marquee:hover .track,.marquee.paused .track{animation-play-state:paused}

  /* 상담 */
  .callbig{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--brand);color:#fff;text-decoration:none;border-radius:16px;padding:18px;font-size:18px;font-weight:900;letter-spacing:.02em}

  .callbig small{display:block;font-size:12.5px;font-weight:500;opacity:.85;letter-spacing:0}
  .links{display:flex;flex-direction:column;gap:10px;margin-top:12px}

  .link:hover{border-color:var(--brand)}

  .link .ic svg{width:22px;height:22px}

  .text{flex:1;min-width:0}
  .name{display:block;font-weight:700;font-size:16px;word-break:keep-all}
  .desc{display:block;font-size:13px;color:var(--muted);margin-top:1px;word-break:keep-all}
  .arrow{flex:none;opacity:.4}

  footer.foot{background:#2A2524;color:#CFC6C0;font-size:13px;line-height:1.8}
  footer.foot .in{max-width:640px;margin:0 auto;padding:26px 20px calc(30px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:center}
  footer.foot img{width:46px;height:auto;flex:none;opacity:.9}
  footer.foot b{color:#fff;font-size:15px}
  footer.foot a{color:#fff}

  /* 오른쪽에 떠 있는 버튼 */
  .fab{position:fixed;right:12px;bottom:72px;z-index:35;display:flex;flex-direction:column;gap:8px}
  .fab a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.22);transition:transform .15s;background:#fff;color:var(--ink);border:1px solid var(--line)}
  .fab a:active{transform:scale(.92)}
  .fab a.f-logo{border:0;overflow:hidden}
  .fab a.f-logo img{width:82%;height:82%;display:block;border-radius:22%}
  .fab a.f-logo.f-kakao img{width:90%;height:90%}
  .fab a.f-logo.f-blog{background:#000}
  .fab a.f-logo.f-calendar{background:#fff}
  .fab a.f-logo.f-calendar img{width:62%;height:62%;border-radius:0}
  .fab a.f-logo.f-blog img{width:100%;height:100%;border-radius:0}
  .ic.has-logo{background:none!important;padding:0;overflow:hidden}
  .ic .logo-ic{width:100%;height:100%;display:block;border-radius:inherit}
  .ic .logo-ic.lg-calendar{width:80%;height:80%;border-radius:0}
  .fab a svg{width:21px;height:21px}
  .fab a.f-calendar{background:#03C75A;color:#fff;border:0}
  .fab a.f-chat{background:#03C75A;color:#fff;border:0}
  .fab a.f-insta{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff;border:0}
  .fab a.f-kakao{background:#FEE500;color:#3C1E1E;border:0}
  .fab a.f-youtube{background:#FF0000;color:#fff;border:0}
  .fab a.f-phone{background:var(--brand);color:#fff;border:0}
  .fab a.f-blog,.fab a.f-book,.fab a.f-photo,.fab a.f-star{background:#03C75A;color:#fff;border:0}
  body.lock .fab{display:none}
  .totop{position:fixed;right:12px;bottom:20px;z-index:30;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s;cursor:pointer}
  .totop svg{width:22px;height:22px}
  .totop.on{opacity:.9;pointer-events:auto}

  @media (prefers-reduced-motion:reduce){
    .sec{animation:none}
    .track{animation-duration:calc(var(--dur,40s) * 3)}
    .drawer .panel,.drawer .dim{transition:none}
  }
  #app{opacity:0;transition:opacity .25s}
  #app.ready{opacity:1}
</style>
</head>
<body>

<script>
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  news:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h6M7 12h10M7 16h10"/>',

  map:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',

  chat:'<path d="M4 5h16v11H9l-5 4Z"/><path d="M8 9.5h8M8 12.5h5"/>',

  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

  run:'<circle cx="14" cy="4.5" r="2"/><path d="m6 20 3.5-5 3 2 1.5-6"/><path d="M9 9.5 12 8l3 3 3.5 1"/><path d="m14 11-2 5"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  up:'<path d="m6 15 6-6 6 6"/>', left:'<path d="m15 6-6 6 6 6"/>', right:'<path d="m9 6 6 6-6 6"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>', car:'<path d="M5 17h14v-4l-2-5H7l-2 5Z"/><path d="M5 13h14"/><circle cx="8" cy="17" r="1.8"/><circle cx="16" cy="17" r="1.8"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>', plus:'<path d="M12 5v14M5 12h14"/>', pause:'<path d="M9 6v12M15 6v12"/>', play:'<path d="m8 5 11 7-11 7Z"/>', megaphone:'<path d="M3 10v4h3l8 5V5L6 10Z"/><path d="M18 9a4 4 0 0 1 0 6"/>', close:'<path d="M6 6l12 12M18 6 6 18"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const AREA_COLORS = ['var(--orange)','var(--teal)','var(--navy)','var(--brand)'];
const EV_COLORS = { '수련':'#3C8D5A', '기네스':'#B8860B', '심사':'#A40F16', '대회':'#1F3B63', '행사':'#D9822B', '휴관':'#8A837E', '기타':'#2E9C9A' };
const DAYS = ['월','화','수','목','금'];
const WEEK = ['일','월','화','수','목','금','토'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (name, sw=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.link}</svg>`;
// 카카오톡·인스타·블로그·유튜브는 실제 로고 그림으로
const LOGOS = { kakao:'img/sns/kakao.png', insta:'img/sns/insta.png', blog:'img/sns/blog.png?v=3', youtube:'img/sns/youtube.png', calendar:'img/sns/naver-booking.png?v=1' };
const ico = name => LOGOS[name] ? `<img class="logo-ic lg-${name}" src="${LOGOS[name]}" alt="">` : svg(name);
const arrow = '<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const list = a => (a || []).filter(Boolean);

// 날짜 (한국 시간 기준 오늘)
const pad = n => String(n).padStart(2, '0');
const ymd = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const TODAY = (() => { const n = new Date(); const k = new Date(n.getTime() + (n.getTimezoneOffset() + 540) * 60000); return new Date(k.getFullYear(), k.getMonth(), k.getDate()); })();
const dayDiff = (a, b) => Math.round((a - b) / 86400000);
const krDate = dt => `${dt.getMonth()+1}월 ${dt.getDate()}일 ${WEEK[dt.getDay()]}요일`;

let D, EVENTS = [], S = {}, GROUPS = [];
const sec = (id, title, inner) => `<section class="sec" id="sec-${id}" data-id="${id}" hidden>${title ? `<h3 class="st">${esc(title)}</h3>` : ''}${inner}</section>`;

function render(d){
  D = d; S = {};
  EVENTS = list(d.schedule).filter(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date)).map(e => {
    const s = parseD(e.date); let en = e.end && /^\d{4}-\d{2}-\d{2}$/.test(e.end) ? parseD(e.end) : s;
    if(en < s) en = s;
    return {...e, s, en};
  });
  EVENTS = EVENTS.concat(guinnessEvents(d, EVENTS)).sort((a, b) => a.s - b.s);

// ---------- 화면 전환 ----------
function route(){
  const id = location.hash.replace(/^#\/?/, '');
  const g = GROUPS.find(x => x.items.includes(id));
  const home = !g;
  document.getElementById('homePage').hidden = !home;
  document.getElementById('subPage').hidden = home;
  document.querySelectorAll('.gnb a').forEach(a => a.classList.toggle('on', home ? a.dataset.g === 'home' : a.dataset.g === g.name));
  const on = document.querySelector('.gnb a.on'); if(on) on.scrollIntoView({block:'nearest', inline:'center'});
  if(!home){
    document.getElementById('crumbG').textContent = g.name + (g.items.length > 1 ? ' › ' + S[id].label : '');
    document.getElementById('pageTitle').textContent = g.items.length > 1 ? S[id].label : g.name;
    const tabs = document.getElementById('subtabs');
    tabs.parentElement.hidden = g.items.length < 2;
    tabs.innerHTML = g.items.map(x => `<a href="#/${x}" class="${x === id ? 'on' : ''}">${esc(S[x].label)}</a>`).join('');
    document.querySelectorAll('#subPage .sec').forEach(s => s.hidden = s.dataset.id !== id);
    const t = tabs.querySelector('.on'); if(t) t.scrollIntoView({block:'nearest', inline:'center'});
  }
  window.scrollTo(0, 0);
}

// ---------- 오늘의 운동 ----------
function monthPlan(d){
  const ms = list((d.monthly || {}).months).filter(m => m.month).sort((a, b) => a.month.localeCompare(b.month));
  const cur = ymd(TODAY).slice(0, 7);
  return { exact: ms.find(m => m.month === cur), plan: ms.find(m => m.month === cur) || ms.filter(m => m.month < cur).pop() || ms[ms.length - 1] };
}
// 요일별 운동테마는 매달 같음 (예전 형식처럼 달마다 들어 있으면 그것도 읽음)
function weekdayThemes(d){
  const w = (d.monthly || {}).weekday;
  if(w && Object.values(w).some(v => list(v).length)) return w;
  const { plan } = monthPlan(d);
  return (plan && plan.weekday) || {};
}
const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
function focusList(d){
  return list((d.monthly || {}).focus).filter(f => isDate(f.date) && f.title).map(f => {
    const s = parseD(f.date); let en = isDate(f.end) ? parseD(f.end) : s; if(en < s) en = s;
    return {...f, s, en};
  }).sort((a, b) => a.s - b.s);
}
function workoutCard(d, onHome){
  const mo = d.monthly || {};
  const dow = TODAY.getDay(), weekend = dow === 0 || dow === 6;
  const evs = eventsOn(TODAY);
  const off = evs.filter(e => e.type === '휴관');
  let fs = focusList(d).filter(f => f.s <= TODAY && TODAY <= f.en);
  // 같은 이름의 일정(예: 해랑경희 기네스 · 스피드 발차기)이 있으면 그 이름으로 한 번만 보여줌
  const dup = e => fs.some(f => (e.title || '').includes(f.title) || f.title.includes(e.title || '-'));
  fs = fs.map(f => { const e = evs.find(x => x.type !== '휴관' && ((x.title || '').includes(f.title) || f.title.includes(x.title || '-'))); return e ? {...f, title: e.title.length > f.title.length ? e.title : f.title} : f; });
  const items = list(weekdayThemes(d)[WEEK[dow]]);
  const evRows = evs.filter(e => e.type !== '휴관' && !dup(e)).map(e => {
    const c = EV_COLORS[e.type] || EV_COLORS['기타'];
    return `<div class="focus"><span class="tag" style="background:${c}">${esc(e.type || '일정')}</span><b>${esc(e.title)}</b>${e.note ? `<span>${esc(e.note)}</span>` : ''}</div>`;
  }).join('');
  let body;
  if(off.length) body = `<div class="theme">오늘은 쉬는 날이에요</div><p class="sub">${off.map(e => esc(e.title)).join(', ')}</p>`;
  else if(weekend && !fs.length && !evRows && !items.length) body = `<div class="theme">${esc(mo.weekendText || '즐거운 주말! 월요일에 만나요 ☺')}</div>`;
  else body = `
      ${fs.length ? `<div class="flabel">${fs.some(f => +f.s !== +f.en) ? '이번 주 수련' : '오늘의 수련'}</div><div class="theme">${fs.map(f => esc(f.title)).join(' · ')}</div><p class="sub">${fs.map(rangeText).join(', ')}</p>` : ''}
      ${evRows ? `<div class="focusbox">${evRows}</div>` : ''}
      ${items.length ? `<div class="flabel" style="margin-top:6px">${WEEK[dow]}요일 수업</div><ol>${items.map(i => `<li><b>${esc(i)}</b></li>`).join('')}</ol>` : ''}
      ${!fs.length && !evRows && !items.length ? `<div class="theme">오늘은 정해진 운동이 없어요</div>` : ''}`;
  return `<div class="card hc wo">
    <div class="hc-head"><span class="ic">${svg('run')}</span><h2>${esc(mo.title || '오늘의 운동')}<small>${krDate(TODAY)}</small></h2>${onHome ? `<a class="more" href="#/today">이달 수련 계획 ›</a>` : ''}</div>
    ${body}<div class="pad"></div>
  </div>`;
}
function focusTable(d){
  const y = TODAY.getFullYear(), m = TODAY.getMonth();
  const ms = new Date(y, m, 1), me = new Date(y, m + 1, 0);
  const rows = focusList(d).filter(f => f.s <= me && f.en >= ms);
  if(!rows.length) return '';
  return `<div class="card tt fo" style="margin-top:14px"><h4>${m + 1}월 수련 계획</h4><table>
    ${rows.map(f => `<tr class="${f.s <= TODAY && TODAY <= f.en ? 'now' : (f.en < TODAY ? 'past' : '')}"><td>${rangeText(f)}</td><td>${esc(f.title)}</td></tr>`).join('')}</table></div>`;
}
function weekTable(d){
  const wd = weekdayThemes(d);
  const rows = ['월','화','수','목','금','토'].map(w => [w, list(wd[w])]).filter(([, v]) => v.length);
  if(!rows.length) return '';
  const today = WEEK[TODAY.getDay()];
  return `<div class="card tt wk" style="margin-top:14px"><h4>요일별 운동테마</h4><table>
    ${rows.map(([w, v]) => `<tr class="${w === today ? 'today' : ''}"><td>${w}</td><td>${v.map(esc).join(' · ')}</td></tr>`).join('')}</table></div>`;
}
function monthNotices(d){
  const { exact } = monthPlan(d);
  return exact ? { m: +exact.month.slice(5), list: list(exact.notices) } : { m: TODAY.getMonth() + 1, list: [] };
}
function activePosters(d){
  return list(d.board).filter(p => p.image || p.title).filter(p => (!isDate(p.start) || parseD(p.start) <= TODAY) && (!isDate(p.end) || TODAY <= parseD(p.end)));
}
const pad2 = n => String(n).padStart(2, '0');
// 작은 칸: 사진 아래에  ‹  01 · 06  ‖  ›
function ctrlRow(n){
  return n > 1 ? `<div class="ctrl"><button type="button" data-prev aria-label="이전">${svg('left',2.4)}</button><span class="cnt"><b data-cur>01</b> · ${pad2(n)}</span><button type="button" data-pp aria-label="멈춤">${svg('pause',2.6)}</button><button type="button" data-next aria-label="다음">${svg('right',2.4)}</button></div>` : '';
}
function sliderHead(title, n, more, mini){
  // 작은 칸 제목은 마지막 단어를 다음 줄로 (예: 사진으로 보는 / 해랑경희)
  const t = mini && /\s/.test(title.trim()) ? esc(title.trim()).replace(/\s+(\S+)$/, '<br>$1') : esc(title);
  return `<div class="ph"><h3>${t}</h3>
    ${n > 1 && !mini ? `<span class="cnt"><b data-cur>01</b> · ${pad2(n)}</span>
      <button type="button" data-prev aria-label="이전">${svg('left',2.4)}</button>
      <button type="button" data-pp aria-label="멈춤">${svg('pause',2.6)}</button>
      <button type="button" data-next aria-label="다음">${svg('right',2.4)}</button>` : ''}
    <a class="plus" href="${more}" aria-label="더 보기">${svg('plus',2.2)}</a></div>`;
}
function photoPanel(d){
  const pics = list(d.gallery);
  if(!pics.length) return '';
  return `<div class="card panel slider mini">${sliderHead(d.galleryTitle || '사진으로 보는 해랑경희', pics.length, '#/gallery', true)}
    <div class="slides">${pics.map((p, i) => `<div class="sl${i ? '' : ' on'}"><img src="${esc(p)}" alt="수업 사진" data-zoom ${i > 1 ? 'loading="lazy"' : ''}></div>`).join('')}</div>${ctrlRow(pics.length)}</div>`;
}
// 행사 사진: 일정에 사진을 붙이면 여기 나옴 (다가오는 행사 먼저, 그다음 지난 행사 최근 순)
function eventPanel(){
  const withImg = EVENTS.filter(e => e.image);
  const up = withImg.filter(e => e.en >= TODAY).sort((a, b) => a.s - b.s);
  // 지난 행사는 끝난 지 1개월까지만
  const cutoff = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, TODAY.getDate());
  const past = withImg.filter(e => e.en < TODAY && e.en >= cutoff).sort((a, b) => b.s - a.s);
  const evs = up.concat(past);
  const slides = evs.map((e, i) => {
    const n = dayDiff(e.s, TODAY);
    const dd = e.en < TODAY ? '<span class="dd past">지난 행사</span>' : `<span class="dd">${n > 0 ? 'D-' + n : (n === 0 ? '오늘' : '진행 중')}</span>`;
    return `<div class="sl poster${i ? '' : ' on'}" data-cap="${esc(e.title)}" data-sub="${rangeText(e)}"><img src="${esc(e.image)}" alt="${esc(e.title)}" data-zoom ${i > 1 ? 'loading="lazy"' : ''}>${dd}</div>`;
  });
  if(!slides.length) slides.push(`<div class="sl text on"><p class="emptybox">행사 사진이 올라오면 여기에 보여요.</p></div>`);
  return `<div class="card panel slider mini">${sliderHead('행사', evs.length, '#/schedule', true)}<div class="slides">${slides.join('')}</div>${evs.length ? `<p class="capline"></p>` : ''}${ctrlRow(evs.length)}</div>`;
}
function posterSlide(p, i){
  const inner = `${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title || '알림')}" ${p.url ? '' : 'data-zoom'}>` : ''}${p.title ? `<span class="cap">${esc(p.title)}</span>` : ''}`;
  return p.url ? `<a class="sl poster${i ? '' : ' on'}" href="${esc(p.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="sl poster${i ? '' : ' on'}">${inner}</div>`;
}
function boardPanel(d){
  const ps = activePosters(d), nt = monthNotices(d);
  const slides = ps.map(posterSlide);
  if(nt.list.length) slides.push(`<div class="sl text${slides.length ? '' : ' on'}"><h4>${nt.m}월 공지사항</h4><ul>${nt.list.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`);
  if(!slides.length) slides.push(`<div class="sl text on"><p class="emptybox">새 소식이 올라오면 여기에 보여요.</p></div>`);
  return `<div class="card panel slider wide">${sliderHead('알림판', slides.length, '#/notice')}<div class="slides">${slides.join('')}</div></div>`;
}
function noticePage(d){
  const ps = activePosters(d), nt = monthNotices(d);
  return `${ps.length ? `<h3 class="st">행사 · 알림</h3><div class="posters">${ps.map(p => {
      const inner = `${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title || '알림')}" ${p.url ? '' : 'data-zoom'} loading="lazy">` : ''}<div>${esc(p.title || '')}${isDate(p.end) ? `<span>~ ${+p.end.slice(5,7)}.${+p.end.slice(8)}까지</span>` : ''}</div>`;
      return p.url ? `<a class="card pst" href="${esc(p.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="card pst">${inner}</div>`;
    }).join('')}</div>` : ''}
    <h3 class="st" style="${ps.length ? 'margin-top:28px' : ''}">${nt.m}월 공지사항</h3>
    ${nt.list.length ? `<div class="card hc nt"><ul style="padding-top:6px">${nt.list.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : `<div class="card emptybox">이번 달 공지사항이 아직 없어요.</div>`}`;
}
function pressPage(d){
  const ps = list(d.press).filter(p => p.title && p.url).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  if(!ps.length) return `<div class="card emptybox">아직 등록된 보도자료가 없어요.</div>`;
  return `<div class="press">${ps.map(p => `
    <a class="card pr" href="${esc(p.url)}" target="_blank" rel="noopener">
      ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ''}
      <div class="b"><div class="src">${esc(p.source || '언론 보도')}${isDate(p.date) ? ` <span>· ${p.date.replace(/-/g, '.')}</span>` : ''}</div>
      <h4>${esc(p.title)}</h4>${p.summary ? `<p>${esc(p.summary)}</p>` : ''}<span class="go">기사 보기 ›</span></div>
    </a>`).join('')}</div>`;
}

// ---------- 해랑 기네스: 매달 첫째 주 금요일 자동 ----------
// 분기별 종목: 1~3월(1) · 4~6월(2) · 7~9월(3) · 10~12월(4)
function guinnessEvents(d, manual){
  const g = d.guinness || {};
  if(!g.on) return [];
  const [sy, sm] = /^\d{4}-\d{2}$/.test(g.start || '') ? g.start.split('-').map(Number) : [TODAY.getFullYear(), TODAY.getMonth() + 1];
  const out = [];
  for(let k = -12; k <= 12; k++){
    const first = new Date(TODAY.getFullYear(), TODAY.getMonth() + k, 1);
    const y = first.getFullYear(), m = first.getMonth() + 1;
    if(y * 12 + m < sy * 12 + sm) continue;
    const fri = new Date(y, m - 1, 1 + ((5 - first.getDay() + 7) % 7));
    if(manual.some(e => e.s <= fri && fri <= e.en && (e.type === '기네스' || (e.title || '').includes('기네스')))) continue;   // 직접 넣은 기네스 일정이 있으면 그걸 사용
    if(manual.some(e => e.type === '휴관' && e.s <= fri && fri <= e.en)) continue;                     // 휴관일이면 건너뜀
    const item = (g.items || {})[String(Math.floor((m - 1) / 3) + 1)];
    out.push({ title: item || g.title || '해랑경희 기네스', type: '기네스', note: g.note || '', image: '', s: fri, en: fri, auto: true });
  }
  return out;
}

// ---------- 일정 ----------
function upcomingCard(){
  const next = EVENTS.filter(e => e.en >= TODAY).slice(0, 3);
  return `<div class="card hc up">
    <div class="hc-head"><span class="ic">${svg('calendar')}</span><h2>다가오는 일정<small>해랑경희 소식</small></h2><a class="more" href="#/schedule">전체 보기 ›</a></div>
    ${next.length ? `<ul>${next.map(e => {
      const n = dayDiff(e.s, TODAY);
      const label = n > 0 ? 'D-' + n : (n === 0 ? '오늘' : '진행 중');
      return `<li><span class="dday${n <= 0 ? ' now' : ''}">${label}</span><div class="t"><b><span class="tag" style="background:${EV_COLORS[e.type] || EV_COLORS['기타']}">${esc(e.type || '기타')}</span>${esc(e.title)}</b><span>${rangeText(e)}${e.note ? ' · ' + esc(e.note) : ''}</span></div></li>`;
    }).join('')}</ul>` : `<p class="empty">예정된 일정이 없어요.</p>`}
  </div>`;
}
function rangeText(e){
  const a = `${e.s.getMonth()+1}.${e.s.getDate()}(${WEEK[e.s.getDay()]})`;
  if(+e.en === +e.s) return a;
  return `${a} ~ ${e.en.getMonth()+1}.${e.en.getDate()}(${WEEK[e.en.getDay()]})`;
}
const eventsOn = dt => EVENTS.filter(e => e.s <= dt && dt <= e.en);

function setupCalendar(){
  const cal = document.getElementById('cal'), box = document.getElementById('evlist');
  if(!cal) return;
  let y = TODAY.getFullYear(), m = TODAY.getMonth(), sel = null;
  const draw = () => {
    const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate(), lead = first.getDay();
    let cells = '';
    for(let i = 0; i < lead; i++) cells += '<span class="cell out"></span>';
    for(let dd = 1; dd <= days; dd++){
      const dt = new Date(y, m, dd), evs = eventsOn(dt);
      const cls = ['cell', dt.getDay() === 0 ? 'sun' : '', dt.getDay() === 6 ? 'sat' : '', evs.some(e => e.type === '휴관') ? 'off' : '', +dt === +TODAY ? 'today' : '', sel && +dt === +sel ? 'sel' : ''].join(' ');
      cells += `<button type="button" class="${cls}" data-d="${dd}" aria-label="${m+1}월 ${dd}일${evs.length ? ', 일정 ' + evs.length + '개' : ''}"><span class="n">${dd}</span>
        ${evs.length ? `<span class="dots">${evs.slice(0,3).map(e => `<i style="background:${EV_COLORS[e.type] || EV_COLORS['기타']}"></i>`).join('')}</span>` : ''}</button>`;
    }
    cal.innerHTML = `<div class="cal-top"><button type="button" data-mv="-1" aria-label="이전 달">${svg('left')}</button><b>${y}년 ${m+1}월</b><button type="button" data-mv="1" aria-label="다음 달">${svg('right')}</button></div>
      <div class="grid7">${WEEK.map(w => `<span class="dow">${w}</span>`).join('')}${cells}</div>`;
    cal.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { m += +b.dataset.mv; if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; } sel = null; draw(); });
    cal.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const dt = new Date(y, m, +b.dataset.d); sel = sel && +sel === +dt ? null : dt; draw(); });
    let evs, title;
    if(sel){ evs = eventsOn(sel); title = krDate(sel); }
    else{ const s = new Date(y, m, 1), e = new Date(y, m+1, 0); evs = EVENTS.filter(x => x.s <= e && x.en >= s); title = `${m+1}월 일정`; }
    box.innerHTML = `<h4>${title}</h4>` + (evs.length ? evs.map(e => `
      <div class="ev"><div class="when"><b>${e.s.getDate()}</b><span>${e.s.getMonth()+1}월 ${WEEK[e.s.getDay()]}</span></div>${e.image ? `<img class="thumb" src="${esc(e.image)}" alt="${esc(e.title)}" data-zoom loading="lazy">` : ''}
        <div class="what" style="border-color:${EV_COLORS[e.type] || EV_COLORS['기타']}"><b><span class="tag" style="background:${EV_COLORS[e.type] || EV_COLORS['기타']}">${esc(e.type || '기타')}</span>${esc(e.title)}</b>
        <span>${rangeText(e)}${e.note ? ' · ' + esc(e.note) : ''}</span></div></div>`).join('') : `<div class="ev"><div class="what" style="border-color:var(--line)"><span>등록된 일정이 없어요.</span></div></div>`);
  };
  draw();
}

// ---------- 프로그램 탭 ----------
function setupTabs(){
  const box = document.getElementById('divBox');
  if(!box) return;
  const today = DAYS[TODAY.getDay() - 1];
  const show = i => {
    const v = list(D.program.divisions)[i];
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', +b.dataset.div === i));
    box.innerHTML = `
      ${v.common ? `<p class="common">매일 <b>${esc(v.common)}</b></p>` : ''}
      <div class="days">${DAYS.map(dd => `
        <div class="day${dd === today ? ' today' : ''}"><div class="d">${dd}</div>
          ${list((v.days || {})[dd]).map(x => `<p class="${/^\(.*\)$/.test(x) ? 'sub' : ''}">${esc(x)}</p>`).join('')}
        </div>`).join('')}</div>`;
  };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(+b.dataset.div));
  show(0);
}

// ---------- 사진 ----------
function gallery(d){
  const pics = list(d.gallery);
  let row = pics.slice();
  while(row.length < 8) row = row.concat(pics);
  const imgs = row.map(p => `<img src="${esc(p)}" alt="수업 사진" decoding="async">`).join('');
  return `<div class="marquee"><div class="track" style="--dur:${row.length * 4}s">${imgs}${imgs}</div></div>
    <div class="photogrid">${pics.map(p => `<img src="${esc(p)}" alt="수업 사진" loading="lazy">`).join('')}</div>`;
}
function setupGallery(){
  const lb = document.createElement('div');
  lb.className = 'lightbox'; lb.innerHTML = '<img alt="">';
  document.body.append(lb);
  const m = document.querySelector('.marquee');
  document.getElementById('app').addEventListener('click', e => {
    const img = e.target.closest('.marquee img, .photogrid img, img[data-zoom]');
    if(!img) return;
    lb.querySelector('img').src = img.src;
    lb.classList.add('on'); if(m) m.classList.add('paused');
  });
  lb.addEventListener('click', () => { lb.classList.remove('on'); if(m) m.classList.remove('paused'); });
}
// 홈의 사진·알림판 슬라이드 (4초마다 넘어감, ‖ 로 멈춤)
function setupSliders(){
  document.querySelectorAll('.slider').forEach(box => {
    const sl = [...box.querySelectorAll('.sl')], cur = box.querySelector('[data-cur]'), pp = box.querySelector('[data-pp]'), capl = box.querySelector('.capline');
    const cap = () => { if(capl && sl[i]){ capl.innerHTML = ''; capl.append(sl[i].dataset.cap || ''); const sm = document.createElement('small'); sm.textContent = sl[i].dataset.sub || ''; capl.append(sm); } };
    let i = 0; cap();
    if(sl.length < 2) return;
    let playing = true, t;
    const show = n => { sl[i].classList.remove('on'); i = (n + sl.length) % sl.length; sl[i].classList.add('on'); if(cur) cur.textContent = String(i + 1).padStart(2, '0'); cap(); };
    const loop = () => { clearInterval(t); if(playing) t = setInterval(() => show(i + 1), 4000); };
    const setPP = () => { pp.innerHTML = svg(playing ? 'pause' : 'play', 2.6); pp.setAttribute('aria-label', playing ? '멈춤' : '재생'); };
    const pv = box.querySelector('[data-prev]'), nx = box.querySelector('[data-next]');
    if(pv) pv.onclick = () => { show(i - 1); loop(); };
    if(nx) nx.onclick = () => { show(i + 1); loop(); };
    pp.onclick = () => { playing = !playing; setPP(); loop(); };
    let x0 = null;
    box.querySelector('.slides').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
    box.querySelector('.slides').addEventListener('touchend', e => { if(x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if(Math.abs(dx) > 40){ show(i + (dx < 0 ? 1 : -1)); loop(); } x0 = null; });
    setPP(); loop();
  });
}

// ---------- 메뉴 ----------
function setupMenu(){
  const dr = document.getElementById('drawer'), btn = document.getElementById('menuBtn');
  const open = on => {
    dr.classList.toggle('on', on); document.body.classList.toggle('lock', on);
    dr.setAttribute('aria-hidden', on ? 'false' : 'true'); btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  };
  btn.onclick = () => open(true);
  dr.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => open(false)));
  document.addEventListener('keydown', e => { if(e.key === 'Escape') open(false); });
}
function setupTop(){
  const top = document.getElementById('totop');
  top.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
  const f = () => top.classList.toggle('on', window.scrollY > 700);
  window.addEventListener('scroll', f, {passive:true}); f();
}

fetch('data.json?t=' + Date.now())
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById('app').innerHTML = '<p style="padding:40px 20px;text-align:center;color:#6B6460">내용을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>';
    document.getElementById('app').classList.add('ready');
  });
</script>
