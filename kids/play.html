<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3e6d3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>레크리에이션 · 해랑경희 제자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3e6d3;--card:#fffaf2;--ink:#5a4632;--soft:#a08a72;--accent:#e07a5f;--ok:#6aa84f;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;user-select:none;-webkit-user-select:none;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .top{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;}
  .title{display:flex;align-items:center;gap:8px;pointer-events:auto;}
  .back{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,250,242,.92);font:inherit;font-size:22px;color:var(--ink);box-shadow:0 2px 8px rgba(90,70,50,.12);text-decoration:none;display:flex;align-items:center;justify-content:center;flex:none;}
  .title b{display:block;font-size:22px;letter-spacing:-.5px;}
  .title span{font-size:13px;color:var(--soft);}
  .right{display:flex;gap:6px;pointer-events:auto;}
  .pill{background:rgba(255,250,242,.92);border:none;border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink);box-shadow:0 2px 8px rgba(90,70,50,.12);}
  .hint{position:fixed;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--soft);pointer-events:none;transition:opacity .6s;}
  .bar{position:fixed;left:10px;right:10px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:rgba(255,250,242,.95);
    border-radius:22px;padding:8px 4px;box-shadow:0 4px 18px rgba(90,70,50,.15);}
  .bar button{flex:1;background:none;border:none;font:inherit;color:var(--ink);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;}
  .bar button i{font-style:normal;font-size:24px;line-height:1;}
  .bar button:active{background:#f3e6d3;}
  .float{position:fixed;transform:translate(-50%,-50%);font-size:20px;color:var(--ink);text-shadow:0 2px 0 #fff,0 0 6px #fff;pointer-events:none;white-space:nowrap;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(90,70,50,.18);transform:translateY(110%);transition:transform .3s ease;z-index:5;}
  .sheet.open{transform:none;}
  .sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .sheetHead b{font-size:20px;}
  .x{background:#f1e6d6;border:none;border-radius:999px;padding:7px 14px;font:inherit;color:var(--ink);}
  .label{font-size:14px;color:var(--soft);margin:10px 0 6px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:2px solid transparent;background:#f6eee2;border-radius:14px;padding:7px 11px;font:inherit;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px;}
  .chip.on{border-color:var(--accent);background:#fff;}
  .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
  .note{font-size:13px;color:var(--soft);margin:14px 0 0;line-height:1.5;}
  .rec{display:flex;gap:8px;margin-top:6px;}
  .rec div{flex:1;min-width:0;background:#f6eee2;border-radius:14px;padding:9px 6px;text-align:center;font-size:13px;color:var(--soft);}
  .rec div b{display:block;font-size:20px;color:var(--ink);}
  .gInfo{display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px;}
  .gInfo span:last-child{color:var(--soft);}
  .gauge{position:relative;height:34px;border-radius:17px;background:#efe2cf;overflow:hidden;}
  .zone{position:absolute;top:0;bottom:0;background:#9fd08a;}
  .needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px;}
  .gMsg{text-align:center;font-size:16px;min-height:24px;margin:14px 0;}
  .big{width:100%;border:none;border-radius:18px;background:var(--accent);color:#fff;font:inherit;font-size:22px;padding:15px;box-shadow:0 4px 0 #b95c44;}
  .big:active{transform:translateY(3px);box-shadow:0 1px 0 #b95c44;}
  .toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(90,70,50,.88);color:#fff;padding:9px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  .toast.on{opacity:1;}
  .games{display:flex;flex-direction:column;gap:9px;}
  .game{display:flex;gap:12px;background:#f6eee2;border:none;border-radius:18px;padding:12px 14px;font:inherit;color:var(--ink);text-align:left;}
  .game i{font-style:normal;font-size:30px;}
  .game b{display:block;font-size:18px;font-weight:normal;}
  .game small{font-size:13px;color:var(--soft);}
  .game:active{background:#efe2cf;}
  .bigCount{text-align:center;font-size:44px;line-height:1;margin:2px 0 4px;}
  .prompt{text-align:center;font-size:30px;min-height:40px;margin:4px 0 8px;}
  .timer{height:10px;border-radius:5px;background:#efe2cf;overflow:hidden;margin-bottom:12px;}
  .timer div{height:100%;background:var(--accent);width:100%;}
  .two{display:flex;gap:10px;}
  .two .big{flex:1;font-size:22px;}
  .big.blue{background:#5b8fc7;box-shadow:0 4px 0 #436f9e;}
  .big.blue:active{box-shadow:0 1px 0 #436f9e;}
  .games{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-height:62vh;overflow:auto;}
  .game{flex-direction:column;align-items:flex-start;gap:4px;}
  .gwrap{display:flex;flex-direction:column;background:#f6eee2;border-radius:18px;min-width:0;}
  .gwrap .game{background:none;}
  .rk{padding:0 12px 10px;font-size:12px;color:var(--soft);}
  .rk:empty{display:none;}
  .rk .r{display:flex;justify-content:space-between;gap:4px;line-height:1.6;}
  .rk .r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rk .r.me,.rlist .r.me{color:var(--accent);}
  .rk .more{border:none;background:none;font:inherit;font-size:12px;color:var(--ink);padding:2px 0 0;text-decoration:underline;}
  .rlist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;}
  .rlist .r{display:flex;align-items:center;gap:10px;background:#f6eee2;border-radius:12px;padding:9px 12px;font-size:16px;}
  .rlist .r i{font-style:normal;width:30px;text-align:center;}
  .rlist .r span{flex:1;}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice{border:none;border-radius:16px;background:#f6eee2;padding:11px 14px;font:inherit;font-size:16px;color:var(--ink);text-align:left;line-height:1.35;}
  .choice b{font-weight:normal;color:var(--accent);}
  .choice.ok{background:#dff0d4;} .choice.no{background:#f7d6cf;animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .tgStep{font-size:15px;color:var(--soft);text-align:center;margin-bottom:8px;}
  .panel{position:fixed;inset:0;background:var(--bg);z-index:8;display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));}
  .panel.open{display:flex;}
  .pBody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0;}
  .stat{display:flex;justify-content:space-between;font-size:17px;}
  .slots{display:flex;gap:4px;justify-content:center;}
  .slot{flex:1;max-width:38px;height:46px;border-radius:12px;border:2px dashed #cdb89c;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--soft);}
  .bpick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .bbtn{border:none;border-radius:14px;padding:14px 4px;font:inherit;font-size:16px;color:var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(90,70,50,.1);}
  .bbtn span{width:70%;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.15);}
  .bbtn.used{visibility:hidden;}
  .bbtn.no{animation:shake .35s;}
  .holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 60%,#bfa27f,#d9c3a2 70%);border:none;font-size:44px;display:flex;align-items:center;justify-content:center;padding:0;}
  .hole.hit{background:radial-gradient(circle,#c9e7b5,#d9c3a2 70%);}
  .hole.bad{background:radial-gradient(circle,#f3b8ab,#d9c3a2 70%);}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .card{aspect-ratio:1;border:none;border-radius:12px;font-size:32px;background:#e8a598;color:transparent;padding:0;}
  .card.up,.card.done{background:#fff;color:inherit;}
  .card.done{opacity:.55;}
  .qbox{background:var(--card);border-radius:18px;padding:16px;font-size:19px;line-height:1.45;text-align:center;}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--soft);}
</style>
</head>
<body>
<div class="loading" id="loading">도장 문 여는 중…</div>
<canvas id="c"></canvas>

<div class="top">
  <div class="title"><a class="back" href="./" aria-label="제자 앱으로">‹</a><div><b>레크리에이션</b><span>해랑경희 태권도</span></div></div>
  <div class="right">
    <div class="pill" id="stars">⭐ 0</div>
    <button class="pill" id="soundBtn">소리 켜짐</button>
  </div>
</div>

<div class="hint" id="hint">바닥을 톡 누르면 걸어가요</div>

<div class="bar">
  <button data-act="bow"><i>🙇</i>인사</button>
  <button data-act="kick"><i>🦶</i>발차기</button>
  <button data-act="bag"><i>🥊</i>샌드백</button>
  <button data-act="play"><i>🎮</i>놀이</button>
  <button data-act="dress"><i>🥋</i>꾸미기</button>
</div>

<div class="sheet" id="charSheet">
  <div class="sheetHead"><b>내 캐릭터</b><button class="x" data-close>닫기</button></div>
  <div class="rec">
    <div><b id="rStars">0</b>모은 별</div>
    <div><b id="rRope">0</b>줄넘기 최고</div>
    <div><b id="rBest">0</b>격파 최고</div>
    <div><b id="rTg">-</b>태극 1장</div>
  </div>
  <div class="label">띠</div><div class="chips" id="beltChips"></div>
  <div class="label">머리 색</div><div class="chips" id="hairChips"></div>
  <p class="note">띠는 제자 앱에 있는 내 진짜 띠예요. 승급하면 같이 바뀌어요.</p>
</div>

<div class="sheet" id="gameSheet">
  <div class="sheetHead"><b>격파 놀이</b><button class="x" data-close>그만하기</button></div>
  <div class="gInfo"><span id="gLevel">1단계</span><span id="gBest">최고 기록 0단계</span></div>
  <div class="gauge"><div class="zone" id="zone"></div><div class="needle" id="needle"></div></div>
  <p class="gMsg" id="gMsg">바늘이 초록 칸에 왔을 때 누르세요!</p>
  <button class="big" id="gBtn">격파!</button>
</div>

<div class="sheet" id="playSheet">
  <div class="sheetHead"><b>무엇을 할까요?</b><button class="x" data-close>닫기</button></div>
  <div class="games">
    <div class="gwrap"><button class="game" data-game="rope"><i>🪢</i><b>줄넘기</b><small id="pRope"></small></button><div class="rk" id="rk-rope"></div></div>
    <div class="gwrap"><button class="game" data-game="tg"><i>🥋</i><b>태극 1장</b><small id="pTg"></small></button><div class="rk" id="rk-tg"></div></div>
    <div class="gwrap"><button class="game" data-game="break"><i>🪵</i><b>격파 놀이</b><small id="pBreak"></small></button><div class="rk" id="rk-brk"></div></div>
    <div class="gwrap"><button class="game" data-game="belt"><i>🎗️</i><b>띠 순서</b><small id="pBelt"></small></button><div class="rk" id="rk-belt"></div></div>
    <div class="gwrap"><button class="game" data-game="whack"><i>🎯</i><b>표적 치기</b><small id="pWhack"></small></button><div class="rk" id="rk-whack"></div></div>
    <div class="gwrap"><button class="game" data-game="mem"><i>🃏</i><b>짝 맞추기</b><small id="pMem"></small></button><div class="rk" id="rk-mem"></div></div>
    <div class="gwrap"><button class="game" data-game="quiz"><i>💡</i><b>태권도 퀴즈</b><small id="pQuiz"></small></button><div class="rk" id="rk-quiz"></div></div>
  </div>
</div>

<div class="sheet" id="rankSheet">
  <div class="sheetHead"><b id="rkTitle">이번 달 순위</b><button class="x" id="rkBack">‹ 놀이 목록</button></div>
  <div class="rlist" id="rkList"></div>
  <p class="note" id="rkMe"></p>
</div>

<div class="sheet" id="ropeSheet">
  <div class="sheetHead"><b>줄넘기</b><button class="x" data-close>그만하기</button></div>
  <div class="gInfo"><span>넘은 횟수</span><span id="ropeBest">최고 기록 0번</span></div>
  <div class="bigCount" id="ropeCount">0</div>
  <p class="gMsg" id="ropeMsg">줄이 발밑에 올 때 눌러서 뛰어요. 화면 어디든 눌러도 돼요!</p>
  <button class="big" id="ropeBtn">시작</button>
</div>

<div class="sheet" id="tgSheet">
  <div class="sheetHead"><b>태극 1장 맞추기</b><button class="x" data-close>그만하기</button></div>
  <div class="tgStep" id="tgStep">준비</div>
  <div class="choices" id="tgChoices"></div>
  <p class="gMsg" id="tgMsg" style="margin-bottom:0"></p>
</div>

<div class="panel" id="panel">
  <div class="sheetHead"><b id="pTitle"></b><button class="x" id="pClose">그만하기</button></div>
  <div class="pBody" id="pBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="../notice/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);

/* ---------- 저장 ---------- */
const KEY = 'haerang-dojang-v1';
const DEF = {stars:0, belt:0, hair:0, best:0, hits:0, sound:true, bestRope:0, bestTg:-1, bestBelt:0, bestWhack:0, bestMem:0, bestQuiz:0};
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) { S = Object.assign({}, DEF); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* 띠: 제자 앱이 넘겨준 내 띠(주소 ?b=) — 제자 앱과 같은 색 · 순서 */
const BC = { 흰:'#F4F1EA', 노란:'#F6C21C', 초록:'#2E9E4F', 보라:'#7B4FB8', 파란:'#2F6FDE', 주황:'#F08A24', 분홍:'#F07AA8', 밤:'#6B3E26', 빨간:'#D92D20' };
const MAIN_BELTS = ['흰띠','노란띠','초록띠','보라띠','파란띠','주황띠','분홍띠','밤띠','빨간띠'];
const beltColor = b => { const k = Object.keys(BC).find(x => String(b).startsWith(x)); return k ? BC[k] : '#EEE'; };
function beltLook(b){
  b = String(b || '');
  if(/품/.test(b)) return b === '1품' ? {c:'#1C1A19', k:'#D92D20'} : {c:'#1C1A19', k:'#111111'};
  const c = beltColor(b);
  if(/줄띠/.test(b)) return {c:'#F4F1EA', k:c};
  if(/검은띠/.test(b)) return {c:c, k:'#1C1A19'};
  return {c:c, k:c};
}
let MYBELT = '';
try { MYBELT = new URLSearchParams(location.search).get('b') || ''; } catch(e){}
if(MYBELT) { try { localStorage.setItem('haerang-dojang-belt', MYBELT); } catch(e){} }
else { try { MYBELT = localStorage.getItem('haerang-dojang-belt') || ''; } catch(e){} }
if(!MYBELT) MYBELT = '흰띠';
const LOOK = beltLook(MYBELT);
const HAIRS = [
  {name:'밤색', c:'#4a3426'}, {name:'검정', c:'#262222'}, {name:'갈색', c:'#7a5134'}, {name:'노랑', c:'#d9a94e'}
];

/* ---------- 소리 ---------- */
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); }
function noise(dur, freq, vol){
  if(!AC || !S.sound) return;
  const n = Math.floor(AC.sampleRate*dur), buf = AC.createBuffer(1,n,AC.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 2);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
}
function tone(seq){
  if(!AC || !S.sound) return;
  let t = AC.currentTime;
  seq.forEach(([fr, du]) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type='triangle'; o.frequency.value = fr;
    g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t+du);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+du); t += du*.8;
  });
}
const sfx = {
  hit:   () => noise(.12, 700, .9),
  kick:  () => noise(.08, 1400, .5),
  brk:   () => { noise(.25, 2500, .8); noise(.3, 300, 1); },
  star:  () => tone([[880,.12],[1320,.2]]),
  fail:  () => tone([[440,.15],[330,.25]]),
  pop:   () => tone([[660,.08]]),
  tick:  () => tone([[990,.06]]),
  swish: () => noise(.06, 3000, .25)
};
function setSoundLabel(){ $('soundBtn').textContent = S.sound ? '소리 켜짐' : '소리 꺼짐'; }
setSoundLabel();
$('soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); setSoundLabel(); audio(); sfx.pop(); });

/* ---------- 알림 글자 ---------- */
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1600); }
function updateStars(){ $('stars').textContent = '⭐ ' + S.stars; }
updateStars();

/* ---------- 🏆 이번 달 순위 (2026-11-17) ----------
   서버는 판마다 안 부름: 한 판 끝나면 휴대폰에만 적어 두고(S.mb.q),
   놀이 목록을 열 때(저장 + 순위) · 놀이터에서 나갈 때(저장) · 다음에 열 때(못 보낸 것 저장)만 부름 */
const API = window.HAERANG_PUSH_API || '';
let TOK = ''; try { TOK = localStorage.getItem('haerang-kid-tok') || ''; } catch(e){}
const GAMES = {
  rope: {n:'줄넘기', d:1, f:v => v + '번'},
  tg:   {n:'태극 1장', d:-1, f:v => v === 0 ? '만점' : v + '번 틀림'},
  brk:  {n:'격파 놀이', d:1, f:v => v + '단계'},
  belt: {n:'띠 순서', d:-1, f:v => (v/10).toFixed(1) + '초'},
  whack:{n:'표적 치기', d:1, f:v => v + '점'},
  mem:  {n:'짝 맞추기', d:-1, f:v => v + '번 만에'},
  quiz: {n:'태권도 퀴즈', d:1, f:v => v + '/8'}
};
const nowYm = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,7);

/* 줄 모양: 아래로는 바닥까지, 위로는 머리 위로 크게 넘어가게 */
function setRope(th){
  const c = Math.cos(th), sn = Math.sin(th);
  const dy = -c * (c > 0 ? .9 : 1.65), dz = -sn * .95;
  const pts = [];
  for(let i=0;i<=16;i++){ const t = i/16, b = Math.sin(Math.PI*t); pts.push(new THREE.Vector3(-.87 + 1.74*t, dy*b, dz*b)); }
  ropeMesh.geometry.dispose();
  ropeMesh.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 28, .028, 6, false);
}

function turnDir(d, turn){
  if(turn === 'L') return {x:d.z, z:-d.x};
  if(turn === 'R') return {x:-d.z, z:d.x};
  if(turn === 'B') return {x:-d.x, z:-d.z};
  if(turn === 'S') return {x:0, z:1};
  return d;
}
function playTg(st, done){
  P.act = null;
  const steps = [];
  if(st.kick){ steps.push(() => { doAct('kick', .55, () => sfx.kick(), st.kick); }); }
  steps.push(() => {
    T.dir = turnDir(T.dir, st.turn);
    P.yawT = Math.atan2(T.dir.x, T.dir.z);
    const from = {x:P.root.position.x, z:P.root.position.z};
    const to = {x: from.x + T.dir.x*st.step, z: from.z + T.dir.z*st.step};
    doAct('step', st.step ? .4 : .15, null, 1);
    P.act.from = from; P.act.to = to;
  });
  steps.push(() => {
    doAct(st.t, st.t === 'punch' ? .45 : .55, () => { sfx.hit(); if(st.kihap) floatText('기합!', 2.6); }, st.arm);
    P.act.h = st.h || 0; P.act.lead = st.lead; P.act.deep = !!st.deep;
  });
  let k = 0;
  const run = () => {
    if(!T.on) return;
    if(k >= steps.length) return done();
    steps[k++]();
    if(P.act) P.act.next = run; else run();
  };
  run();
}

const BELT_ORDER = MAIN_BELTS.map((n,i) => i); /* 해랑경희 띠 순서 (제자 앱과 같음) */
function gameBelt(body){
  let next = 0, t0 = 0, pen = 0, timer = null, done = false;
  const stat = el('div','stat','<span>낮은 띠부터 차례대로!</span><span id="bTime">0.0초</span>');
  const slots = el('div','slots');
  BELT_ORDER.forEach((b,i) => slots.appendChild(el('div','slot', String(i+1))));
  const pick = el('div','bpick');
  const msg = el('p','gMsg','흰띠부터 빨간띠까지 눌러요');
  const again = el('button','big','다시 하기'); again.style.display = 'none';
  body.append(stat, slots, pick, msg, again);
  function start(){
    next = 0; pen = 0; done = false; t0 = performance.now(); pick.innerHTML = '';
    [...slots.children].forEach((s,i) => { s.style.background = ''; s.style.borderStyle = 'dashed'; s.textContent = i+1; });
    shuffle(BELT_ORDER.slice()).forEach(bi => {
      const b = el('button','bbtn','<span style="background:'+beltColor(MAIN_BELTS[bi])+'"></span>'+MAIN_BELTS[bi]);
      b.onclick = () => {
        audio(); if(done) return;
        if(bi === BELT_ORDER[next]){
          b.classList.add('used'); const s = slots.children[next];
          s.style.background = beltColor(MAIN_BELTS[bi]); s.style.borderStyle = 'solid'; s.textContent = ''; next++; sfx.tick();
          if(next === BELT_ORDER.length) finish();
        } else { pen += 2; b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); sfx.fail(); msg.textContent = '아니에요! 2초 더해져요'; }
      };
      pick.appendChild(b);
    });
    msg.textContent = '흰띠부터 빨간띠까지 눌러요'; again.style.display = 'none';
    clearInterval(timer);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), -.08);

/* ---------- 화면 크기 ---------- */
let camK = 1;
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  camK = Math.max(1, Math.min(1.5, .7 / camera.aspect));
}
window.addEventListener('resize', resize); resize();
const camT = new THREE.Vector3(0,0,3), camOff = new THREE.Vector3(0, 10.5, 11.5);

/* ---------- 매 장면 ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  P.t += dt;
  const pos = P.root.position;

  /* 걷기 */
  let walking = false;
  if(P.target && !P.act){
    const dx = P.target.x - pos.x, dz = P.target.z - pos.z, d = Math.hypot(dx,dz);
    if(d < .06){
      P.target = null;
      if(P.onArrive){ const f = P.onArrive; P.onArrive = null; f(); }
    } else {
      walking = true;
      const step = Math.min(d, 3.6*dt);
      const nx = {x: pos.x + dx/d*step, z: pos.z + dz/d*step};
      collide(nx);
      const moved = Math.hypot(nx.x-pos.x, nx.z-pos.z);
      P.stuck = moved < step*.3 ? P.stuck + dt : 0;
      pos.x = nx.x; pos.z = nx.z;
      P.yawT = Math.atan2(dx, dz);
      if(P.stuck > .35){ P.target = null; P.onArrive = null; bagBusy = false; }
    }
  }
  P.yaw += angDiff(P.yaw, P.yawT) * Math.min(1, dt*12);
  P.root.rotation.y = P.yaw;

  /* 자세 초기화 */
  legL.rotation.set(0,0,0); legR.rotation.set(0,0,0);
  armL.rotation.set(0,0,0); armR.rotation.set(0,0,0);
  upper.rotation.set(0,0,0); head.rotation.set(0,0,0);
  hips.position.y = .66;

  if(P.act){
    const a = P.act; a.t += dt;
    const p = Math.min(1, a.t / a.dur);
    if(a.type === 'punch'){
      const e = p < .4 ? p/.4 : 1 - (p-.4)/.6;
      const ar = a.side > 0 ? armR : armL, other = a.side > 0 ? armL : armR;
      ar.rotation.x = -1.55*e; other.rotation.x = -.6; other.rotation.z = 0;
      upper.rotation.y = -a.side*.35*e;
      legL.rotation.x = .15; legR.rotation.x = -.15;
      if(p >= .4 && !a.hit){ a.hit = true; a.onHit && a.onHit(); }
    } else if(a.type === 'kick'){
      const e = p < .35 ? p/.35 : 1 - (p-.35)/.65;
      (a.side < 0 ? legL : legR).rotation.x = -1.65*e; upper.rotation.x = -.32*e;
      armL.rotation.x = -.5*e; armR.rotation.x = -.5*e; armL.rotation.z = -.3*e; armR.rotation.z = .3*e;
      if(p >= .35 && !a.hit){ a.hit = true; a.onHit && a.onHit(); }
    } else if(a.type === 'block'){
      const e = p < .3 ? p/.3 : p < .7 ? 1 : 1 - (p-.7)/.3;
      const ar = a.side > 0 ? armR : armL, other = a.side > 0 ? armL : armR, s = a.side;
      if(a.h === 0){ ar.rotation.x = -.35*e; ar.rotation.z = s*.55*e; }
      else if(a.h === 1){ ar.rotation.x = -1.45*e; ar.rotation.z = -s*.25*e; }
      else { ar.rotation.x = -2.75*e; ar.rotation.z = -s*.3*e; }
      other.rotation.x = -.7*e;
      (s > 0 ? legR : legL).rotation.x = -.35*e; (s > 0 ? legL : legR).rotation.x = .25*e;
      if(p >= .3 && !a.hit){ a.hit = true; a.onHit && a.onHit(); }
    } else if(a.type === 'step'){
      P.phase += dt*11; const sw = Math.sin(P.phase);
      legL.rotation.x = sw*.55; legR.rotation.x = -sw*.55; armL.rotation.x = -sw*.35; armR.rotation.x = sw*.35;
      pos.x = a.from.x + (a.to.x - a.from.x)*p; pos.z = a.from.z + (a.to.z - a.from.z)*p;
    } else if(a.type === 'bow'){
      const e = p < .3 ? p/.3 : p < .65 ? 1 : 1 - (p-.65)/.35;
      upper.rotation.x = .62*Math.sin(e*Math.PI/2);
      head.rotation.x = .2*e;
    }
    if(a.lead && (a.type === 'punch' || a.type === 'block')){
      const f = a.lead > 0 ? legR : legL, b2 = a.lead > 0 ? legL : legR;
      f.rotation.x = a.deep ? -.55 : -.3; b2.rotation.x = a.deep ? .4 : .22;
      hips.position.y = a.deep ? .6 : .65;
    }
    if(a.t >= a.dur){ P.act = null; if(a.next) a.next(); }
  } else if(P.mode === 'rope'){
    armL.rotation.z = -.75; armR.rotation.z = .75; armL.rotation.x = -.25; armR.rotation.x = -.25;
    if(P.jt >= 0){ legL.rotation.x = -.3; legR.rotation.x = -.3; }
  } else if(walking){
    P.phase += dt*11;
    const s = Math.sin(P.phase);
    legL.rotation.x = s*.6; legR.rotation.x = -s*.6;
    armL.rotation.x = -s*.55; armR.rotation.x = s*.55;
    hips.position.y = .66 + Math.abs(Math.cos(P.phase))*.06;
  } else {
    hips.position.y = .66 + Math.sin(P.t*2.2)*.012;

    head.rotation.y = Math.sin(P.t*.7)*.12;

  if(P.jt >= 0){

      const prev = R.ang; R.ang += dt * Math.PI*2 * sp;
      const TAU = Math.PI*2;
      if(Math.floor(R.ang/TAU) > Math.floor(prev/TAU)){
        if(pos.y - .08 > .14){
          R.count++; $('ropeCount').textContent = R.count; sfx.tick();
          if(R.count % 10 === 0){ S.stars++; updateStars(); sfx.star(); floatText('⭐ +1', 2.8); save(); }
        } else { R.ang = Math.floor(R.ang/TAU)*TAU; ropeFail(); }
      }
    }
    setRope(R.ang);
  }

  bagState.a += bagState.v * dt;
  bagSwing.rotation.x = bagState.a * .5;

  /* 송판 */
  if(brk.t >= 0){
    brk.t += dt;

      const s = h.userData.side, t = brk.t;
      if(t < .9){
        h.position.set(h.userData.home.x + s*t*1.4, Math.max(.06, h.userData.home.y + 1.2*t - 4.5*t*t), h.userData.home.z - t*.8);

  const tx = Math.max(-3.2, Math.min(3.2, pos.x)), tz = Math.max(-5.5, Math.min(5.5, pos.z));

  camera.position.set(camT.x + camOff.x*camK, camOff.y*camK, camT.z + camOff.z*camK);
  camera.lookAt(camT.x, .9, camT.z - .5);

  /* 떠오르는 글자 */
  for(let i = floats.length-1; i >= 0; i--){
    const f = floats[i]; f.t += dt;
    tmpV.copy(f.p); tmpV.y += f.t*.9; tmpV.project(camera);
    f.el.style.left = ((tmpV.x+1)/2*window.innerWidth) + 'px';
    f.el.style.top = ((1-tmpV.y)/2*window.innerHeight) + 'px';
    f.el.style.opacity = String(Math.max(0, 1 - f.t/1));
    if(f.t > 1){ f.el.remove(); floats.splice(i,1); }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
})();
</script>
