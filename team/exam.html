<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>해랑 승급 심사</title>
<meta name="theme-color" content="#0D326F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 승급 심사 채점 (2026-11-14): 태블릿에서 제자를 넘기며 과목마다 1~5점 → 합격·새 띠. 저장은 업무 서버 exam 표, 마감하면 📈 성장의 띠에 반영 */
:root{--navy:#0D326F;--brand:#A40F16;--paper:#F4F5F8;--card:#fff;--ink:#1B1E24;--muted:#6B7280;--line:#E2E5EB;--ok:#1E7A46;--okbg:#E5F4EA;--warn:#B26A00;--warnbg:#FFF4DC;--sel:#0D326F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;line-height:1.5;overscroll-behavior-y:none;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;font-weight:900;flex:1;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.r{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.45}
.mon{display:flex;align-items:center;gap:2px;font-weight:900}
.mon button{border:0;background:none;font-size:22px;padding:2px 8px;color:var(--navy)}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 90px)}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.nums{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nums b{font-size:20px}
.nums span{font-size:13px;color:var(--muted);margin-right:8px}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok)}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:600}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.kid{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:68px}
.kid b{font-size:16px}
.kid small{color:var(--muted);font-size:12px}
.kid em{font-style:normal;font-size:12px;font-weight:700}
.kid.done{border-color:#9FD3B2;background:#F4FBF6}.kid.done em{color:var(--ok)}
.kid.half{border-color:#BFC8DA}.kid.half em{color:var(--navy)}
.kid.abs{background:#F7F7F7}.kid.abs em{color:var(--muted)}
.kid.todo em{color:var(--brand)}
.gh{margin:14px 2px 0;font-size:14px;color:var(--muted);font-weight:700}
/* 채점 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.who{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.who h2{margin:0;font-size:28px;font-weight:900}
.who small{color:var(--muted);font-size:15px}
.belt{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 6px}
.belt i{width:22px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.15);display:inline-block}
.subj{border-top:1px solid var(--line);padding:12px 0}
.subj:first-of-type{border-top:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh b{font-size:18px}
.sh span{font-size:14px;color:var(--navy);font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:2px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.sc button{border:2px solid var(--line);background:var(--card);border-radius:14px;height:64px;font-size:26px;font-weight:900;color:var(--navy)}
.sc button.on{background:var(--sel);border-color:var(--sel);color:#fff}
.dim .sc,.dim .res{opacity:.35;pointer-events:none}
.res{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pf{display:flex;gap:6px}
.pf button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 18px;font-weight:900;font-size:17px}
.pf button.on.y{background:var(--ok);border-color:var(--ok);color:#fff}
.pf button.on.n{background:var(--brand);border-color:var(--brand);color:#fff}
.res select{border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700;font-size:16px;background:var(--card)}
.help{font-size:13px;color:var(--muted);margin:6px 0 0}
.abs{border:1px dashed var(--muted);background:none;border-radius:10px;padding:8px 12px;font-weight:700;color:var(--muted)}
.abs.on{background:#555;color:#fff;border-style:solid;border-color:#555}
.navb{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;justify-content:center;z-index:5}
.navb[hidden]{display:none}
.navb .btn{flex:1;max-width:240px;padding:14px;font-size:16px}
.saved{font-size:12px;color:var(--muted);text-align:right;min-height:18px;margin-top:6px}
/* 시트 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88svh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet h3{margin:0 0 10px;font-size:19px}
.f{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.sw{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:8px}
.sw input{width:20px;height:20px;accent-color:var(--navy)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.empty{color:var(--muted);text-align:center;padding:30px 0}
@media (min-width:700px){.sc button{height:72px}}
</style></head>
<body>
<div class="top"><button class="btn" id="back">‹ 업무</button><h1>🏅 승급 심사</h1><div class="mon"><button id="mPrev" aria-label="지난달">‹</button><span id="mLbl"></span><button id="mNext" aria-label="다음 달">›</button></div></div>
<div class="wrap" id="main"><p class="empty">불러오는 중…</p></div>
<div class="navb" id="navb" hidden></div>
<script>
const API = window.HAERANG_TEAM_API || '';
const tok = () => { try { return localStorage.getItem('haerang-team-tok') || ''; } catch (e) { return ''; } };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const now = new Date(), thisMonth = now.getFullYear() + '-' + pad(now.getMonth() + 1);
async function api(path, body) {
  try { const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ tok: tok() }, body || {})) }); return await r.json(); }
  catch (e) { return { ok: false, error: '인터넷 연결을 확인해 주세요' }; }
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* 띠 (📈 성장과 같은 순서·규칙): 사이 띠(줄띠·검은띠)는 유치부만, 유치부는 밤띠까지·초등부 이상은 빨간띠까지 자동, 빨간띠·품띠는 직접 고름 */
const BELTS = ['흰띠','노란줄띠','노란띠','초록줄띠','초록띠','초록검은띠','보라띠','보라검은띠','파란띠','파란검은띠','주황띠','주황검은띠','분홍띠','밤띠','빨간띠','1품','2품','3품','4품','5품','6품'];
const STRIPE = ['노란줄띠','초록줄띠','초록검은띠','보라검은띠','파란검은띠','주황검은띠'];
const BCOL = { 흰: '#fff', 노란: '#F6D32D', 초록: '#3BA55C', 보라: '#7E4BC4', 파란: '#2F6FDB', 주황: '#F08A24', 분홍: '#F28AB8', 밤: '#6B3E26', 빨간: '#D62828' };
const beltColor = b => /품$/.test(b) ? 'linear-gradient(90deg,#D62828 50%,#111 50%)' : /검은띠$/.test(b) ? 'linear-gradient(90deg,' + (BCOL[b.slice(0, 2)] || '#ccc') + ' 60%,#111 60%)' : /줄띠$/.test(b) ? 'linear-gradient(180deg,#fff 35%,' + (BCOL[b.slice(0, 2)] || '#ccc') + ' 35%,' + (BCOL[b.slice(0, 2)] || '#ccc') + ' 65%,#fff 65%)' : (BCOL[b.replace(/띠$/, '')] || '#ddd');
const beltTag = b => b ? '<span class="belt"><i style="background:' + beltColor(b) + '"></i>' + esc(b) + '</span>' : '<span class="belt" style="color:var(--muted)">띠 모름</span>';
function nextBelt(cur, kinder) {
  if (!cur) return ''; const i = BELTS.indexOf(cur); if (i < 0 || cur === '빨간띠' || /품$/.test(cur)) return cur;
  const max = BELTS.indexOf(kinder ? '밤띠' : '빨간띠');
  for (let j = i + 1; j <= max; j++) if (kinder || !STRIPE.includes(BELTS[j])) return BELTS[j];
  return cur;
}
const beltList = kinder => kinder ? BELTS : BELTS.filter(b => !STRIPE.includes(b));
function gradeOf(birth) { const y = +String(birth || '').slice(0, 4); if (!y) return ''; const sy = now.getMonth() >= 2 ? now.getFullYear() : now.getFullYear() - 1, g = sy - y - 6;
  return g <= 0 ? '유치부' : g <= 6 ? '초' + g : g <= 9 ? '중' + (g - 6) : g <= 12 ? '고' + (g - 9) : '성인'; }
const groupOf = g => /유치/.test(g) ? '유치부' : /^초/.test(g) ? '초등부' : g ? '중고등부·성인' : '학년 모름';
const GROUPS = ['유치부', '초등부', '중고등부·성인', '학년 모름'];
const WORDS = ['', '다시 해 봐요', '조금 더 노력해요', '보통이에요', '잘해요', '아주 잘해요'];

const S = { month: thisMonth, cfg: null, meta: {}, rows: {}, belts: {}, roster: [], names: {}, view: 'list', sid: null, f: 'all', g: '', q: '', pend: {}, timers: {}, err: '' };
const subjOn = () => (S.cfg ? S.cfg.subj : []).filter(x => x.on);
const kids = () => S.roster.filter(k => k.status !== '퇴관').map(k => { const g = gradeOf(k.birth), b = S.belts[k.id]; return Object.assign({}, k, { grade: g, group: groupOf(g), kinder: b ? b.kinder || /유치/.test(g) : /유치/.test(g), cur: b ? b.belt : '', inGrow: !!b }); })
  .sort((a, b) => GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group) || a.name.localeCompare(b.name, 'ko'));
const kidBy = sid => kids().find(k => k.id === sid);
function dataOf(k) { const r = S.rows[k.id]; if (r) return r.data; return { sc: {}, pass: true, nb: nextBelt(k.cur, k.kinder), cur: k.cur, absent: false, memo: '' }; }
function stateOf(k) { const r = S.rows[k.id]; if (!r) return 'todo'; const d = r.data; if (d.absent) return 'abs'; const n = subjOn().filter(x => d.sc && d.sc[x.k]).length; return n >= subjOn().length ? 'done' : n ? 'half' : 'todo'; }
const SLBL = { todo: '아직', half: '하는 중', done: '끝남', abs: '안 봄' };
const closed = () => !!S.meta.closed;

async function load(full) {
  const j = await api('/api/exam-get', { month: S.month, full: full ? 1 : 0 });
  if (!j.ok) { S.err = j.relogin || /로그인/.test(j.error || '') ? 'login' : (j.error === 'not found' ? '업무 서버를 새로 반영해야 쓸 수 있어요' : j.error || '불러오지 못했어요'); draw(); return; }
  S.err = ''; S.cfg = j.cfg; S.meta = j.meta || {}; S.vid = j.vid || {};
  const rows = {}; j.rows.forEach(r => { rows[r.sid] = r; }); Object.keys(S.pend).forEach(sid => { if (S.rows[sid]) rows[sid] = S.rows[sid]; }); S.rows = rows;
  if (full) { S.belts = j.belts || {}; S.roster = j.roster || []; S.names = j.names || {}; S.rosterErr = j.rosterErr || ''; }
  draw();
}
function save(k, d) { // 누를 때마다 0.5초 뒤 저장 (여러 번 눌러도 한 번)
  S.rows[k.id] = { sid: k.id, name: k.name, data: d, upd: Date.now(), mine: 1 }; S.pend[k.id] = 1; setSaved('저장하는 중…');
  clearTimeout(S.timers[k.id]); S.timers[k.id] = setTimeout(async () => {
    const j = await api('/api/exam-set', { month: S.month, sid: k.id, name: k.name, data: d });
    delete S.pend[k.id];
    if (!j.ok) { toast(j.error || '저장하지 못했어요'); setSaved('⚠ 저장 안 됨'); if (/마감/.test(j.error || '')) load(true); return; }
    setSaved('저장했어요 ✓');
  }, 500);
}
function setSaved(t) { const el = $('#saved'); if (el) el.textContent = t; }

function draw() {
  const [y, m] = S.month.split('-'); $('#mLbl').textContent = y + '년 ' + (+m) + '월'; $('#mNext').style.visibility = S.month >= thisMonth ? 'hidden' : '';
  if (S.err) { $('#navb').hidden = true; $('#main').innerHTML = S.err === 'login' ? '<p class="empty">업무 앱에서 로그인한 뒤 열어 주세요.<br><br><a class="btn p" href="/team/">업무 앱으로</a></p>' : '<p class="empty">' + esc(S.err) + '</p>'; return; }
  if (!S.cfg) return;
  if (S.view === 'card' && S.sid && kidBy(S.sid)) return drawCard();
  S.view = 'list'; drawList();
}
function drawList() {
  $('#navb').hidden = true;
  const L = kids(), st = L.map(stateOf), n = L.length, done = st.filter(x => x === 'done').length, abs = st.filter(x => x === 'abs').length, half = st.filter(x => x === 'half').length;
  const pass = L.filter((k, i) => st[i] === 'done' && dataOf(k).pass !== false).length;
  const noGrow = L.filter(k => !k.inGrow).length, meta = S.meta;
  let h = '';
  if (closed()) { const c = meta.closed; h += '<div class="banner ok">✅ ' + new Date(c.at).toLocaleDateString('ko-KR') + ' ' + esc(c.by) + '님이 마감했어요 · 띠 바뀐 제자 ' + (c.applied || []).length + '명' + ((c.miss || []).length ? ' · 성장 명단에 없어 띠를 못 넣은 제자: ' + esc(c.miss.join(', ')) : '') + '</div>'; }
  if (S.rosterErr) h += '<div class="banner warn">' + esc(S.rosterErr) + '</div>';
  h += '<div class="bar"><div class="nums"><b>' + (done + abs) + '</b><span>/ ' + n + '명 끝남</span><b>' + pass + '</b><span>합격</span>' + (half ? '<b>' + half + '</b><span>하는 중</span>' : '') + (abs ? '<b>' + abs + '</b><span>안 봄</span>' : '') +
    '<span style="flex:1"></span><button class="btn" id="setB">⚙ 이번 달 심사</button></div><div class="prog"><i style="width:' + (n ? Math.round((done + abs) / n * 100) : 0) + '%"></i></div>' +
    (meta.date ? '<p class="help">심사일 ' + esc(meta.date.slice(5).replace('-', '/')) + '</p>' : '') + '</div>';
  if (noGrow) h += '<div class="banner warn">📈 성장 명단에 아직 없는 제자 ' + noGrow + '명은 지금 띠를 몰라요. 📈 성장 화면을 한 번 열면 들어와요.</div>';
  h += '<input class="inp" id="q" placeholder="이름 검색" autocomplete="off" value="' + esc(S.q) + '">';
  h += '<div class="chips" id="fc">' + [['all', '전체'], ['todo', '아직'], ['done', '끝남'], ['abs', '안 봄']].map(([k, t]) => '<button data-f="' + k + '" class="' + (S.f === k ? 'on' : '') + '">' + t + '</button>').join('') + '</div>';
  h += '<div class="chips" id="gc"><button data-g="" class="' + (!S.g ? 'on' : '') + '">모두</button>' + GROUPS.filter(g => L.some(k => k.group === g)).map(g => '<button data-g="' + g + '" class="' + (S.g === g ? 'on' : '') + '">' + g + '</button>').join('') + '</div>';
  const V = visible(L);
  if (!V.length) h += '<p class="empty">' + (n ? '맞는 제자가 없어요' : '출석부 명단이 비어 있어요') + '</p>';
  GROUPS.forEach(g => { const G = V.filter(k => k.group === g); if (!G.length) return; h += '<div class="gh">' + g + ' ' + G.length + '명</div><div class="grid">' + G.map(k => { const s = stateOf(k), d = dataOf(k); const up = s === 'done' && d.pass !== false && d.nb && d.nb !== k.cur;
    return '<button class="kid ' + s + '" data-k="' + esc(k.id) + '"><b>' + esc(k.name) + '</b><small>' + esc(k.grade || '') + ' · ' + esc(k.cur || '띠 모름') + '</small><em>' + (s === 'done' ? (d.pass === false ? '불합격' : up ? '합격 → ' + esc(d.nb) : '합격 · 띠 그대로') : SLBL[s]) + (k.status === '휴원' ? ' · 휴원' : '') + '</em></button>'; }).join('') + '</div>'; });
  h += '<div class="bar" style="margin-top:16px">' + (closed() ? (meta.closed.notified ? '<p class="help" style="margin:0 0 8px">✅ ' + new Date(meta.closed.notified).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' 학부모님께 결과 알림을 보냈어요.</p>' : '<button class="btn p" id="notify" style="margin-bottom:10px">학부모님께 결과 알림 보내기</button>') + '<p class="help" style="margin:0 0 8px">마감을 풀면 이번 심사로 바뀐 띠가 예전 띠로 돌아가요 (그 뒤에 손으로 바꾼 띠는 그대로). 학부모 앱 심사 결과도 다시 마감할 때까지 안 보여요.</p><button class="btn" id="reopen">마감 풀기</button>' :
    '<p class="help" style="margin:0 0 8px">다 채점했으면 마감해 주세요. 마감하면 합격한 제자의 새 띠가 📈 성장에 들어가요.</p><button class="btn r" id="close">심사 마감 · 띠 반영</button>') + '</div>';
  $('#main').innerHTML = h;
  $('#q').oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; drawList(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); };

function visible(L) { const q = S.q.trim(); return L.filter(k => (!S.g || k.group === S.g) && (!q || k.name.includes(q)) && (S.f === 'all' || (S.f === 'todo' ? ['todo', 'half'].includes(stateOf(k)) : stateOf(k) === S.f))); }
function drawCard() {

  h += '<input class="inp" id="memo" style="margin-top:12px" maxlength="300" placeholder="메모 (직원만 보여요)" value="' + esc(d.memo || '') + '"' + (ro ? ' disabled' : '') + '>';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-top:12px"><button class="abs' + (d.absent ? ' on' : '') + '" id="absB"' + (ro ? ' disabled' : '') + '>' + (d.absent ? '✓ 이번 달 안 봄' : '이번 달 안 봄 (결석)') + '</button><span style="flex:1"></span><div class="saved" id="saved">' + (by ? esc(by) + '님이 채점' : '') + '</div></div>';
  h += '</div>';

  if ($('#nb')) $('#nb').onchange = e => { d.nb = e.target.value || (d.cur || k.cur || ''); upd(); };

function sheet(html, init) { const ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = '<div class="sheet">' + html + '</div>'; ov.onclick = e => { if (e.target === ov) ov.remove(); }; document.body.appendChild(ov); init && init(ov); return ov; }

    '<label class="f">과목마다 이번 달 내용 (선택)</label><p class="help" style="margin-top:0">예: 웅변 원고, 영어 문장. 채점 화면에 작게, <b>제자 모드 \'이번 달 심사 준비\'</b>와 학부모 앱 심사 결과에 보여요.</p>' +
    S.cfg.subj.filter(x => x.on).map(x => '<label class="f" style="font-weight:500">' + esc(x.n) + (x.k === 'speech' ? ' 원고' : '') + '</label>' + (x.k === 'speech' || x.k === 'eng' ? '<textarea class="inp" data-n="' + x.k + '" rows="' + (x.k === 'speech' ? 5 : 2) + '" maxlength="' + (x.k === 'speech' ? 1500 : 300) + '"' + (ro ? ' disabled' : '') + '>' + esc(notes[x.k] || '') + '</textarea>' : '<input class="inp" data-n="' + x.k + '" maxlength="300" value="' + esc(notes[x.k] || '') + '"' + (ro ? ' disabled' : '') + '>')).join('') +
    '<label class="f">띠별 품새 영상 (제자 모드에 \'내 띠 품새 영상\'으로, 모든 달 같이)</label><p class="help" style="margin-top:0">유튜브 등 https 주소. 비우면 안 보여요.</p>' +

    '<label class="f">과목 켜기</label>' + S.cfg.subj.filter(x => x.opt).map(x => '<label class="sw"><input type="checkbox" data-o="' + x.k + '"' + (x.on ? ' checked' : '') + (ro ? ' disabled' : '') + '> ' + esc(x.n) + ' 채점하기</label>').join('') +

    };

}
async function closeExam() {

  const j = await api('/api/exam-close', { month: S.month });
  if (!j.ok) return toast(j.error || '마감하지 못했어요');

  if (confirm('학부모님께 \'' + (+S.month.slice(5)) + '월 심사 결과가 나왔어요\' 알림을 보낼까요?\n(이번 달 심사를 본 제자의 보호자에게만, 학부모 앱 성장 리포트 → 심사에서 점수와 결과가 보여요)')) notifyExam();
}
async function notifyExam() { // 6명씩 나눠 보내기 (알림 서버 무료 한도)
  toast('학부모님께 알림 보내는 중…'); let off = 0, sent = 0;
  for (let i = 0; i < 60; i++) { const r = await api('/api/exam-notify', { month: S.month, offset: off }); if (!r.ok) { toast(r.error || '알림을 다 보내지 못했어요'); return load(false); } sent += r.sent || 0; if (!r.next) break; off = r.next; }
  toast('알림을 보냈어요 · ' + sent + '명'); load(false);
}
async function reopenExam() {
