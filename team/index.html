<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<title>해랑 업무</title>
<meta name="theme-color" content="#11655F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="해랑 업무">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--brand:#11655F;--brand2:#0C4D48;--soft:#E3F2EF;--red:#A40F16;--ink:#22201F;--muted:#857C77;--paper:#F5F3F0;--card:#fff;--line:#E5DED8;--chip:#F1ECE8;--ok:#2E6B4A;--no:#B3261E;--yel:#F8F0DA}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,select,textarea{font:inherit;color:var(--ink)}
  .top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
  .top h1{font-size:18px;font-weight:900;margin-right:auto}
  .top small{font-size:12.5px;opacity:.8}
  .top button{color:#fff;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;font-size:13.5px}
  .wrap{max-width:720px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{padding:9px 2px 10px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  nav.tabs button b{font-size:21px;line-height:1;font-weight:400}
  nav.tabs button.on{color:var(--brand);font-weight:700}
  nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:12px;overflow:hidden}
  .card .hd{display:flex;align-items:center;gap:8px;padding:13px 14px 8px}
  .card .hd h2{font-size:16.5px;font-weight:900;margin-right:auto}
  .card .hd small{color:var(--muted);font-size:13px}
  .card .bd{padding:0 14px 14px}
  .lbtn{font-size:13.5px;color:var(--brand);font-weight:700;padding:4px 6px}
  .inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#FAF8F6}
  .inp:focus{outline:2px solid var(--brand);border-color:transparent}
  .row{display:flex;gap:8px;align-items:center}
  .btn{border-radius:12px;padding:10px 16px;font-size:15px;background:var(--chip);white-space:nowrap}
  .btn.g{background:var(--brand);color:#fff;font-weight:700}
  .btn.line{background:#fff;border:1px solid var(--brand);color:var(--brand)}
  .btn.red{background:#fff;border:1px solid var(--red);color:var(--red)}
  .btn:disabled{opacity:.45}
  .big{display:block;width:100%;border-radius:14px;padding:13px;font-size:16px;background:var(--chip);margin-top:10px;text-align:center}
  .big.g{background:var(--brand);color:#fff;font-weight:700}
  ul.l{list-style:none}
  .todo{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid #F0EBE7}
  .todo:first-child{border-top:0}
  .todo .ck{width:24px;height:24px;border-radius:8px;border:2px solid #BDB3AD;flex:none;display:grid;place-items:center;margin-top:1px}
  .todo.done .ck{background:var(--brand);border-color:var(--brand);color:#fff}
  .todo .t{flex:1;min-width:0;cursor:pointer}
  .todo .t b{font-weight:500;font-size:15.5px;display:block;word-break:break-all}
  .todo.done .t b{color:#AAA19B;text-decoration:line-through}
  .todo .t small{font-size:12.5px;color:var(--muted)}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:#6E625D;margin:2px 4px 0 0;font-weight:500;white-space:nowrap}
  .tag.g{background:var(--soft);color:var(--brand)} .tag.r{background:#FBE3E1;color:var(--no)} .tag.y{background:var(--yel);color:#7A5A10}
  .kid{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:7px 11px;margin:4px 4px 0 0;font-size:15px;background:#fff}
  .kid.done{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:700}
  .kid.ab{background:#FBE3E1;border-color:#F0B9B4;color:var(--no);text-decoration:line-through}
  .memo{font-size:14px;padding:6px 10px;background:#FAF8F6;border-radius:10px;margin-top:6px}
  .memo b{color:var(--brand);font-weight:700;margin-right:6px}
  .sch{display:flex;gap:12px;padding:9px 0;border-top:1px solid #F0EBE7;cursor:pointer}
  .sch:first-child{border-top:0}
  .sch .d{width:54px;flex:none;text-align:center;color:var(--brand);font-weight:900;line-height:1.2}
  .sch .d small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
  .sch .t{flex:1}.sch .t b{font-weight:700}.sch .t small{display:block;color:var(--muted);font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:14.5px}
  .notice{background:var(--yel);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14.5px;display:flex;gap:10px;align-items:center}
  .notice b{flex:1}
  /* 채팅 */
  #v-chat{display:flex;flex-direction:column}
  .msgs{padding:6px 0 12px}
  .day{text-align:center;font-size:12.5px;color:var(--muted);margin:14px 0 6px}
  .m{display:flex;flex-direction:column;align-items:flex-start;margin-top:8px;max-width:86%}
  .m.me{align-self:flex-end;align-items:flex-end;margin-left:auto}
  .m .who{font-size:12.5px;color:var(--muted);margin:0 6px 2px}
  .m .bub{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:15.5px;white-space:pre-wrap;word-break:break-word}
  .m.me .bub{background:var(--brand);color:#fff;border-color:var(--brand);border-radius:16px 4px 16px 16px}
  .m .time{font-size:11px;color:#A79E99;margin:2px 6px 0}
  .m .ph{width:220px;max-width:70vw;border-radius:14px;background:#E8E2DD;min-height:120px;display:block;object-fit:cover;cursor:pointer}
  .ht{font-weight:700;text-decoration:underline;cursor:pointer;color:var(--brand)}
  .m.me .ht{color:#fff}
  .refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .refs button{font-size:12.5px;background:var(--soft);color:var(--brand);border-radius:99px;padding:3px 10px;font-weight:700}
  .refs button.add{background:#fff;border:1px dashed var(--brand)}
  .composer{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));background:var(--paper);padding:8px 0 4px}
  .tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .tags::-webkit-scrollbar{display:none}
  .tags button{flex:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:14px;color:var(--brand);font-weight:700}
  .cbox{display:flex;gap:6px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:22px;padding:5px 5px 5px 8px}
  .cbox textarea{flex:1;border:0;outline:0;resize:none;font-size:16px;max-height:120px;padding:6px 4px;background:none;line-height:1.4}
  .cbox .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--muted);flex:none}
  .cbox .send{background:var(--brand);color:#fff;font-size:17px}
  .hint{font-size:12.5px;color:var(--muted);margin:5px 6px 0}
  /* 달력 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 10px 10px}
  .cal .w{text-align:center;font-size:12.5px;color:var(--muted);padding:4px 0}
  .cal button{min-height:52px;border-radius:12px;font-size:14.5px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:3px}
  .cal button.sel{background:var(--soft);color:var(--brand);font-weight:700}
  .cal button.td{outline:2px solid var(--brand)}
  .cal button.out{color:#CFC7C2}
  .cal button i{display:flex;gap:2px}.cal button i span{width:6px;height:6px;border-radius:50%;background:var(--brand)}
  .cal button i span.t{background:#C9A227}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#ECE6E1;border-radius:14px;padding:4px;gap:4px;margin-top:4px}
  .seg button{padding:9px;border-radius:10px;font-size:15px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .ev{padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
  .ev b{font-size:16.5px;font-weight:900}.ev small{display:block;color:var(--muted);font-size:13.5px}
  /* 시트 */
  .ov{position:fixed;inset:0;background:rgba(20,30,28,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;animation:up .16s ease-out}
  .sheet.full{max-height:100vh;height:100vh;border-radius:0;padding-top:0}
  .sheet.full .shead{position:sticky;top:0;z-index:5;background:#fff;margin:0 -16px 8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h2{font-size:21px;font-weight:900;margin-bottom:4px}
  .sheet h3{font-size:15px;font-weight:900;margin:20px 0 8px}
  .sheet .f{display:block;font-size:13.5px;color:var(--muted);margin:14px 0 6px}
  .sheet .help{font-size:13px;color:var(--muted);margin-top:5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:7px 12px;font-size:14.5px}
  .chips button.on{border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:700}
  .chips button.off{color:#BDB3AD}
  .foot{display:flex;gap:8px;margin-top:20px;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:#fff;padding:10px 0 4px}
  .foot .sp{flex:1}
  .foot button{border-radius:14px;padding:12px 18px;font-size:16px;background:var(--chip)}
  .foot .save{background:var(--brand);color:#fff;font-weight:700}
  .foot .del{background:#fff;border:1px solid var(--red);color:var(--red)}
  .cm{list-style:none;margin-top:6px}
  .cm li{padding:8px 0;border-top:1px solid #F0EBE7;font-size:14.5px}
  .cm li b{color:var(--brand);margin-right:6px}.cm li small{color:var(--muted);font-size:12px;margin-left:6px}
  .shead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .shead h2{flex:1;margin:0}
  .sumbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .sumbar div{background:#FAF8F6;border-radius:12px;padding:8px 10px}
  .sumbar small{display:block;font-size:12px;color:var(--muted)}.sumbar b{font-size:18px;font-weight:900}
  .er{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
  .er.wait{background:#FAF8F6;border-style:dashed}
  .er .h{display:flex;align-items:center;gap:8px}
  .er .h b{font-size:16px;font-weight:900;flex:1}
  .er .h .amt{font-weight:900;color:var(--brand)}
  .er .sub{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
  .er .sub select{border:1px solid var(--line);border-radius:10px;padding:4px 6px;font-size:14px;background:#fff}
  .tg{border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:13.5px;background:#fff;color:var(--muted)}
  .tg.on{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:700}
  .tg.pay.on{background:var(--brand);color:#fff}
  .er input.memo2{border:0;border-bottom:1px solid var(--line);font-size:14px;padding:4px 2px;width:100%;margin-top:6px;outline:0}
  .br{display:flex;gap:6px;align-items:center;padding:7px 0;border-top:1px solid #F0EBE7}
  .br input{border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-size:15px;min-width:0}
  .br .ck{width:26px;height:26px;border-radius:8px;border:2px solid #BDB3AD;flex:none;display:grid;place-items:center}
  .br.done .ck{background:var(--brand);border-color:var(--brand);color:#fff}
  .br.done input.n{text-decoration:line-through;color:#AAA19B}
  .defrow{display:flex;align-items:flex-start;gap:8px;margin-top:8px}.defrow b{width:24px;flex:none;padding-top:6px}
  .login{max-width:420px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top)) 22px 40px;text-align:center}
  .login img{width:84px;height:84px;border-radius:22px}
  .login h1{font-size:25px;font-weight:900;margin-top:14px}
  .login p{color:var(--muted);font-size:14.5px;margin-top:4px}
  .login .chips{justify-content:center;margin-top:22px}
  .dots{display:flex;justify-content:center;gap:14px;margin:24px 0 8px}
  .dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--brand)}.dots i.on{background:var(--brand)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:16px auto 0}
  .keys button{height:60px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:24px}
  .msg{color:var(--no);font-size:14.5px;min-height:22px;margin-top:8px}
  .viewer{position:fixed;inset:0;background:#000;z-index:80;display:grid;place-items:center}
  .viewer img{max-width:100%;max-height:100%}
  .toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#22201F;color:#fff;font-size:14.5px;padding:10px 18px;border-radius:99px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>

<section class="login" id="loginView" hidden>
  <img src="icon-192.png" alt="">
  <h1>해랑 업무</h1>
  <div id="loginBody"></div>
</section>

<div id="app" hidden>
  <header class="top"><h1 id="topT">해랑 업무</h1><small id="conn"></small><button id="setBtn">설정</button></header>
  <main class="wrap">
    <section id="v-home"></section>
    <section id="v-chat" hidden><div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="tags" id="tagBar"><button data-t="#일정 ">#일정</button><button data-t="#할일 ">#할일</button><button data-t="#등원 ">#등원</button><button data-t="#구매 ">#구매</button><button data-t="#행사 ">#행사</button></div>
        <div class="cbox"><button class="ic" id="phBtn" title="사진">＋</button><textarea id="cIn" rows="1" placeholder="메시지 (#일정 11/20 3시 승급심사)"></textarea><button class="ic send" id="cSend">↑</button></div>
        <div class="hint" id="cHint"></div>
        <input type="file" id="phIn" accept="image/*" hidden>
      </div>
    </section>
    <section id="v-sched" hidden></section>
    <section id="v-table" hidden></section>
  </main>
  <nav class="tabs" id="tabs">
    <button data-t="home" class="on"><b>⌂</b>홈</button>
    <button data-t="chat"><b>💬</b>채팅<span class="dot" id="chatDot" hidden></span></button>
    <button data-t="sched"><b>▦</b>일정</button>
    <button data-t="table"><b>☰</b>표</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(() => {
'use strict';
const API = (window.HAERANG_TEAM_API || '').replace(/\/$/, '');
const TOKK = 'haerang-team-tok';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600); };
const won = n => (Math.round(+n || 0)).toLocaleString('ko-KR') + '원';

// ───── 날짜 ─────
const DOW = '일월화수목금토', WEEK = ['월', '화', '수', '목', '금'];
const kNow = () => new Date(Date.now() + 9 * 3600e3);
const today = () => kNow().toISOString().slice(0, 10);
const dObj = d => new Date(d + 'T00:00:00Z');
const wd = d => DOW[dObj(d).getUTCDay()];
const addDays = (d, n) => new Date(dObj(d).getTime() + n * 864e5).toISOString().slice(0, 10);
const addMonth = (m, n) => { const [y, mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo - 1 + n, 1)).toISOString().slice(0, 7); };
const md = d => (+d.slice(5, 7)) + '/' + (+d.slice(8)) + '(' + wd(d) + ')';
const hm = ts => { const k = new Date(ts + 9 * 3600e3); const h = k.getUTCHours(), m = k.getUTCMinutes(); return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + String(m).padStart(2, '0'); };
const dayOf = ts => new Date(ts + 9 * 3600e3).toISOString().slice(0, 10);
const timeKo = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + '시' + (m ? ' ' + m + '분' : ''); };

// 글 속 날짜·시간 찾기: 11/20, 11월 20일, 20일, 오늘·내일·모레, (다음주) 화요일, 3시, 오후 3시 30분, 15:00
function parseWhen(text, base = today()) {
  let s = text, date = '', time = '', rel = false;
  const y = +base.slice(0, 4), mo = +base.slice(5, 7);
  const mk = (yy, mm, dd) => { const d = new Date(Date.UTC(yy, mm - 1, dd)); return d.getUTCMonth() === mm - 1 ? d.toISOString().slice(0, 10) : ''; };
  const take = (re, fn) => { if (date) return; const m = s.match(re); if (m) { const d = fn(m); if (d) { date = d; s = s.replace(m[0], ' '); } } };
  take(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/, m => mk(+m[1], +m[2], +m[3]));
  take(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/, m => { let d = mk(y, +m[1], +m[2]); if (d && d < addDays(base, -60)) d = mk(y + 1, +m[1], +m[2]); return d; });
  take(/(?<![\d:])(\d{1,2})\/(\d{1,2})(?![\d:])/, m => { let d = mk(y, +m[1], +m[2]); if (d && d < addDays(base, -60)) d = mk(y + 1, +m[1], +m[2]); return d; });
  take(/(오늘|내일|모레|글피)/, m => { rel = true; return addDays(base, { 오늘: 0, 내일: 1, 모레: 2, 글피: 3 }[m[1]]); });
  take(/(다음\s*주|담주|이번\s*주|이번주)?\s*([월화수목금토일])요일/, m => { const target = DOW.indexOf(m[2]); const cur = dObj(base).getUTCDay(); let diff = (target - cur + 7) % 7; const mon = addDays(base, -((cur + 6) % 7)); if (m[1] && /다음|담/.test(m[1])) return addDays(mon, 7 + (target + 6) % 7); if (m[1]) return addDays(mon, (target + 6) % 7); return addDays(base, diff); });
  take(/(?<![\d\/])(\d{1,2})\s*일(?![\d])/, m => { let d = mk(y, mo, +m[1]); if (d && d < base) d = mk(mo === 12 ? y + 1 : y, mo === 12 ? 1 : mo + 1, +m[1]); return d; });

// 해시태그 → 할 일·일정·구매·등원
async function buildFromTags(text) {
  const items = [], pickups = [], absences = [], skip = [];
  const body = text.replace(/#(일정|할일|등원|구매|행사)/g, ' ').replace(/\s+/g, ' ').trim();
  if (/#일정/.test(text)) { const w = parseWhen(body); if (w.date) items.push({ type: 'sched', title: (w.rest || '일정').slice(0, 80), date: w.date, time: w.time, memo: '' }); else skip.push('날짜를 못 찾아 일정은 등록하지 않았어요'); }
  if (/#할일/.test(text)) { const w = parseWhen(body); items.push({ type: 'todo', title: (w.rest || body).slice(0, 80), due: w.date, done: false }); }
  if (/#구매/.test(text)) {
    const list = itemsOf('buy').filter(b => !b.closed).sort((a, b) => b.upd - a.upd)[0] || { type: 'buy', title: '구매 목록', rows: [] };
    const add = body.split(/[,，\n]/).map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(.*?)\s*(\d+)\s*(개|장|벌|박스|세트|ea)?$/); return { n: (m ? m[1] : x).slice(0, 40) || x, qty: m ? +m[2] : 1, price: '', who: '', done: false, memo: '' }; });
    if (add.length) items.push({ ...list, rows: [...(list.rows || []), ...add] });
  }
  if (/#등원/.test(text)) {
    await loadRoster(); const w = parseWhen(body), d = w.date || today(), p = JSON.parse(JSON.stringify(pickupFor(d)));
    const known = [...new Set([...S.roster, ...p.list, ...Object.values(S.pickupDefault).flat()])].sort((a, b) => b.length - a.length);
    const found = []; let rest = body; for (const n of known) if (rest.includes(n)) { found.push(n); rest = rest.split(n).join(' '); }
    const isAbsent = /결석|안\s*와|못\s*와|쉬어|빠져/.test(body);
    for (const n of found) { if (isAbsent) { if (!p.absent.includes(n)) p.absent.push(n); p.done = p.done.filter(x => x !== n); absences.push({ name: n, date: d, why: '연락옴' }); } else if (!p.list.includes(n)) p.list.push(n); }
    p.memos = [...(p.memos || []), { who: S.me.name, text: body, at: Date.now() }]; p.day = d; pickups.push(p);
    S.pickup.set(d, { ...p, upd: Date.now() });
  }
  return { items, pickups, absences, skip };
}

$('phIn').onchange = async e => {

  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
  const shrink = (max, qual) => { const r = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', qual).split(',')[1]; };
  const j = await api('/api/photo-up', { full: shrink(1400, .8), thumb: shrink(400, .7) });
  if (!j.ok) return toast(j.error || '사진을 올리지 못했어요');

  if (!j.members.some(m => m.id === mid)) mid = '';
  body.innerHTML = '<p>이름을 고르고 PIN을 눌러 주세요.</p><div class="chips" id="lgT">' + j.members.map(m => '<button data-v="' + m.id + '" class="' + (m.id === mid ? 'on' : '') + '">' + esc(m.name) + '</button>').join('') + '</div><div class="dots" id="lgD"></div><div class="msg" id="lgM"></div><div class="keys" id="lgP">' + '123456789'.split('').map(n => '<button data-n="' + n + '">' + n + '</button>').join('') + '<button data-n="ok" style="font-size:16px">확인</button><button data-n="0">0</button><button data-n="del" style="font-size:16px">지우기</button></div>';
  const dots = () => { $('lgD').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => '<i class="' + (i < pin.length ? 'on' : '') + '"></i>').join(''); }; dots();
  $('lgT').onclick = e => { const b = e.target.closest('button'); if (!b) return; mid = b.dataset.v; $('lgT').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); $('lgM').textContent = ''; };
  const go = async () => { if (!mid) { $('lgM').textContent = '이름을 먼저 골라 주세요'; return; } const r = await fetch(API + '/api/login', { method: 'POST', body: JSON.stringify({ mid, pin }) }).then(r => r.json()).catch(() => ({ error: '서버에 연결하지 못했어요' })); if (!r.ok) { $('lgM').textContent = r.error; pin = ''; dots(); return; } try { localStorage.setItem('haerang-team-last', mid); } catch (_) {} loggedIn(r.tok); };
  $('lgP').onclick = e => { const b = e.target.closest('button'); if (!b) return; const n = b.dataset.n; if (n === 'del') pin = pin.slice(0, -1); else if (n === 'ok') return go(); else if (pin.length < 6) pin += n; dots(); if (pin.length === 6) go(); };
  document.onkeydown = e => { if ($('loginView').hidden) return; if (/^\d$/.test(e.key) && pin.length < 6) { pin += e.key; dots(); } else if (e.key === 'Backspace') { pin = pin.slice(0, -1); dots(); } else if (e.key === 'Enter') go(); };
}
async function loggedIn(tok) {
  S.tok = tok; try { localStorage.setItem(TOKK, tok); } catch (_) {}
  $('loginView').hidden = true;
  if (!(await sync(true))) return showLogin();
  $('app').hidden = false; const h = location.hash.slice(1); setTab(TITLES[h] ? h : 'home'); loadRoster();
}
(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  let tok = ''; try { tok = localStorage.getItem(TOKK) || ''; } catch (_) {}
  if (tok && API) { S.tok = tok; if (await sync(true)) { $('app').hidden = false; const h = location.hash.slice(1); setTab(TITLES[h] ? h : 'home'); loadRoster(); return; } S.tok = ''; }
  showLogin();
})();
})();
</script>
