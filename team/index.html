<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<title>해랑 업무</title>
<meta name="theme-color" content="#0D326F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="해랑 업무">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--brand:#0D326F;--brand2:#09244F;--brand3:#1E4C97;--soft:#E8EEF8;--soft2:#D3DEF1;--red:#A40F16;--ink:#1D2330;--muted:#7B8294;--paper:#F3F5F9;--card:#fff;--line:#E2E6EE;--chip:#EEF1F6;--ok:#1E8A5A;--okbg:#DDF3E7;--no:#C62828;--nobg:#FCE4E4;--org:#E0861F;--yel:#FFF5D9}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,select,textarea{font:inherit;color:var(--ink)}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  /* 위 띠 */
  .top{position:sticky;top:0;z-index:20;background:#fff;color:var(--ink);padding:env(safe-area-inset-top) 8px 0 16px;display:flex;align-items:center;gap:2px;height:calc(58px + env(safe-area-inset-top))}
  #topBtns{display:flex;gap:2px}
  .top h1{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top small{font-size:12px;opacity:.75;margin-right:6px}
  .top .tb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
  .top h1 em{font-style:normal;color:#A0A6B4;font-weight:700;margin-left:6px}
  .top .tb.txt{width:auto;padding:0 10px;font-size:14px;font-weight:700;border:1px solid var(--line);height:32px;border-radius:99px}
  body.chatmode .top{background:var(--brand);color:#fff}body.chatmode .top .tb{color:#fff}body.chatmode .top h1{font-size:18px;font-weight:700}
  .top .tb:active{background:rgba(255,255,255,.14)}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px calc(150px + env(safe-area-inset-bottom))}
  /* 아래 탭 */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#FBFCFE;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{padding:8px 2px 8px;font-size:11.5px;color:#9AA1B0;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  nav.tabs button svg.i{width:25px;height:25px;stroke-width:1.6}
  nav.tabs button.on{color:var(--brand);font-weight:700}
  nav.tabs button.on svg.i{stroke-width:2.1}
  .dot{position:absolute;top:4px;left:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;line-height:1}
  .fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:50%;background:linear-gradient(140deg,#2A5BB0,var(--brand) 70%);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(13,50,111,.35)}
  .fab svg.i{width:28px;height:28px;stroke-width:2.2}
  /* 홈 머리 (플로우 프로젝트 머리처럼) */
  .hero{background:var(--brand);color:#fff;margin:0 -14px;padding:4px 18px 20px}
  .hero small{display:block;font-size:13px;opacity:.75}
  .hero h2{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:1px}
  .hero p{font-size:13.5px;opacity:.85;margin-top:6px;display:flex;align-items:center;gap:6px}
  .avs{display:flex;margin-top:10px}.avs .av{margin-right:-6px;border:2px solid var(--brand)}
  .av{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;color:#fff;font-size:12.5px;font-weight:700;flex:none;letter-spacing:-.5px}
  .av.s{width:28px;height:28px;border-radius:10px;font-size:11px}
  .av.l{width:46px;height:46px;border-radius:50%;font-size:15px}
  /* 카드 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
  .card .hd{display:flex;align-items:center;gap:6px;padding:14px 14px 8px}
  .card .hd h2{font-size:16.5px;font-weight:700;margin-right:auto}
  .card .hd h2 em{font-style:normal;color:var(--muted);font-weight:500;margin-left:5px}
  .card .hd small{color:var(--muted);font-size:13px}
  .card .bd{padding:0 14px 14px}
  .lbtn{font-size:13.5px;color:var(--brand);font-weight:700;padding:4px 6px}
  .inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#F8F9FC}
  .inp:focus{outline:2px solid var(--brand);border-color:transparent;background:#fff}
  .row{display:flex;gap:8px;align-items:center}
  .btn{border-radius:12px;padding:10px 16px;font-size:15px;background:var(--chip);white-space:nowrap}
  .btn.g{background:var(--brand);color:#fff;font-weight:700}
  .btn.line{background:#fff;border:1px solid var(--brand);color:var(--brand)}
  .btn.red{background:#fff;border:1px solid var(--red);color:var(--red)}
  .btn:disabled{opacity:.45}
  .big{display:block;width:100%;border-radius:14px;padding:13px;font-size:16px;background:var(--chip);margin-top:10px;text-align:center}
  .big.g{background:var(--brand);color:#fff;font-weight:700}
  ul.l{list-style:none}
  /* 상단고정 */
  .pin{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
  .pin .k{font-size:14px;font-weight:700;color:#5B6FD8;width:38px;flex:none}
  .pin .k.n{color:var(--red)}
  .pin .t{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{flex:none;font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--soft);color:var(--brand)}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.ok::before{content:'● ';font-size:10px}
  .pill.b{background:#1E9BEF;color:#fff}
  .pill.r{background:var(--nobg);color:var(--no)}
  /* 할 일 */
  .todo{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid #EEF0F5}
  .todo:first-child{border-top:0}
  .todo .ck{width:24px;height:24px;border-radius:8px;border:2px solid #B9C0CE;flex:none;display:grid;place-items:center;margin-top:1px;color:#fff;font-size:14px}
  .todo.done .ck{background:var(--brand);border-color:var(--brand)}
  .todo .t{flex:1;min-width:0;cursor:pointer}
  .todo .t b{font-weight:500;font-size:15.5px;display:block;word-break:break-all}
  .todo.done .t b{color:#A5ACBA;text-decoration:line-through}
  .todo .t small{font-size:12.5px;color:var(--muted)}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:#5D6578;margin:2px 4px 0 0;font-weight:500;white-space:nowrap}
  .tag.g{background:var(--soft);color:var(--brand)} .tag.r{background:var(--nobg);color:var(--no)} .tag.y{background:var(--yel);color:#7A5A10}
  .kid{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:7px 11px;margin:4px 4px 0 0;font-size:15px;background:#fff;-webkit-user-select:none;user-select:none}
  .kid.done{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:700}
  .kid.ab{background:var(--nobg);border-color:#F1B8B8;color:var(--no);text-decoration:line-through}
  .memo{font-size:14px;padding:6px 10px;background:#F6F7FA;border-radius:10px;margin-top:6px}
  .memo b{color:var(--brand);font-weight:700;margin-right:6px}
  /* 일정 (달력 아이콘 모양) */
  .sch{display:flex;gap:12px;padding:10px 0;border-top:1px solid #EEF0F5;cursor:pointer;align-items:center}
  .sch:first-child{border-top:0}
  .dbox{width:52px;flex:none;border:1.5px solid #19A389;border-radius:10px;overflow:hidden;text-align:center;line-height:1.15}
  .dbox small{display:block;background:#19A389;color:#fff;font-size:11px;font-weight:700;padding:2px 0}
  .dbox b{display:block;font-size:20px;font-weight:500;color:#13806C;padding:3px 0 2px}
  .dbox.td{border-color:var(--brand)}.dbox.td small{background:var(--brand)}.dbox.td b{color:var(--brand)}
  .dbox.tdo{border-color:#C9A227}.dbox.tdo small{background:#C9A227}.dbox.tdo b{color:#8D7016;font-size:15px;padding:6px 0 5px}
  .sch .t{flex:1;min-width:0}.sch .t b{font-weight:700;display:block}.sch .t small{display:block;color:var(--muted);font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:14.5px}
  .notice{background:var(--yel);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14.5px;display:flex;gap:10px;align-items:center}
  .notice b{flex:1;font-weight:500}
  /* 채팅 */
  #v-room{display:flex;flex-direction:column}
  #nbar{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:15;margin:0 -14px}
  .nbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;box-shadow:0 2px 6px rgba(20,30,60,.05)}
  .nbar svg.i{color:var(--brand);width:20px;height:20px}
  .nbar span{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
  .nbar small{color:var(--muted);font-size:12px;flex:none}
  body.chatmode .wrap{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .msgs{padding:4px 0 12px;display:flex;flex-direction:column}
  .day{align-self:center;font-size:13px;color:#fff;background:#9097A6;border-radius:99px;padding:3px 14px;margin:16px 0 6px}
  .m{display:flex;gap:8px;margin-top:10px;max-width:100%}
  .m.cont{margin-top:3px}
  .m .avw{width:36px;flex:none}
  .m .col{min-width:0;display:flex;flex-direction:column;align-items:flex-start;max-width:calc(100% - 44px)}
  .m .who{font-size:13px;color:#4B5263;margin:0 2px 3px;font-weight:500}
  .m .ln{display:flex;align-items:flex-end;gap:6px;max-width:100%}
  .m.me{justify-content:flex-end}
  .m.me .col{align-items:flex-end;max-width:84%}
  .m.me .ln{flex-direction:row-reverse}
  .bub{background:#fff;border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:8px 13px;font-size:15.5px;white-space:pre-wrap;word-break:break-word;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .m.cont .bub{border-radius:18px}
  .m.me .bub{background:var(--brand);color:#fff;border-color:var(--brand);border-radius:18px 4px 18px 18px}
  .m.me.cont .bub{border-radius:18px}
  .bub.gone{background:#EEF0F4!important;color:#8C93A3!important;border-color:#EEF0F4!important;display:flex;gap:6px;align-items:center}
  .bub.gone i{width:18px;height:18px;border-radius:50%;background:#8C93A3;color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center;font-weight:700}
  .bub a{color:inherit;text-decoration:underline;word-break:break-all;-webkit-user-select:auto}
  .tm{font-size:11px;color:#A0A6B4;white-space:nowrap;flex:none;padding-bottom:2px}
  .ph{width:220px;max-width:62vw;border-radius:16px;background:#E5E9F0;min-height:120px;display:block;object-fit:cover;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .rq{display:block;border-left:3px solid #9DB2DA;padding:1px 8px;margin:2px 0 6px;font-size:13px;color:#5D6578;cursor:pointer;max-width:260px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .m.me .rq{border-color:rgba(255,255,255,.55);color:rgba(255,255,255,.85)}
  .rq b{font-weight:700;margin-right:4px}
  .rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .rxs button{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;display:flex;gap:3px;align-items:center}
  .rxs button.mine{border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:700}
  .ht{font-weight:700;text-decoration:underline;cursor:pointer;color:var(--brand)}
  .m.me .ht{color:#fff}
  .refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .refs button{font-size:12.5px;background:var(--soft);color:var(--brand);border-radius:99px;padding:3px 10px;font-weight:700}
  .refs button.add{background:#fff;border:1px dashed var(--brand)}
  .m.flash .bub{animation:flash 1.4s}
  @keyframes flash{0%,40%{box-shadow:0 0 0 4px #F6C344}100%{box-shadow:none}}
  .composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:#fff;margin:0 -14px;padding:6px 10px 8px;border-top:1px solid var(--line)}
  .tags{display:flex;gap:6px;overflow-x:auto;padding:0 2px 6px;scrollbar-width:none}
  .tags::-webkit-scrollbar{display:none}
  .tags button{flex:none;background:var(--soft);border-radius:99px;padding:3px 11px;font-size:13.5px;color:var(--brand);font-weight:700}
  .rbar{display:flex;gap:8px;align-items:center;background:#F4F6FA;border-radius:12px;padding:6px 10px;margin-bottom:6px;font-size:13.5px}
  .rbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4B5263}
  .rbar b{color:var(--brand)}
  /* 입력줄 (카톡처럼 둥근 한 줄: + | 글 | # | 보내기) */
  .cbox{display:flex;align-items:flex-end;gap:6px;background:#F1F3F8;border:1px solid var(--line);border-radius:24px;padding:4px}
  .cbox .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#4B5263;flex:none}
  .cbox .ic.plus{background:#fff;border:1px solid var(--line)}
  .cbox .ic.plus svg.i{width:20px;height:20px}
  .cbox .ic.hash{font-size:20px;font-weight:700;color:#4B5263}
  .cbox .ic.hash.on{background:var(--soft);color:var(--brand)}
  .cbox textarea{flex:1;border:0;outline:0;resize:none;font-size:16px;max-height:120px;padding:8px 2px;background:none;line-height:1.4;min-width:0}
  .cbox .send{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
  .tb.back{margin-left:-10px}
  /* 채팅 화면: 위 띠 + 대화(가운데만 스크롤) + 입력줄. 키보드가 뜨면 입력줄이 키보드 바로 위로 */
  body.chatmode{overflow:hidden;overscroll-behavior:none}
  body.chatmode .top{position:fixed;left:0;right:0;top:var(--vt,0px)}
  body.chatmode nav.tabs,body.chatmode .fab{display:none}
  body.chatmode .wrap{padding:0}
  body.chatmode #v-room{position:fixed;left:0;right:0;max-width:720px;margin:0 auto;top:calc(var(--vt,0px) + 58px + env(safe-area-inset-top));height:calc(var(--vh,100dvh) - 58px - env(safe-area-inset-top));display:flex;flex-direction:column;background:var(--paper)}
  body.chatmode #nbar{position:static;margin:0}
  body.chatmode .msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 14px 12px}
  body.chatmode .msgs>:first-child{margin-top:auto}
  body.chatmode .composer{position:static;margin:0;padding:6px 10px calc(8px + var(--sb,env(safe-area-inset-bottom)))}
  .hint{font-size:12.5px;color:var(--muted);margin:5px 6px 0}
  /* 필터 알약 (플로우) */
  .pills{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pills button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font-size:15px;color:var(--muted);font-weight:500}
  .pills button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  /* 채팅방 목록 */
  .room{display:flex;gap:12px;align-items:center;padding:12px 0;cursor:pointer}
  .av.rm{width:52px;height:52px;border-radius:18px;font-size:16px}
  .av.grp{background:var(--brand)}
  .room .rt{flex:1;min-width:0}.room .rt b{display:block;font-size:17px;font-weight:700}.room .rt b em{font-style:normal;color:#A0A6B4;font-weight:500;font-size:14px}
  .room .rt small{display:block;color:var(--muted);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .room .rr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}.room .rr small{color:#A0A6B4;font-size:12.5px}
  .cnt{background:var(--red);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
  /* 업무 목록 (플로우 전체 업무) */
  .qadd{display:flex;gap:8px;margin:4px 0 10px}
  .grp{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .gh{display:flex;align-items:center;gap:8px;background:#F7F8FA;padding:11px 14px;font-weight:700;font-size:15.5px;border-bottom:1px solid var(--line)}
  .tk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid #EEF0F5;cursor:pointer;position:relative}
  .gh+.tk{border-top:0}
  .tk .cbar{width:4px;align-self:stretch;border-radius:2px;flex:none}
  .tk .tt{flex:1;min-width:0}.tk .tt b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tk .tt b em{font-style:normal;color:var(--muted);font-weight:500}
  .tk .tt small{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13.5px;margin-top:2px}
  .tk .tt small .late{color:var(--no);font-weight:700}
  .tk.done .tt b{color:#A5ACBA;text-decoration:line-through}
  .st{flex:none;font-size:14px;font-weight:700;border-radius:8px;padding:4px 12px;display:inline-flex;align-items:center;gap:5px}
  .st::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
  .st.s0{background:#D9F0FC;color:#0B8BD0}.st.s1{background:#DDF3D8;color:#2E8B1E}.st.s2{background:#E6E3FA;color:#5B47C9}.st.sch2{background:#DDF3EE;color:#13806C}
  .avs2{display:inline-flex}.avs2 .av{margin-right:-5px;border:1.5px solid #fff}
  .av.xs{width:22px;height:22px;border-radius:50%;font-size:9.5px}
  /* 업무 상세 */
  .shead.lt{position:sticky;top:0;z-index:5;background:#fff;margin:0 -16px 4px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px}
  .sheet.full .shead.lt{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
  .shead.lt .sp{flex:1}.shead .tb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
  .donebtn{font-size:15px;font-weight:700;color:var(--muted);padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
  .donebtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .ttl{width:100%;border:0;outline:0;font-size:22px;font-weight:900;padding:6px 0 10px;letter-spacing:-.3px}
  .fr{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #EEF0F5}
  .fr>div{flex:1;min-width:0}.fr small{display:block;font-size:13px;color:var(--muted)}.fr b{font-size:16px}

<script src="config.js"></script>
<script>
(() => {
'use strict';
const API = (window.HAERANG_TEAM_API || '').replace(/\/$/, '');
const TOKK = 'haerang-team-tok';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600); };
const won = n => (Math.round(+n || 0)).toLocaleString('ko-KR') + '원';
const ic = (n, st) => '<svg class="i"' + (st ? ' style="' + st + '"' : '') + '><use href="#i-' + n + '"/></svg>';

// ───── 날짜 ─────
const DOW = '일월화수목금토', WEEK = ['월', '화', '수', '목', '금'];
const kNow = () => new Date(Date.now() + 9 * 3600e3);
const today = () => kNow().toISOString().slice(0, 10);
const dObj = d => new Date(d + 'T00:00:00Z');
const wd = d => DOW[dObj(d).getUTCDay()];
const addDays = (d, n) => new Date(dObj(d).getTime() + n * 864e5).toISOString().slice(0, 10);
const addMonth = (m, n) => { const [y, mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo - 1 + n, 1)).toISOString().slice(0, 7); };
const md = d => (+d.slice(5, 7)) + '/' + (+d.slice(8)) + '(' + wd(d) + ')';
const hm = ts => { const k = new Date(ts + 9 * 3600e3); const h = k.getUTCHours(), m = k.getUTCMinutes(); return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + String(m).padStart(2, '0'); };
const dayOf = ts => new Date(ts + 9 * 3600e3).toISOString().slice(0, 10);
const timeKo = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + '시' + (m ? ' ' + m + '분' : ''); };

// 글 속 날짜·시간 찾기: 11/20, 11월 20일, 20일, 오늘·내일·모레, (다음주) 화요일, 3시, 오후 3시 30분, 15:00
function parseWhen(text, base = today()) {
  let s = text, date = '', time = '', rel = false;
  const y = +base.slice(0, 4), mo = +base.slice(5, 7);
  const mk = (yy, mm, dd) => { const d = new Date(Date.UTC(yy, mm - 1, dd)); return d.getUTCMonth() === mm - 1 ? d.toISOString().slice(0, 10) : ''; };
  const take = (re, fn) => { if (date) return; const m = s.match(re); if (m) { const d = fn(m); if (d) { date = d; s = s.replace(m[0], ' '); } } };
  take(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/, m => mk(+m[1], +m[2], +m[3]));
  take(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/, m => { let d = mk(y, +m[1], +m[2]); if (d && d < addDays(base, -60)) d = mk(y + 1, +m[1], +m[2]); return d; });
  take(/(?<![\d:])(\d{1,2})\/(\d{1,2})(?![\d:])/, m => { let d = mk(y, +m[1], +m[2]); if (d && d < addDays(base, -60)) d = mk(y + 1, +m[1], +m[2]); return d; });
  take(/(오늘|내일|모레|글피)/, m => { rel = true; return addDays(base, { 오늘: 0, 내일: 1, 모레: 2, 글피: 3 }[m[1]]); });
  take(/(다음\s*주|담주|이번\s*주|이번주)?\s*([월화수목금토일])요일/, m => { const target = DOW.indexOf(m[2]); const cur = dObj(base).getUTCDay(); let diff = (target - cur + 7) % 7; const mon = addDays(base, -((cur + 6) % 7)); if (m[1] && /다음|담/.test(m[1])) return addDays(mon, 7 + (target + 6) % 7); if (m[1]) return addDays(mon, (target + 6) % 7); return addDays(base, diff); });
  take(/(?<![\d\/])(\d{1,2})\s*일(?![\d])/, m => { let d = mk(y, mo, +m[1]); if (d && d < base) d = mk(mo === 12 ? y + 1 : y, mo === 12 ? 1 : mo + 1, +m[1]); return d; });
  let m = s.match(/(오전|오후|아침|저녁|밤)?\s*(\d{1,2})\s*시(?!간)\s*(?:(\d{1,2})\s*분|(반))?/) || s.match(/(오전|오후)?\s*(\d{1,2}):(\d{2})/);
  if (m) { let h = +m[2], mi = m[4] ? 30 : +(m[3] || 0); if (/오후|저녁|밤/.test(m[1] || '') && h < 12) h += 12; else if (!m[1] && h >= 1 && h <= 9) h += 12; if (h < 24 && mi < 60) { time = String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0'); s = s.replace(m[0], ' '); } }
  // strong: 숫자 날짜·요일이 있거나, '내일 3시'처럼 시간까지 있을 때만 (채팅 '일정으로 등록' 제안용)
  return { date, time, rest: s.replace(/\s+/g, ' ').trim().replace(/^(에는|에|까지|부터|은|는)\s+/, '').replace(/^(에는|에|까지|부터)(?=\S)/, ''), strong: !!date && (!rel || !!time) };
}


// ───── 상태 ─────
const S = { tok: '', me: null, members: [], msgs: [], items: new Map(), comments: new Map(), pickup: new Map(), pickupDefault: {}, logs: [], notice: null, since: 0, lastMsg: 0, roster: [], tab: 'chat', room: '', calM: today().slice(0, 7), calD: today(), tf: 'all', tkf: 'open', homeDay: today(), replyTo: null, logRead: 0, logSeen: 0, readAt: null };
try { S.logRead = +localStorage.getItem('haerang-team-logread') || 0; S.readAt = JSON.parse(localStorage.getItem('haerang-team-read') || 'null'); } catch (_) {}
const nameOf = id => (S.members.find(m => m.id === id) || {}).name || '?';
const itemsOf = t => [...S.items.values()].filter(i => i.type === t && !i.del);
// 사람마다 색 동그라미 (이름 뒤 두 글자)
const AVC = ['#2F6FDE', '#7C5CE0', '#E0703A', '#1F9D8B', '#D9468F', '#5B6B82', '#C99A1E', '#3A9A4B'];
const avColor = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVC[h % AVC.length]; };
const avName = n => { n = String(n || '?').replace(/님$/, ''); return n.length >= 3 ? n.slice(-2) : n; };
const av = (mid, cls) => '<span class="av' + (cls ? ' ' + cls : '') + '" style="background:' + avColor(mid) + '">' + esc(avName(nameOf(mid))) + '</span>';
const midOf = name => (S.members.find(m => m.name === name) || {}).id || name;
// 채팅방: '' = 단체방, 'dm:a:b' = 1:1
const dmRoom = id => 'dm:' + [S.me.id, id].sort().join(':');
const roomOf = m => m.room || '';
const roomName = r => r ? nameOf(r.split(':').slice(1).find(x => x !== S.me.id)) : '해랑경희 직원방';
const roomMsgs = r => S.msgs.filter(m => roomOf(m) === r);
const unreadIn = r => { const at = (S.readAt || {})[r] || 0; return S.msgs.filter(m => roomOf(m) === r && m.id > at && m.mid !== S.me.id).length; };
function markRoomRead(r) { const l = roomMsgs(r); if (!l.length) return; S.readAt = S.readAt || {}; S.readAt[r] = l[l.length - 1].id; try { localStorage.setItem('haerang-team-read', JSON.stringify(S.readAt)); } catch (_) {} }

async function api(path, body = {}) {
  try {
    const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tok: S.tok, ...body }) });
    const j = await r.json(); if (j.relogin) { logoutLocal(); } $('conn').textContent = ''; return j;
  } catch (e) { $('conn').textContent = '연결 안 됨'; return { ok: false, error: '인터넷 연결을 확인해 주세요' }; }
}
let syncing = false;
async function sync(first) {
  if (syncing || !S.tok) return; syncing = true;
  const j = await api('/api/sync', first ? {} : { since: S.since, lastMsg: S.lastMsg });
  syncing = false; if (!j.ok) return false;
  S.me = j.me; S.members = j.members; S.pickupDefault = j.pickupDefault || {};
  let changed = false, newIn = false;
  const jn = JSON.stringify(j.joins || []); if (jn !== JSON.stringify(S.joins || [])) { S.joins = j.joins || []; changed = true; }
  for (const m of j.msgs) {
    m.rx = m.rx || {}; m.room = m.room || '';
    const i = S.msgs.findIndex(x => x.id === m.id);
    if (i >= 0) S.msgs[i] = m; else { S.msgs.push(m); if (roomOf(m) === S.room) newIn = true; }
    changed = true;
  }
  S.msgs.sort((a, b) => a.id - b.id); if (S.msgs.length) S.lastMsg = Math.max(S.lastMsg, S.msgs[S.msgs.length - 1].id);
  if (!S.readAt) { S.readAt = {}; for (const m of S.msgs) S.readAt[roomOf(m)] = Math.max(S.readAt[roomOf(m)] || 0, m.id); try { localStorage.setItem('haerang-team-read', JSON.stringify(S.readAt)); } catch (_) {} }
  if (S.tab === 'room' && !document.hidden) markRoomRead(S.room);
  for (const it of j.items) { const cur = S.items.get(it.id); if (!cur || cur.upd <= it.upd || it.del) S.items.set(it.id, it); }
  for (const c of j.comments) { const l = S.comments.get(c.item) || []; if (!l.some(x => x.id === c.id)) l.push(c); S.comments.set(c.item, l.sort((a, b) => a.at - b.at)); }
  for (const p of j.pickup) { const cur = S.pickup.get(p.day); if (!cur || (cur.upd || 0) <= p.upd) S.pickup.set(p.day, p); }
  for (const g of (j.logs || [])) if (!S.logs.some(x => x.id === g.id)) { S.logs.push(g); changed = true; }
  S.logs.sort((a, b) => a.id - b.id);
  if (first && !S.logRead && S.logs.length) { S.logRead = S.logs[S.logs.length - 1].id; try { localStorage.setItem('haerang-team-logread', S.logRead); } catch (_) {} } // 처음 쓰는 기기는 예전 기록을 새 알림으로 세지 않음
  if ('notice' in j && JSON.stringify(j.notice) !== JSON.stringify(S.notice)) { S.notice = j.notice; changed = true; }
  S.since = j.now - 2000;
  if (first || changed || j.items.length || j.comments.length || j.pickup.length) render(newIn);
  setBadge(); return true;
}
function chatUnread() { const rs = new Set(['', ...S.msgs.map(roomOf)]); let n = 0; for (const r of rs) if (!(S.tab === 'room' && r === S.room)) n += unreadIn(r); return n; }
function setBadge() {
  if (!S.me) return;
  const t = today(), cu = chatUnread(), n = itemsOf('todo').filter(x => !isDone(x) && (!x.due || x.due <= t) && mine(x)).length + cu;
  try { if (navigator.setAppBadge) n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (_) {}
  $('chatDot').hidden = !cu; $('chatDot').textContent = cu > 99 ? '99+' : cu;
  const ln = S.logs.filter(g => g.id > S.logRead && g.mid !== S.me.id).length;
  S.logN = ln; const bd = $('bellDot'); if (bd) { bd.hidden = !ln; bd.textContent = ln > 99 ? '99+' : ln; }
}
// 화면을 보고 있을 때만 새 내용 받기 (채팅방 4초, 다른 화면 15초)
let pollT; function poll() { clearTimeout(pollT); pollT = setTimeout(async () => { if (!document.hidden && S.tok) await sync(); poll(); }, S.tab === 'room' || S.tab === 'chat' ? 4000 : 15000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tok) { sync(); poll(); } });
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'push') sync(); });

// ───── 항목 저장 ─────
async function saveItem(it, what) {
  it.upd = Date.now(); if (it.id) S.items.set(it.id, it); render();
  const j = await api('/api/item', { item: it, what });
  if (!j.ok) { toast(j.error || '저장하지 못했어요'); return null; }
  it.id = j.id; it.upd = j.upd; it.mid = it.mid || S.me.id; S.items.set(j.id, it); render(); return j.id;
}
async function delItem(it) { if (!confirm('"' + it.title + '"을(를) 지울까요?')) return false; it.del = true; render(); await api('/api/item-del', { id: it.id }); return true; }

// ═════════ 업무 공통 ═════════
const ST = ['요청', '진행', '완료'];
const statusOf = x => ST.includes(x.status) ? x.status : (x.done ? '완료' : '요청');
const isDone = x => statusOf(x) === '완료';
const whosOf = x => Array.isArray(x.whos) ? x.whos : (x.who ? [x.who] : []);
const mine = x => !whosOf(x).length || whosOf(x).includes(S.me.name);
const COLORS = [['#D9468F', '로즈 핑크'], ['#E0703A', '오렌지'], ['#C99A1E', '머스터드'], ['#2EA36B', '초록'], ['#1F9D8B', '청록'], ['#2F6FDE', '파랑'], ['#5B6FD8', '라벤더'], ['#7C5CE0', '보라'], ['#0D326F', '남색'], ['#6B7385', '회색']];
const itemColor = x => x.color || (x.type === 'sched' ? '#2F6FDE' : whosOf(x).length ? avColor(midOf(whosOf(x)[0])) : '#5B6FD8');
const stPill = s => '<span class="st s' + ST.indexOf(s) + '">' + s + '</span>';
const dueTxt = d => d ? d.slice(2, 4) + '/' + d.slice(5, 7) + '/' + d.slice(8) + ' 까지' : '기한 없음';
const dday = d => { const n = Math.round((dObj(d) - dObj(today())) / 864e5); return n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : '지남'; };
const dbox = (d, cls) => '<div class="dbox' + (cls ? ' ' + cls : '') + '"><small>' + d.slice(0, 4) + '-' + d.slice(5, 7) + '</small><b>' + (+d.slice(8)) + '</b></div>';
const schLi = x => '<div class="sch" data-id="' + x.id + '">' + dbox(x.date, x.date === today() ? 'td' : '') + '<div class="t"><b>' + esc(x.title) + '</b><small>' + [wd(x.date) + '요일', timeKo(x.time) || '종일', x.memo ? esc(x.memo) : '', (S.comments.get(x.id) || []).length ? '댓글 ' + (S.comments.get(x.id) || []).length : ''].filter(Boolean).join(' · ') + '</small></div></div>';

// 해시태그 → 할 일·일정·구매·등원
async function buildFromTags(text) {
  const items = [], pickups = [], absences = [], skip = [];
  const body = text.replace(/#(일정|할일|등원|구매|행사)/g, ' ').replace(/\s+/g, ' ').trim();
  if (/#일정/.test(text)) { const w = parseWhen(body); if (w.date) items.push({ type: 'sched', title: (w.rest || '일정').slice(0, 80), date: w.date, time: w.time, memo: '' }); else skip.push('날짜를 못 찾아 일정은 등록하지 않았어요'); }
  if (/#할일/.test(text)) { const w = parseWhen(body); items.push({ type: 'todo', title: (w.rest || body).slice(0, 80), due: w.date, status: '요청', whos: [], done: false }); }
  if (/#구매/.test(text)) {
    const list = itemsOf('buy').filter(b => !b.closed).sort((a, b) => b.upd - a.upd)[0] || { type: 'buy', title: '구매 목록', rows: [] };
    const add = body.split(/[,，\n]/).map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(.*?)\s*(\d+)\s*(개|장|벌|박스|세트|ea)?$/); return { n: (m ? m[1] : x).slice(0, 40) || x, qty: m ? +m[2] : 1, price: '', who: '', done: false, memo: '' }; });
    if (add.length) items.push({ ...list, rows: [...(list.rows || []), ...add] });
  }
  if (/#등원/.test(text)) {
    await loadRoster(); const w = parseWhen(body), d = w.date || today(), p = JSON.parse(JSON.stringify(pickupFor(d)));
    const known = [...new Set([...S.roster, ...p.list, ...Object.values(S.pickupDefault).flat()])].sort((a, b) => b.length - a.length);
    const found = []; let rest = body; for (const n of known) if (rest.includes(n)) { found.push(n); rest = rest.split(n).join(' '); }
    const isAbsent = /결석|안\s*와|못\s*와|쉬어|빠져/.test(body);
    for (const n of found) { if (isAbsent) { if (!p.absent.includes(n)) p.absent.push(n); p.done = p.done.filter(x => x !== n); absences.push({ name: n, date: d, why: '연락옴' }); } else if (!p.list.includes(n)) p.list.push(n); }
    p.memos = [...(p.memos || []), { who: S.me.name, text: body, at: Date.now() }]; p.day = d; pickups.push(p);
    S.pickup.set(d, { ...p, upd: Date.now() });
  }
  return { items, pickups, absences, skip };
}

  if (!j.members.some(m => m.id === mid)) mid = '';
  body.innerHTML = '<p>이름을 고르고 PIN을 눌러 주세요.</p><div class="chips" id="lgT">' + j.members.map(m => '<button data-v="' + m.id + '" class="' + (m.id === mid ? 'on' : '') + '">' + esc(m.name) + '</button>').join('') + '</div><div class="dots" id="lgD"></div><div class="msg" id="lgM"></div><div class="keys" id="lgP">' + '123456789'.split('').map(n => '<button data-n="' + n + '">' + n + '</button>').join('') + '<button data-n="ok" style="font-size:16px">확인</button><button data-n="0">0</button><button data-n="del" style="font-size:16px">지우기</button></div><button class="big" id="joinBtn" style="margin-top:22px">내 이름이 없어요 · 처음 들어가기</button>';
  $('joinBtn').onclick = () => joinForm();
  const dots = () => { $('lgD').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => '<i class="' + (i < pin.length ? 'on' : '') + '"></i>').join(''); }; dots();
  $('lgT').onclick = e => { const b = e.target.closest('button'); if (!b) return; mid = b.dataset.v; $('lgT').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); $('lgM').textContent = ''; };
  const go = async () => { if (!mid) { $('lgM').textContent = '이름을 먼저 골라 주세요'; return; } const r = await fetch(API + '/api/login', { method: 'POST', body: JSON.stringify({ mid, pin }) }).then(r => r.json()).catch(() => ({ error: '서버에 연결하지 못했어요' })); if (!r.ok) { $('lgM').textContent = r.error; pin = ''; dots(); return; } try { localStorage.setItem('haerang-team-last', mid); } catch (_) {} loggedIn(r.tok); };
  $('lgP').onclick = e => { const b = e.target.closest('button'); if (!b) return; const n = b.dataset.n; if (n === 'del') pin = pin.slice(0, -1); else if (n === 'ok') return go(); else if (pin.length < 6) pin += n; dots(); if (pin.length === 6) go(); };
  document.onkeydown = e => { if ($('loginView').hidden) return; if (/^\d$/.test(e.key) && pin.length < 6) { pin += e.key; dots(); } else if (e.key === 'Backspace') { pin = pin.slice(0, -1); dots(); } else if (e.key === 'Enter') go(); };
}
// 처음 쓰는 사람: 내 이름·PIN으로 요청 → 다른 사람이 승인하면 바로 들어가짐
function joinForm() {
  document.onkeydown = null;
  $('loginBody').innerHTML = '<p>내 이름과 PIN을 정해 주세요.<br>직원이 승인하면 바로 들어가져요.</p><div style="text-align:left;margin-top:18px"><input class="inp" id="jnN" placeholder="이름 (예: 이아빈)"><input class="inp" id="jnP" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="PIN (숫자 4~6자리)" style="margin-top:10px"><button class="big g" id="jnOk" style="margin-top:14px">들어가기 요청</button><button class="big" id="jnBack">뒤로</button><div class="msg" id="jnMsg"></div></div>';
  $('jnBack').onclick = () => showLogin();
  $('jnOk').onclick = async () => { const r = await fetch(API + '/api/join-request', { method: 'POST', body: JSON.stringify({ name: $('jnN').value, pin: $('jnP').value }) }).then(r => r.json()).catch(() => ({ error: '서버에 연결하지 못했어요' })); if (!r.ok) { $('jnMsg').textContent = r.error || '요청하지 못했어요'; return; } try { localStorage.setItem('haerang-team-join', r.id); } catch (_) {} joinWait(r.id); };
}
let joinT;
function joinWait(id) {
  $('loginBody').innerHTML = '<p style="margin-top:20px">승인을 기다리고 있어요 ⏳<br>다른 직원 앱의 <b>대시보드</b>에서 승인하면 바로 들어가져요.</p><button class="big" id="jnCancel" style="margin-top:24px">요청 취소</button>';
  $('jnCancel').onclick = () => { clearTimeout(joinT); try { localStorage.removeItem('haerang-team-join'); } catch (_) {} showLogin(); };
  const check = async () => {
    const r = await fetch(API + '/api/join-status', { method: 'POST', body: JSON.stringify({ id }) }).then(r => r.json()).catch(() => null);
    if (r && r.status === 'ok') { try { localStorage.removeItem('haerang-team-join'); } catch (_) {} toast(r.name + '님, 어서 오세요!'); return loggedIn(r.tok); }
    if (r && (r.status === 'no' || r.status === 'none' || r.status === 'done')) { try { localStorage.removeItem('haerang-team-join'); } catch (_) {} $('loginBody').innerHTML = '<p style="margin-top:20px">요청이 받아들여지지 않았어요.</p><button class="big" id="jnRe">처음으로</button>'; $('jnRe').onclick = () => showLogin(); return; }
    clearTimeout(joinT); joinT = setTimeout(check, 5000);
  };
  check();
}
async function loggedIn(tok) {
  S.tok = tok; try { localStorage.setItem(TOKK, tok); } catch (_) {}
  $('loginView').hidden = true;
  if (!(await sync(true))) return showLogin();
  $('app').hidden = false; const h = location.hash.slice(1); setTab(TITLES[h] && h !== 'room' ? h : 'home'); loadRoster();
}
(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  let tok = ''; try { tok = localStorage.getItem(TOKK) || ''; } catch (_) {}
  if (tok && API) { S.tok = tok; if (await sync(true)) { $('app').hidden = false; const h = location.hash.slice(1); setTab(TITLES[h] && h !== 'room' ? h : 'home'); loadRoster(); return; } S.tok = ''; }
  showLogin();
})();
})();
</script>
