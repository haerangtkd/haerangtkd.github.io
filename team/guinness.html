<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>해랑 성장 측정지</title>
<meta name="theme-color" content="#0D326F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 원생 목록 → 입력 → A4 미리보기, 작업대처럼 왼쪽에서 오른쪽으로 흐름 */
:root{
  --bg:#F1F0ED; --surface:#FFFFFF; --sunk:#E9E6E1; --line:#D8D3CB; --fg:#1D1B19; --muted:#5F5952;
  --red:#9E1B1F; --red-ink:#FFFFFF; --red-soft:#F6E7E6; --navy:#13305E; --ok:#2C6A3B; --ok-soft:#E3F0E5;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --serif:'Noto Serif KR','Noto Sans KR',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141517; --surface:#1D1F22; --sunk:#272A2E; --line:#383C42; --fg:#ECE9E4; --muted:#A8A199;
  --red:#E4676B; --red-ink:#1B0A0B; --red-soft:#3A2224; --navy:#9DB8E8; --ok:#86C996; --ok-soft:#1F3324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1D1F22; --sunk:#272A2E; --line:#383C42; --fg:#ECE9E4; --muted:#A8A199;
  --red:#E4676B; --red-ink:#1B0A0B; --red-soft:#3A2224; --navy:#9DB8E8; --ok:#86C996; --ok-soft:#1F3324; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{padding-block:12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:14px;flex:1 1 280px;min-width:0}
.brand-logo{height:34px;width:auto;background:#fff;border-radius:6px;padding:3px 6px}
.brand h1{margin:0;font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:-.2px}
.brand p.sync{color:var(--red)}
.brand p{margin:0;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.top-actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
.btn.primary{background:var(--red);color:var(--red-ink);border-color:var(--red);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}

.wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.3px}
.field input,.field select,textarea,.search{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{resize:vertical;line-height:1.65}
.settings details{grid-column:1/-1}
.settings summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}
.incl{grid-column:1/-1}
.stage{display:flex;flex-direction:column;gap:10px}
.pagelbl{font-size:12px;color:var(--muted);font-weight:500}

.work{display:grid;grid-template-columns:250px minmax(300px,380px) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.list{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.list-head{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.kids{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.kid{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;min-height:44px}
.kid:hover{background:var(--sunk)}
.kid[aria-current="true"]{background:var(--red-soft)}
.kid b{font-weight:700}
.kid small{grid-column:1;color:var(--muted);font-size:12px}
.kid .st{grid-row:1/3;grid-column:2}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill.res{background:var(--red-soft);color:var(--red)}
.pill.inv{background:var(--sunk);color:var(--navy)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.sb{background:#F4E9D2;color:#6B4E17}
.qinfo{min-height:40px;display:flex;align-items:center;font-weight:700}
.sbcheck{font-size:14px;color:var(--fg)}
.autolv{min-height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:8px;background:var(--sunk);font-size:13px}
.autolv span{color:var(--muted)}
.nobelt{color:var(--red);font-weight:700}
.pill.todo{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.count{padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.edit{padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.picker{display:none;gap:8px;align-items:center}
.picker select{flex:1;min-width:0}
.kidhead{display:flex;flex-direction:column;gap:4px}
.kidhead .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kidhead h2{margin:0;font-size:24px;font-weight:900}
.kidhead .meta{color:var(--muted);font-size:13px}
.recline{font-size:13px;color:var(--fg);background:var(--sunk);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px}
.nav .btn{flex:1}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 em{font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
.att{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:8px}
.att>span{font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:40px;font-size:13px;cursor:pointer;border-left:1px solid var(--line);text-align:center;padding:0 4px}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.seg label:has(input:checked){background:var(--fg);color:var(--bg);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--red);outline-offset:-2px}
.bank{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bank-head{display:flex;gap:6px;padding:8px;background:var(--sunk);flex-wrap:wrap}
.bank-head .search{flex:1 1 140px;min-height:34px;padding:4px 8px;background:var(--surface)}
.bank-head select{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 6px;max-width:130px}
.bank ul{list-style:none;margin:0;padding:4px;max-height:320px;overflow:auto}
.bank li button{width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:6px;cursor:pointer;line-height:1.55;font-size:13px;display:flex;flex-direction:column;gap:2px}
.bank li button:hover{background:var(--sunk)}
.bank li.cathead{padding:10px 8px 4px;font-size:12px;font-weight:700;color:var(--red);letter-spacing:.3px}
.bank li button[aria-pressed="true"]{background:var(--red-soft)}
.bank li button:disabled{cursor:not-allowed;opacity:.55;text-decoration:line-through;text-decoration-color:var(--muted)}
.bank li button:disabled small{text-decoration:none}
.catchips{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:var(--sunk)}
#cmWarn{color:var(--red);font-weight:500}
.bank li button small{color:var(--muted);font-size:11.5px}
.bank .note{padding:8px 10px;font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--red);cursor:pointer;font-size:12px;text-decoration:underline}

.prev{padding:14px;display:flex;flex-direction:column;gap:12px}
.prev-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prev-actions .grow{flex:1}
.prev-actions select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;max-width:100%}
.stage{background:var(--sunk);border-radius:10px;padding:14px;overflow:hidden}
.paperbox{margin:0 auto;position:relative}
.paper{position:absolute;top:0;left:0;width:816px;height:1056px;transform-origin:0 0;box-shadow:0 2px 14px rgba(0,0,0,.18);background:#fff}
.progress{font-size:13px;color:var(--muted)}
.progress[hidden]{display:none}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

.home{display:flex;flex-direction:column;gap:12px}
.home-bar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.home-bar .search{flex:1 1 180px;max-width:260px;min-height:40px}
.home-bar .grow{flex:1}
.scope{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;max-width:100%}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.card{width:100%;height:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:44px}
.card:hover{border-color:var(--muted)}
.card.is-done{border-color:var(--ok)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card b{font-size:16px;font-weight:900}
.card small{color:var(--muted);font-size:12px}
.card .rec{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--fg)}
.card .prog{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:4px;background:var(--line)}
.dot.on{background:var(--ok)}
.promo-bar{background:var(--red-soft);border:1px solid var(--red);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.promo-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.promo-row .grow{flex:1}
.promo-bar p{margin:0;font-size:12.5px;color:var(--muted)}
#promoBtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card.picked{border:2px solid var(--red);padding:11px 13px;background:var(--red-soft)}
.card .tick{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--red-ink);flex:none}
.card.picked .tick{background:var(--red);border-color:var(--red)}
.promo-line{font-size:12.5px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stab{min-height:36px;padding:0 12px;border:0;border-left:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px}
.stab:first-child{border-left:0}
.stab[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.detail-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.detail-bar .count{border:0;padding:0}
.home .empty{grid-column:1/-1}
#render{position:fixed;left:-10000px;top:0;width:816px;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}

@media (max-width:1180px){
  .work{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
  .list{display:none}
  .picker{display:flex}
}
@media (max-width:760px){
  .work{grid-template-columns:1fr}
  .stage{padding:8px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <img class="brand-logo" src="" alt="해랑경희 태권도장">
      <div><h1>성장 측정지</h1><p id="srcLine"></p><p class="sync" id="syncLine" hidden></p></div>
    </div>
    <div class="top-actions">
      <a class="btn" href="./" id="toTeam">‹ 업무</a>
      <label class="btn" for="fRec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>기록 파일 올리기</label>
      <input class="sr" type="file" id="fRec" accept=".xlsx,.xls,.csv">
      <label class="btn" for="fCm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>한마디 파일 올리기</label>
      <input class="sr" type="file" id="fCm" accept=".xlsx,.xls,.csv,.txt">
      <label class="btn" for="fAtt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 15l2 2 4-4"/></svg>출석 파일 올리기</label>
      <input class="sr" type="file" id="fAtt" accept=".xlsx,.xls,.csv">
      <button class="btn" id="bkOut" type="button">백업 내려받기</button>
      <label class="btn" for="fBk">백업 불러오기</label>
      <input class="sr" type="file" id="fBk" accept=".json,application/json">
    </div>
  </div>
</header>

<main class="wrap">
  <section class="settings" aria-label="공통 설정">
    <label class="field"><span>결과지 보내는 달</span><input type="month" id="sMonth"></label>
    <div class="field"><span>들어가는 기록</span><div class="qinfo" id="sQuarter"></div></div>
    <label class="field"><span>휴무일 (출석 계산에서 빼요)</span><input type="text" id="sHol" placeholder="예: 9/24, 9/25"></label>
    <div class="field"><span>끈기와 꾸준함 기준 (출석률 %)</span><div class="two" style="gap:6px"><label><span class="sr">아주 잘해요 기준</span><input type="number" id="sThHi" min="0" max="100" placeholder="아주 잘해요 90"></label><label><span class="sr">잘해요 기준</span><input type="number" id="sThMid" min="0" max="100" placeholder="잘해요 75"></label></div></div>
    <label class="field"><span>현재 선범단 인원</span><input type="number" id="sSbN" min="1" step="1" inputmode="numeric"></label>
    <label class="field"><span>연락처</span><input type="text" id="sPhone"></label>
  </section>

  <section id="home" class="home" aria-label="전체 원생">
    <div class="home-bar">
      <label class="sr" for="q">이름 검색</label>
      <input class="search" id="q" type="search" placeholder="이름 검색">
      <div class="chips" id="chips"></div>
      <div class="stabs" id="stabs" role="group" aria-label="회원 상태"></div>
      <span class="grow"></span>
      <button class="btn" id="promoBtn" type="button" aria-pressed="false">승급심사 합격 처리</button>
      <label class="sr" for="scope">묶어서 저장할 범위</label>
      <select id="scope" class="scope">
        <option value="done">입력 끝난 친구만</option>
        <option value="list">지금 목록 전체</option>
      </select>
      <button class="btn primary" id="pdfAll" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>한 번에 사진 (zip)</button>
    </div>
    <div class="promo-bar" id="promoBar" hidden>
      <div class="promo-row">
        <b id="promoCount">0명 선택</b>
        <button class="btn sm" id="promoAll" type="button">보이는 친구 모두 선택</button>
        <button class="btn sm" id="promoNone" type="button">선택 해제</button>
        <span class="grow"></span>
        <button class="btn sm" id="promoUndo" type="button" hidden>방금 올린 것 되돌리기</button>
        <label class="sr" for="promoBelt">지정할 띠</label>
        <select id="promoBelt" class="scope"><option value="">띠 고르기</option></select>
        <button class="btn sm" id="promoSet" type="button" disabled>선택한 친구 띠 지정</button>
        <button class="btn sm primary" id="promoGo" type="button" disabled>합격 · 한 단계 올리기</button>
        <button class="btn sm" id="promoEnd" type="button">끝내기</button>
      </div>
      <p>합격한 친구 카드를 눌러 고른 뒤 올리기를 누르세요. 띠를 아직 안 적은 친구는 골라서 띠 고르기 → 띠 지정으로 한 번에 정할 수 있어요. 유치부는 줄띠·검은띠를 거쳐 밤띠까지, 초등부 이상은 줄띠·검은띠 없이 빨간띠까지 올라가요. 품띠와 품 단계는 각 친구 화면에서 직접 골라주세요.</p>
    </div>
    <div class="progress" hidden></div>
    <ul class="grid" id="grid"></ul>
  </section>

  <div class="detail-bar" id="detailBar" hidden>
    <button class="btn" id="backHome" type="button">← 전체 친구들</button>
    <span class="count" id="countD"></span>
  </div>
  <div class="work" id="detail" hidden>
    <aside class="panel list" aria-label="원생 목록">
      <ul class="kids" id="kids"></ul>
      <div class="count" id="count"></div>
    </aside>

    <section class="panel edit" aria-label="입력">
      <div class="picker">
        <label class="sr" for="pick">원생 선택</label>
        <select id="pick" class="search"></select>
      </div>
      <div id="editor"></div>
      <div class="nav">
        <button class="btn" id="prevKid" type="button">← 이전 친구</button>
        <button class="btn" id="nextKid" type="button">다음 친구 →</button>

/* ---------- 저장소 (모든 기기에서 같은 기록) ---------- */
let db=null, dbReady=false;
const dataDoc = () => DATA===EMBED? {none:true, dataV:DV} : Object.assign({dataV:DV}, DATA);
const cmDoc = () => ({comments, commentsFile, commentsV:CV});
function periodsOf(obj){ const out={}; Object.keys(obj).forEach(key=>{ const pk=key.split('|')[0], id=key.slice(pk.length+1); (out[pk]=out[pk]||{})[id]=obj[key]; }); return out; }
async function dbPutPeriod(pk){ const kids={}; Object.keys(inputs).forEach(key=>{ if(key.startsWith(pk+'|')) kids[key.slice(pk.length+1)]=inputs[key]; }); await db.doc('inputs/'+pk).set({kids}); }
async function dbSave(){
  if(!db||!dbReady) return;
  try{ await Promise.all([db.doc('app/settings').set({settings}), dbPutPeriod(periodKey())]); setSync(''); }
  catch(e){ setSync('저장 연결이 잠시 안 돼요. 입력은 이 기기에 남아 있어요.'); }
}
async function dbPutAll(){
  const per=periodsOf(inputs);
  await Promise.all([db.doc('app/settings').set({settings}), db.doc('app/data').set(dataDoc()), db.doc('app/comments').set(cmDoc()), ...Object.keys(per).map(pk=>db.doc('inputs/'+pk).set({kids:per[pk]}))]);
}
function setSync(msg){ const el=$('syncLine'); if(el){ el.textContent=msg; el.hidden=!msg; } }

/* ---------- 업무 서버 저장소 (예전 claude.ai 저장소와 같은 모양: doc(경로).get/set, collection(이름).get) ---------- */
const TEAM_API = window.HAERANG_TEAM_API || '';
function teamTok(){ try{ return localStorage.getItem('haerang-team-tok')||''; }catch(e){ return ''; } }
async function tcall(path, body){
  const r = await fetch(TEAM_API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({tok:teamTok()},body))});
  const j = await r.json(); if(!j.ok){ const e=new Error(j.error||'저장하지 못했어요'); e.relogin=j.relogin; throw e; } return j;
}
const snap = (id,j) => ({id, exists:!!j.exists, data:()=>j.data});
function teamDb(){
  if(!TEAM_API || !teamTok()) return null;
  return {
    doc: p => ({ get: async()=>snap(p.split('/')[1], await tcall('/api/gdoc-get',{path:p})), set: async data=>{ await tcall('/api/gdoc-set',{path:p,data}); } }),
    collection: c => ({ get: async()=>{ const j=await tcall('/api/gdoc-list',{coll:c}); return {docs:j.docs.map(x=>snap(x.id,{exists:true,data:x.data}))}; } }),
  };
}
/* 백업: {kind, at, docs:[{path,data}]} — 예전 claude.ai 결과지에서 내려받은 파일도 같은 모양 */
async function backupDocs(){
  const per=periodsOf(inputs), docs=[{path:'app/settings',data:{settings}},{path:'app/data',data:dataDoc()},{path:'app/comments',data:cmDoc()}];
  Object.keys(per).forEach(pk=>docs.push({path:'inputs/'+pk,data:{kids:per[pk]}}));
  return {kind:'haerang-guinness-backup', at:new Date().toISOString(), docs};
}
async function dbInit(){
  db = teamDb();
  if(!db){ setSync('업무 앱에서 로그인한 뒤 열어 주세요. 지금은 입력이 이 기기에만 저장돼요.'); return; }
  try{
    const [st, ins, dt, cm] = await Promise.all([db.doc('app/settings').get(), db.collection('inputs').get(), db.doc('app/data').get(), db.doc('app/comments').get()]);
    if(st.exists){
      const remote={}; ins.docs.forEach(d=>{ const kids=JSON.parse(JSON.stringify((d.data()||{}).kids||{})); Object.keys(kids).forEach(id=>{ remote[d.id+'|'+id]=kids[id]; }); });
      const localOnly = Object.keys(inputs).filter(k=>!(k in remote));
      inputs = Object.assign({}, inputs, remote);
      const rs = JSON.parse(JSON.stringify(st.data().settings||{}));
      settings = Object.assign({}, settings, rs, {belts:Object.assign({}, settings.belts||{}, rs.belts||{}), status:Object.assign({}, settings.status||{}, rs.status||{}), sb:Object.assign({}, settings.sb||{}, rs.sb||{})});
      if(dt.exists && !dt.data().none && dt.data().students){ const d=JSON.parse(JSON.stringify(dt.data())); DATA = d.dataV===DV? normEvents(d) : mergeData(normEvents(d), EMBED); }
      if(cm.exists && cm.data().commentsV===CV && (cm.data().comments||[]).length){ comments=JSON.parse(JSON.stringify(cm.data().comments)); commentsFile=cm.data().commentsFile||''; }
      fixHol(); dbReady=true; saveLocal();
      if(localOnly.length) await dbPutAll();
    } else { dbReady=true; await dbPutAll(); }
    sel = sel && DATA.students.find(k=>kidId(k)===kidId(sel)) || null;
    renderAll(); if(view==='detail'){renderEditor();renderPreview();}
  }catch(e){ setSync('저장 연결이 잠시 안 돼요. 입력은 이 기기에 남아 있어요.'); }
}

const $ = id => document.getElementById(id);

const fmt = v => Number.isInteger(v)? String(v) : (Math.round(v*10)/10).toFixed(1);
const batchim = s => {const c=String(s).trim().slice(-1).charCodeAt(0); if(c>=0xAC00&&c<=0xD7A3) return (c-0xAC00)%28!==0; return /[013678]$/.test(String(s).trim());};
const josa = (w,a,b) => w + (batchim(w)?a:b);
function callName(name){const n=String(name).trim(); const g = n.length>=4? n.slice(2) : n.length===3? n.slice(1) : n; return batchim(g)? g+'이' : g;}
function fillName(text,name){return String(text||'').replace(/(\[아이 ?이름\]|\[이름\]|○○|ㅇㅇ)(이(?=[는가를의도랑와한]))?/g, callName(name));}

const EV_TITLES = {'줄넘기':'스피드 줄넘기','10초 발차기':'스피드 발차기'};
function normEvents(d){ d.events.forEach(e=>{ e.pf = e.pf || /격파/.test(e.name) || d.students.some(s=>Object.values(s.rec[e.name]||{}).some(v=>v!=null&&typeof v==='object')); const n=EV_TITLES[e.name]; if(n){ d.students.forEach(s=>{ if(s.rec[e.name]){ s.rec[n]=s.rec[e.name]; delete s.rec[e.name]; } }); e.name=n; } }); return d; }

const periodLabel = pk => { const m=pk.match(/^P(\d+)-(\d+)/); return m? `${+m[2]}월` : ''; };
const inKey = k => periodKey()+'|'+kidId(k);
function usedBefore(k){ const id='|'+kidId(k), cur=periodKey(), out={};

  return out; }
function inp(k){const key=inKey(k); if(inputs[key]&&Object.isFrozen(inputs[key])) inputs[key]=JSON.parse(JSON.stringify(inputs[key])); if(!inputs[key]) inputs[key]={att:[null,null,null,null],cm:'',an:null,at:null,rate:null,beltPct:null,act:''}; return inputs[key];}
const peek = k => inputs[inKey(k)];
const BELTS = ['흰띠','노란줄띠','노란띠','초록줄띠','초록띠','초록검은띠','보라띠','보라검은띠','파란띠','파란검은띠','주황띠','주황검은띠','분홍띠','밤띠','빨간띠','1품','2품','3품','4품'];

const isStripe = b => KINDER_ONLY.includes(b);

const isKinder = k => String(k.grade||'').includes('유치');
const beltOf = k => (settings.belts||{})[kidId(k)] || '';
function setBelt(k,b){settings.belts=settings.belts||{}; if(b) settings.belts[kidId(k)]=b; else delete settings.belts[kidId(k)];}
function beltOptions(k){
  const max = BELTS.indexOf(isKinder(k)?'밤띠':'빨간띠');
  let list = isKinder(k)? BELTS.slice() : BELTS.filter(b=>!isStripe(b));
  const cur=beltOf(k); if(cur && !list.includes(cur)) list=[...list,cur].sort((a,b)=>BELTS.indexOf(a)-BELTS.indexOf(b));
  return list;
}
function nextBelt(k){

  const max = BELTS.indexOf(isKinder(k)?'밤띠':'빨간띠');
  for(let j=i+1;j<=max;j++){ if(isKinder(k)||!isStripe(BELTS[j])) return BELTS[j]; }

function normBelt(v){
  let s=String(v??'').replace(/\s/g,''); if(!s) return '';

  if(s==='품띠') return '1품';
  if(!s.endsWith('띠')) s+='띠';
  if(s==='갈색띠') s='밤띠';
  if(/^(하얀|보라|파란|주황)줄띠$/.test(s)) s=OLD_BELTS[s];

function followRoster(){
  if(!ATTST || DATA===EMBED || !dbReady) return;
  let linked=0; const renamed=[];
  DATA.students.forEach(k=>{
    if(!k.sid){
      const y=String(k.birth||'').slice(0,4), c=ATTST.list.filter(x=>x.id && x.name===k.name);
      const m=c.length>1? c.filter(x=>y && String(x.birth||'').slice(0,4)===y) : c;
      if(m.length===1 && !DATA.students.some(o=>o!==k && o.sid===m[0].id)){ k.sid=m[0].id; linked++; }
      return;
    }
    const a=ATTST.bySid[k.sid]; if(!a || !a.name || a.name===k.name) return;
    const oldId=kidId(k), nk=Object.assign({},k,{name:a.name}), newId=kidId(nk);
    if(DATA.students.some(o=>o!==k && kidId(o)===newId)) return; // 같은 이름+출생이 이미 있으면 건드리지 않음
    ['belts','status','sb'].forEach(f=>{ const o=settings[f]; if(o && oldId in o){ o[newId]=o[oldId]; delete o[oldId]; } });
    Object.keys(inputs).forEach(key=>{ if(key.endsWith('|'+oldId)){ inputs[key.slice(0,-oldId.length)+newId]=inputs[key]; delete inputs[key]; } });
    if(picked.has(oldId)){ picked.delete(oldId); picked.add(newId); }
    renamed.push(k.name+' → '+a.name); k.name=a.name;
  });
  // 출석부에 새로 들어온 제자(퇴관 빼고)는 성장 측정 명단에도 자동으로 넣음 (2026-11-13)
  const added=[];
  ATTST.list.forEach(x=>{
    if(!x.id || !x.name || x.status==='퇴관') return;
    if(DATA.students.some(k=>k.sid===x.id)) return;
    if(DATA.students.some(k=>!k.sid && k.name===x.name)) return; // 이름만 같은 아이가 아직 안 이어졌으면 기다림
    DATA.students.push({belt0:'',name:x.name,birth:x.birth||'',grade:gradeFromBirth(x.birth),gender:'',status:x.status||'재원',rec:{},sid:x.id});
    added.push(x.name);

  if(added.length) DATA.students.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  if(!linked && !renamed.length && !added.length) return;

  if(renamed.length) toast('출석부에서 바뀐 이름을 따라갔어요: '+renamed.join(', '));
  if(added.length) toast('출석부의 새 제자를 넣었어요: '+added.join(', '));
}

/* ---------- file parsing ---------- */
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsArrayBuffer(file);});}
function parseRecords(buf,fileName){
  const wb = XLSX.read(buf,{type:'array'});
  const name = wb.SheetNames.find(n=>n.includes('전체')) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null,raw:true});
  const title = (rows[0]||[]).filter(Boolean).join(' ');
  const y = (title.match(/(20\d\d)/)||[])[1];
  const hi = rows.findIndex(r=>r&&r.some(c=>String(c??'').trim()==='이름'));
  if(hi<0) throw new Error('"이름" 칸이 있는 줄을 찾지 못했어요.');
  const h = rows[hi].map(c=>String(c??'').trim());
  const col = p => h.findIndex(x=>x.startsWith(p));
  const ci = {name:col('이름'),birth:col('출생'),grade:col('소속'),gender:col('성별'),status:col('회원'),belt:h.findIndex(x=>x==='띠'||x==='현재 띠')};
  const events=[], evcols=[];
  h.forEach((x,i)=>{const m=x.match(/^(.+?)\s*(\d{1,2})월\s*\((.+?)\)/); if(!m) return;
    const nm=m[1].trim(), mo=+m[2], u=m[3].trim(); let e=events.find(e=>e.name===nm);
    if(!e){e={name:nm,unit:u,lower:u==='초',months:[]};events.push(e);} e.months.push(mo); evcols.push([i,nm,mo]);});
  if(!events.length) throw new Error('"종목 10월(회)" 같은 기록 칸을 찾지 못했어요.');
  const g=(r,k)=>ci[k]>=0&&r[ci[k]]!=null? r[ci[k]] : '';
  const students = rows.slice(hi+1).filter(r=>r&&r[ci.name]).map(r=>{
    const rec={}; evcols.forEach(([i,nm,mo])=>{let v=r[i]; if(typeof v==='string'){ const s=v.trim(), fm=s.match(/^(\d+)\s*장?\s*실패$/); v = fm? {f:+fm[1]} : s==='실패'? {f:null} : /^\d+(\.\d+)?$/.test(s)? parseFloat(s) : null; } if((typeof v==='number'&&isFinite(v))||isFail(v)) (rec[nm]=rec[nm]||{})[mo]=v;});
    return {belt0:normBelt(g(r,'belt')),name:String(g(r,'name')).trim(),birth:g(r,'birth'),grade:String(g(r,'grade')),gender:String(g(r,'gender')),status:String(g(r,'status')||'재원').trim(),rec};});
  return normEvents({file:fileName,year:y?+y:new Date().getFullYear(),events,students});
}
function mergeData(old,neu){
  const events=[...neu.events]; old.events.forEach(e=>{ if(!events.some(x=>x.name===e.name)) events.push(e); });
  const byId=new Map(neu.students.map(k=>[kidId(k),k])); let kept=0;
  old.students.forEach(o=>{
    const n=byId.get(kidId(o));
    if(n){ Object.keys(o.rec||{}).forEach(ev=>{ n.rec[ev]=Object.assign({},o.rec[ev],n.rec[ev]||{}); }); if(!n.belt0) n.belt0=''; if(o.sid && !n.sid) n.sid=o.sid; }
    else if(old.year===neu.year){ neu.students.push(o); kept++; }
  });
  neu.students.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  if(old.year!==neu.year) return Object.assign(neu,{events});
  return Object.assign(neu,{events, kept});
}
function parseComments(buf,fileName){
  let rows;
  if(/\.txt$/i.test(fileName)) rows = new TextDecoder().decode(buf).split(/\r?\n/).map(l=>[l]);
  else {const wb=XLSX.read(buf,{type:'array'}); rows=[]; wb.SheetNames.forEach(n=>{XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null}).forEach(r=>rows.push(r.map(c=>c==null?'':String(c).trim())));});}
  const out=[], seen=new Set();
  rows.forEach(r=>{
    const cells=(r||[]).map(c=>String(c??'').trim()).filter(Boolean);
    const longs=cells.filter(c=>c.length>12), shorts=cells.filter(c=>c.length<=12&&!/^\d+$/.test(c));
    longs.forEach(t=>{if(!seen.has(t)){seen.add(t);out.push({cat:shorts[0]||'',text:t});}});
  });
  return out;
}

};

/* ---------- 출석 ---------- */
const PRESENT=/^(o|ㅇ|○|◯|●|출|출석|v|✓|✔|1|true|y)$/i, ABSENT=/^(x|×|결|결석|0|false|n|-)$/i;
function toRate(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return v<=1.0001? v*100 : v;
  const m=String(v).match(/(\d+(?:\.\d+)?)\s*%?/); if(!m) return null; const n=+m[1];
  return /%/.test(v)||n>1? n : n*100;
}
const DOW = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function fixHol(){ if(String(settings.holidays||'').replace(/\s/g,'')==='9/24,9/25') settings.holidays='9/4, 9/24, 9/25'; }
function holidaySet(){ fixHol(); return new Set(String(settings.holidays||'').split(/[,\s]+/).map(s=>{ const m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})$/); return m? (+m[1])+'/'+(+m[2]) : ''; }).filter(Boolean)); }
function readBook(buf,name){
  if(/\.csv$/i.test(name||'')){ let txt=new TextDecoder('utf-8').decode(buf); if(txt.includes('\uFFFD')) try{ txt=new TextDecoder('euc-kr').decode(buf); }catch(e){} return XLSX.read(txt.replace(/^\uFEFF/,''),{type:'string',raw:true}); }
  return XLSX.read(buf,{type:'array'});
}
/* 날짜별 출석표: 수련요일 기준으로 그 달 수업일을 세고, 휴무일과 '—' 날은 빼고, 하루에 여러 번 와도 1회 */
function parseDaily(rows,hi,h){
  const dcols = h.map((x,i)=>{ const m=x.match(/^(\d{1,2})\/(\d{1,2})$/); return m? {i, m:+m[1], d:+m[2]} : null; }).filter(Boolean);
  const si = h.findIndex(x=>x.includes('수련요일')||x==='요일');
  if(dcols.length<5 || si<0) return null;
  const {y,m:rm}=reportMonth(), mon=dcols[0].m, year = mon>rm? y-1 : y;
  const hol=holidaySet(), ni=h.indexOf('이름'), bi=h.findIndex(x=>x.startsWith('출생'));
  return {month:year+'-'+String(mon).padStart(2,'0'), rows: rows.slice(hi+1).filter(r=>r&&r[ni]).map(r=>{
    const days=new Set(String(r[si]??'').split(/[,\s·/]+/).map(s=>DOW[s.trim().slice(0,1)]).filter(v=>v!=null));
    let an=0, at=0;
    dcols.forEach(c=>{
      if(hol.has(c.m+'/'+c.d)) return;
      const s=String(r[c.i]??'').trim(), dow=new Date(year,c.m-1,c.d).getDay();
      if(/^[—–-]+$/.test(s)) return;
      const came = /\d/.test(s) && !/^x/i.test(s);
      if(days.has(dow)) at++;
      if(came) an++;
    });
    return {name:String(r[ni]).trim(), birth:bi>=0?r[bi]:null, an:Math.min(an,at), at, rate: at? Math.round(Math.min(an,at)/at*100) : null, belt:''};
  })};
}
function parseAttendance(buf,name){
  const wb=readBook(buf,name); let best=null;
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});
    const hi=rows.findIndex(r=>r&&r.some(c=>String(c??'').replace(/\s/g,'')==='이름'));
    if(hi<0) continue;
    const daily=parseDaily(rows,hi,rows[hi].map(c=>String(c??'').replace(/\s/g,'')));
    if(daily) return daily;
  }
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});
    const hi=rows.findIndex(r=>r&&r.some(c=>String(c??'').replace(/\s/g,'')==='이름'));
    if(hi<0) continue;
    const h=rows[hi].map(c=>String(c??'').replace(/\s/g,''));
    const ni=h.indexOf('이름'), bi=h.findIndex(x=>x.startsWith('출생')), beltI=h.findIndex(x=>x==='띠'||x==='현재띠');
    const rateI=h.findIndex(x=>x.includes('출석률')||x==='출석%');
    const cntI=h.findIndex(x=>/^(출석|출석횟수|출석일수|출석수)$/.test(x)), totI=h.findIndex(x=>/^(수업|수업일|수업일수|전체|총|총수업|총일수|수업횟수)$/.test(x));
    const body=rows.slice(hi+1).filter(r=>r&&r[ni]);
    let dateCols=[];
    if(rateI<0 && !(cntI>=0&&totI>=0)){
      dateCols=h.map((x,i)=>i).filter(i=>i!==ni && body.some(r=>PRESENT.test(String(r[i]??'').trim())));
    }
    const out=[];
    body.forEach(r=>{
      let rate=null, an=null, at=null;
      if(cntI>=0&&totI>=0&&+r[totI]>0){ an=+r[cntI]; at=+r[totI]; rate=an/at*100; }
      else if(rateI>=0) rate=toRate(r[rateI]);
      else if(dateCols.length){ let p=0,tot=0; dateCols.forEach(i=>{const s=String(r[i]??'').trim(); if(PRESENT.test(s)){p++;tot++;} else if(ABSENT.test(s)||s==='') tot++;}); if(tot){ an=p; at=tot; rate=p/tot*100; } }
      out.push({name:String(r[ni]).trim(), birth:bi>=0?r[bi]:null, an, at, rate: rate==null?null:Math.round(rate), belt: beltI>=0? normBelt(r[beltI]) : ''});
    });
    if(out.some(o=>o.rate!=null||o.belt) && (!best||out.length>best.length)) best=out;
  }
  if(!best) throw new Error('"이름" 줄과 출석률(또는 출석/수업 횟수, 날짜별 출석 표시)을 찾지 못했어요.');
  return {month:null, rows:best};
}

};

let downloads=null;
function setProgress(t){document.querySelectorAll('.progress').forEach(p=>{p.hidden=!t;p.textContent=t||'';});}
downloads = { async save({filename,data}){
  const file = new File([data], filename, {type:data.type||'application/octet-stream'});
  const touch = matchMedia('(pointer:coarse)').matches;
  if(touch && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }catch(e){ if(e&&e.name==='AbortError'){ const d=new Error('취소'); d.code='declined'; throw d; } }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000);
} };
async function makePng(k){
  const r=$('render'); await document.fonts.ready;
  r.innerHTML=pages(k)[0];
  await Promise.all([...r.querySelectorAll('img')].map(im=>im.complete?0:new Promise(ok=>{im.onload=im.onerror=ok;})));
  const c=await html2canvas(r.firstElementChild,{scale:2,backgroundColor:'#ffffff',logging:false});
  r.innerHTML='';
  return await new Promise(ok=>c.toBlob(ok,'image/png'));
}

  finally{ btn.disabled=false; }
};

function askDl(){
  if(dlOkUntil>Date.now()) return Promise.resolve(true);
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:rgba(20,20,30,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML='<div style="background:#fff;border-radius:18px;padding:20px;width:100%;max-width:340px;font-family:inherit"><b style="font-size:17px">관리자 비밀번호</b><p style="font-size:13.5px;color:#666;margin:6px 0 10px">성장 측정 백업 파일에는 원생 기록이 있어서 관리자 비밀번호를 한 번 더 확인해요.</p><input id="dlP" type="password" maxlength="100" autocomplete="off" style="width:100%;font-size:18px;padding:10px;border:1px solid #ccc;border-radius:10px"><p id="dlM" style="color:#C0392B;font-size:13px;min-height:18px;margin:6px 0"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button id="dlX" class="btn" type="button">취소</button><button id="dlOk" class="btn" type="button">확인</button></div></div>';
    document.body.appendChild(ov); const g=id=>ov.querySelector('#'+id); setTimeout(()=>g('dlP').focus(),50);
    const done=v=>{ov.remove();res(v);};
    g('dlX').onclick=()=>done(false);
    const go=async()=>{const pin=g('dlP').value; if(!pin) return; let j; try{ j=await tcall('/api/dl-check',{pin}); }catch(e){ j={ok:false,error:e.message}; } if(!j||!j.ok){ g('dlM').textContent=(j&&j.error)||'확인하지 못했어요'; g('dlP').value=''; return; } dlOkUntil=Date.now()+5*60000; done(true); };
    g('dlOk').onclick=go; g('dlP').onkeydown=e=>{ if(e.key==='Enter') go(); };
  });
}
